# signing-keys.yaml
# The release signing keys of projects people commonly download, for Verify a download
# (tools/verify.py, tools/keys.py). Facts, each with where it was confirmed and when; never a judgement
# of the project.
#
# SCHEMA (per project)
#   id        Stable identifier.
#   name      Who signs, as the user sees it ("Signed by <name>'s key").
#   signs     What that key signs, in words.
#   source    The project's own HTTPS page that publishes the fingerprints. The fingerprints below were
#             confirmed there (or as `note` says) on `checked`.
#   key_from  Where the key material below was downloaded from. It need not be trusted: the loader
#             recomputes each key's fingerprint and refuses a key that doesn't match `keys`.
#   checked   The date the fingerprints were confirmed (YYYY-MM-DD).
#   note      Optional: how it was confirmed when the page alone didn't do it, and what was left out.
#   files     Shell patterns of the file names it publishes: used only to say what to download to verify
#             a file (`how`) when nothing is next to it, never to decide a verdict.
#   how       What to download next to the file to verify it, in plain words.
#   keys      The primary keys' fingerprints (40 hex digits, v4) with a name for each.
#   key       The public keys, ASCII-armoured, exported minimal (gpg --export-options
#             export-minimal,export-clean), holding exactly the primary keys in `keys`.
#   checksums Optional: SHA-256s the project publishes on its own site for files it doesn't sign, each
#             {file, sha256, source (the https:// page it is on)}. A file with one of them is verified.
#   unsigned  Optional, true for a project that publishes no signature at all: then no key_from, keys
#             or key, and `how` says what it does publish (a checksum beside the file).
#
# Before a release, `packaging/check-signing-keys.py` fetches every `source` and checks each
# fingerprint is still on it; signing subkeys are renewed from time to time (Tor Browser's are),
# so re-export the keys from `key_from` then. A project goes in only once its fingerprints have been
# confirmed on its own site, never from a key server alone.

