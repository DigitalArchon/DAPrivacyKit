  - id: garuda
    name: Garuda Linux
    signs: Garuda Linux's ISO images (it signs none)
    source: https://iso.builds.garudalinux.org/iso/garuda/
    unsigned: true
    checked: 2026-10-05
    note: >
      Its ISO server offers only .sha1 and .sha256 files beside each ISO, no signature.
    files: ["garuda-*.iso"]
    how: >
      Garuda Linux doesn't sign its ISOs. Download the .sha256 file from the same folder and put it next
      to the ISO: that shows the download isn't damaged, though not who made it (whoever could change
      the ISO on the server could change that file too).

  - id: bazzite
    name: Bazzite
    signs: Bazzite's ISO images (it signs none; its container images are signed with cosign)
    source: https://download.bazzite.gg/
    unsigned: true
    checked: 2026-10-05
    note: >
      The download server offers a -CHECKSUM file beside each ISO and no signature; Bazzite signs its
      container images (cosign), which an installed system checks with ujust verify-image.
    files: ["bazzite-*.iso"]
    how: >
      Bazzite doesn't sign its ISOs. Download the matching -CHECKSUM file from the same place and put it
      next to the ISO: that shows the download isn't damaged, though not who made it. Once installed,
      ujust verify-image checks the system image Bazzite did sign.
