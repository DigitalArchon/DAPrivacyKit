# privacy-checks.yaml
# Catalogue of privacy checks for a Linux desktop privacy auditing app.
#
# SCHEMA (per check)
#   id          Stable identifier, "<category-prefix>.<name>". Never rename once shipped.
#   title       Short human-readable name.
#   category    encryption | auth | network | telemetry | browser | desktop | apps | sandbox | kernel
#   severity    Base severity 0-10 (see scale below).
#   modifiers   Optional list of {when, severity}. `when` is an expression over the
#               context keys below; the LAST matching modifier wins. severity 0 = not applicable.
#   warn_lower  How much lower a warning is than a failure of the same check in the same context
#               (at least 2, default 2; never below 1, and 0 stays 0). A warning is a Risk on the page
#               (possible, partial, or not happened yet), a failure a Problem: the one severity number
#               ranks both, so a risk is always rated below the problem it could become. Every check
#               that can warn states it (a test finds them).
#   scope       user (runs unprivileged) | system (needs root for full detection or fix)
#               | online (contacts other machines; runs only when the user starts the online tests,
#                 never in a normal scan)
#   contacts    Online checks only, required: who the check contacts and what each learns
#               (the defaults; endpoints can be changed in $XDG_CONFIG_HOME/daprivacyscanner/online.json).
#   tier        auto     = safe, reversible, can be applied after one confirmation
#               guided   = needs user decisions, root, or has side effects; walk the user through it
#               advice   = explain only; the app must not attempt the change
#               feature  = not a pass/fail check; an optional tool the app offers
#   applies_to  Optional list of distros / desktops / apps. Omitted = everywhere.
#   why         What leaks and to whom.
#   detect      Ordered hints for detection: commands, files, keys. Hints, not final code.
#   fix         How the fix works: notes for developers (commands, files, keys, caveats), shown
#               only in developer mode.
#   remedy      What to do, in plain words for the user: what the problem means for them, what
#               to do about it, and which button does it (Fix…, Clean…, Guide…, How to…, Set up…).
#               Advice checks with a guide of their own get How to…: steps the user takes,
#               never changes made by the app.
#   related     Optional ids of checks that interact with this one.
#   verify      Optional. Present when a path, key name or behaviour should be confirmed
#               on a real system before the app relies on it or states it as fact.
#   kind        finding (default) = a problem to act on; hygiene = residue of normal use (caches,
#               histories) that most machines have, listed and cleaned but not counted as a
#               finding; info = an inventory worth knowing about, never a pass or a fail.
#   easy        Optional. The check's fix is an Easy fix: one the user loses nothing (or next to nothing)
#               by, that needs no input, can be reverted from History, and is offered with the other easy
#               ones after a scan, applied together after one dry run and one confirmation. Only for
#               `auto` and `guided` checks, and only while the check fails or warns.
#                 true, or a mapping of:
#                 option  guided checks, required: the key of the guide's options it applies (every
#                         option with that key in a step not done yet; the guide declares its keys)
#                 cost    what the user gives up, in plain words, shown beside it ("" = nothing worth
#                         saying). Deleting regenerable caches, a restart before it takes effect and
#                         any small risk belong here.
#   meanwhile   Optional, on a check the app can't fix (advice): what to do until it is fixed.
#                 text    why, and what these do and don't do, in plain words
#                 checks  ids, most worthwhile first; each shown with its state and its own button
#
# SEVERITY SCALE
#   9-10  Nearly all data exposed to anyone who gets the device or network access
#   6-8   High-value secrets or broad data exposed under plausible conditions
#   3-5   Activity or metadata leaks, or attacker already needs some access
#   1-2   Defence in depth
#
# CONTEXT KEYS (computed once per scan, before any check runs)
#   fde                 'none' | 'home' | 'partial' | 'full'   (from enc.fde_missing / enc.partial_fde; 'home': / isn't
#                                                         encrypted but the home folder is: LUKS, fscrypt or eCryptfs)
#   virtualization      'none' | 'vm' | 'container'      (systemd-detect-virt; DMI vendor, cpuinfo hypervisor flag)
#   device              'laptop' | 'desktop'             (/sys/class/dmi/id/chassis_type or hostnamectl chassis;
#                                                         unknown in a VM: the host's form factor can't be seen)
#   multi_user          bool   (more than one human account: UID >= 1000 with a login shell)
#   session             'wayland' | 'x11'                ($XDG_SESSION_TYPE)
#   hibernation         bool   (the kernel can, disk swap large enough, a resume device configured, systemd's sleep.conf
#                               and drop-ins allow hibernate, suspend-then-hibernate or hybrid sleep, and logind lets this
#                               user: CanHibernate yes or challenge; "no", Ubuntu's policy, is false with a one-step-away
#                               note; unknown when logind can't be asked)
#   tpm_unlock_no_pin   bool   (from enc.tpm_no_pin; needs root to read LUKS headers)
#   autologin           bool   (from auth.autologin)
#   exposed_services    bool   (from net.exposed_services)
#   vpn_active          bool   (a WireGuard or tun tunnel carries this machine's internet traffic, IPv4 or IPv6:
#                               the interface `ip route get <public address>` names, so policy routing
#                               (wg-quick, NetworkManager WireGuard, VPN apps) counts; TAP devices (VMs)
#                               and split tunnels or mesh networks that carry only some networks don't)
#   ipv6_global         bool   (an internet-routable IPv6 address, not fc00::/7, is assigned to an interface
#                               other than a VPN tunnel: a VPN's in-tunnel address isn't reachable from outside)
#
#   A `when` expression may also use a name that is not a context key; that name is a
#   finding produced by the check itself (e.g. desk.thumbnails sets
#   thumbnails_reference_removable_or_container, thumbnails_on_disk_none_leaking and thumbnails_expire; desk.indexers
#   sets indexes_outside_home and index_on_unencrypted_disk; net.exposed_services sets
#   firewall_blocks_exposed; kern.updates sets security_updates_pending, kernel_update_pending and
#   kernel_restart_pending; kern.package_signatures sets signature_checks_off and unsigned_over_http;
#   net.vpn_trust and br.vpn_extensions set vpn_avoid, vpn_closed_client and
#   vpn_ownership_concerns; br.surveillance_browsers sets chrome_or_edge_installed, surveillance_default
#   and chrome_or_edge_default; br.default_browser sets default_closed_ui;
#   auth.ssh_client_settings sets agent_forwarded_everywhere, host_keys_unchecked and agent_keys_unlimited;
#   auth.ssh_authorized_keys sets sshd_reachable and weak_authorized_keys; auth.gpg_keys sets gpg_weak_key;
#   br.site_permissions sets site_default_allow).
#   data_on_encrypted_disk is set by the runner, for every check whose modifiers use it: whether what the
#   check found is on encrypted storage (Check.stored_at says where: the user's folders unless the check says
#   otherwise; a check may set it itself, as enc.snapshots_retain_deleted does). Disk encryption keeps it safe
#   while the computer is off, not from malware or someone using it while it is on, so each modifier on it is
#   one lower than the severity it would otherwise have (never below 1), and the runner adds a note saying so.
#   A finding the check can't determine is unknown, like a context key.
#
# PATH CONVENTIONS
#   Every per-app path must be resolved for native, Flatpak and Snap installs:
#     native:  $XDG_CONFIG_HOME (~/.config), $XDG_DATA_HOME (~/.local/share),
#              $XDG_CACHE_HOME (~/.cache), $XDG_STATE_HOME (~/.local/state)
#     flatpak: ~/.var/app/<app-id>/{config,data,cache,.local/state}
#     snap:    ~/snap/<name>/{current,common}/ (plus one dir per retained revision)

schema_version: 1

checks:

# ---------------------------------------------------------------------------
# ENCRYPTION AND DATA AT REST
# ---------------------------------------------------------------------------

  - id: enc.fde_missing
    title: Full-disk encryption not enabled
    category: encryption
    severity: 10
    modifiers:
      - when: "fde == 'home'"
        severity: 7
      - when: "fde == 'home' and home_ecryptfs"
        severity: 8
    scope: user
    tier: advice
    why: >
      Anyone who takes the device or boots a live USB can read every file. Most other
      at-rest checks become far more serious when this fails. No kind of computer makes an
      unencrypted fixed disk acceptable: a desktop gets stolen in a burglary, sent for repair,
      sold or thrown away with its disk, so it is critical on every machine. Encrypting only the home folder
      leaves logs, saved Wi-Fi passwords, /tmp and swap readable, and the unencrypted system can be
      changed to capture the password: eCryptfs (deprecated, leaks sizes and layout) is the weakest,
      fscrypt (ext4/F2FS native, leaks sizes and timestamps) better, full-disk encryption the target.
    detect:
      - 'lsblk -J -o NAME,TYPE,FSTYPE,MOUNTPOINTS'
      - 'Walk parents of the device mounted at / (or /sysroot on ostree systems); pass if any ancestor has TYPE == "crypt"'
      - 'Root not encrypted: the home folder may be (fde = home): an ecryptfs mount over it (/proc/mounts), a dm-crypt
        device under it (a LUKS /home, or a systemd-homed LUKS image), or fscrypt (lsattr -d ~ shows E)'
    fix: >
      Explain options: reinstall with encryption (safest), or offline in-place conversion
      with "cryptsetup reencrypt --encrypt" (risky, requires full backup). Never automate. Home folder
      encryption is noted as not enough; eCryptfs as deprecated.
    remedy: >
      Anyone who has this disk, taken from the computer or read from a USB stick, can read everything on
      it. Encrypt the whole disk: it really is worth backing up your files and reinstalling, choosing
      encryption in the installer (converting a disk in place is possible but risky). An encrypted home
      folder alone leaves the rest of the system readable, and eCryptfs is no longer recommended. How to…
      goes through it for this computer; until then, the details list what keeps the most sensitive
      things off the disk meanwhile.
    related: [enc.partial_fde, auth.autologin]
    meanwhile:
      text: >
        Until the disk is encrypted, these keep the most sensitive things off it: passwords and keys in
        swap, temporary files, thumbnails of your pictures, notes about the files you open, crash dumps
        and logs. They stop new traces being written to the disk; they don't remove what is already on
        it, and your documents themselves stay readable to anyone who has the disk. For files that
        should stay private, use ~/Ephemeral for the ones you need only for now, and for the ones that
        should last, an encrypted vault made with Cryptomator (~/Ephemeral's guide explains it).
      checks: [enc.swap_unencrypted, enc.hibernate_unencrypted, enc.tmp_on_disk, desk.thumbnails, desk.gvfs_metadata,
               app.editor_residue, enc.coredumps_retained, enc.journal_persistent, desk.indexers, desk.recent_files,
               enc.trim_off, desk.ephemeral_folder]

  - id: enc.partial_fde
    title: Some mounted filesystems are not encrypted
    category: encryption
    severity: 8
    modifiers:
      - when: "fde == 'none' or fde == 'home'"
        severity: 0
    scope: user
    tier: advice
    why: >
      Root is encrypted but /home, a second drive, or a data partition is not, so the
      user's files may sit in plain text while the system appears protected.
    detect:
      - 'lsblk -J -o NAME,TYPE,FSTYPE,MOUNTPOINTS,RM,HOTPLUG'
      - 'For every mounted block filesystem except /boot and /boot/efi, require a crypt ancestor'
      - 'Ignore removable/hotplug devices here (see enc.removable_unencrypted)'
    fix: Recommend encrypting the affected volume (LUKS) after backing it up.
    remedy: >
      Some filesystems here aren't encrypted. Back up what's on them, then encrypt them; How to… lists
      which ones and how.

  - id: enc.unmounted_unencrypted
    title: Partitions that aren't in use hold unencrypted data (Windows, an old system, a spare disk)
    category: encryption
    severity: 6
    scope: user
    tier: advice
    why: >
      The checks on disk encryption look at the filesystems in use. A Windows installation beside this
      system, the partition of an earlier one, or a data disk that isn't mounted right now is just as
      readable to anyone who takes the computer or the drive: its documents, its browser profiles and
      saved passwords, and on Windows the hibernation and page files, which hold what was in memory.
    detect:
      - 'lsblk -J -b -o NAME,TYPE,FSTYPE,MOUNTPOINTS,RM,HOTPLUG,TRAN,LABEL,SIZE,PARTTYPE,UUID'
      - 'Fixed drives only: a data filesystem (ntfs, exfat, vfat, ext2/3/4, btrfs, xfs, f2fs, apfs, hfsplus...) with no mount point and no crypt ancestor, 2 GiB or larger'
      - 'Left out: EFI system, boot, recovery and reserved partitions (PARTTYPE, or a recovery label), swap, LVM, RAID and ZFS members, the other devices of a mounted btrfs (same UUID), removable drives (see enc.removable_unencrypted)'
      - 'FSTYPE BitLocker and crypto_LUKS are encrypted: noted, never a finding'
    fix: Advice only; How to… says how to encrypt each from the system it belongs to, or how to clear one that is no longer needed.
    remedy: >
      Disk encryption protects only the partitions it was set up on. The ones listed here aren't in
      use by this system and aren't encrypted, so whoever has the computer or the drive can read
      them. How to… says what to do for each: encrypt it from Windows, encrypt it here, or clear it.
    related: [enc.fde_missing, enc.partial_fde, enc.removable_unencrypted]
    verify: >
      PARTTYPE in lsblk's JSON for MBR disks (0xef, 0x27); the recovery partitions' types and labels
      on OEM Windows installs (Dell, HP, Lenovo); how a BitLocker partition waiting for activation
      ("Device encryption" suspended, a clear key) appears in lsblk.

  - id: enc.swap_unencrypted
    title: Swap on an unencrypted device or filesystem
    category: encryption
    severity: 8
    modifiers:
      - when: "hibernation"
        severity: 9
    scope: user
    tier: guided
    why: >
      Decrypted data from encrypted volumes (documents, passwords, keys) is paged out
      in plain text. Without disk encryption it matters as much: swap is where passwords and keys
      that never touch a file land, and zram or a random-key swap keeps them off the disk until
      the disk is encrypted.
    detect:
      - 'swapon --show=NAME,TYPE --noheadings --raw'
      - 'TYPE partition: require crypt ancestor in lsblk'
      - 'TYPE file: resolve backing block device (findmnt -T <file>) and require crypt ancestor'
      - 'zram devices pass, unless they write pages back to a disk (/sys/block/zramN/backing_dev other than
        "none"): then the backing device must have a crypt ancestor like any other swap'
      - 'zram-generator configuration (/etc/systemd/zram-generator.conf, conf.d, and /usr/lib/systemd/...):
        a writeback-device= line means writeback is set up, even before it is in use'
    fix: >
      Move swap onto LUKS, or replace with zram (zram-generator, written by the helper when it is installed;
      never with a writeback device). Warn that ephemeral swap disables hibernation.
    remedy: >
      Swap holds pieces of memory, passwords included, on an unencrypted disk. Guide… replaces it with
      compressed swap in memory (zram), or encrypts it with a new key at every boot. Either one rules
      out hibernation.
    related: [enc.hibernate_unencrypted, enc.swap_persistent]

  - id: enc.hibernate_unencrypted
    title: Hibernation image written to unencrypted storage
    category: encryption
    severity: 9
    scope: user
    tier: guided
    why: >
      The hibernation image is a copy of all RAM, including LUKS master keys for other
      volumes, open documents and unlocked password manager contents. Without disk encryption
      it is still worth turning off: it is the one place where everything in memory, passwords
      included, is written to the disk at once.
    detect:
      - 'grep -o "resume=[^ ]*" /proc/cmdline; cat /sys/power/resume'
      - 'systemd''s sleep.conf and sleep.conf.d (AllowHibernation, AllowSuspendThenHibernate, AllowHybridSleep, merged as
        systemd does): all off, no hibernation'
      - 'logind: busctl call org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager CanHibernate
        (gdbus or dbus-send where busctl is missing): "no" is the system''s policy (Ubuntu''s com.ubuntu.desktop.rules,
        seen on 26.04), "na" not available'
      - 'Check the resume device (and resume_offset swap file) has a crypt ancestor'
    fix: Put swap on LUKS or disable hibernation (a sleep.conf.d drop-in turning off all three modes).
    remedy: >
      Hibernating writes everything in memory, disk keys included, to an unencrypted disk. Guide…
      turns hibernation off, or puts swap on encrypted storage.

  - id: enc.swap_persistent
    title: Swap keeps old memory on the disk across restarts
    category: encryption
    severity: 3
    scope: user
    tier: guided
    why: >
      Old swapped-out data stays on the disk after a reboot. Encrypted under a key unlocked at every boot,
      it is still readable by anyone with administrator access while the machine is unlocked (or malware
      running as root), and by anyone who later gets the LUKS passphrase (for example through compelled
      disclosure). The same goes for zram writing back to a disk.
    detect:
      - 'If swap is zram: check /sys/block/zram*/backing_dev; anything other than "none" means writeback to disk,
        judged like any swap device: persistent unless it is a crypt device with a random key in /etc/crypttab'
      - 'zram-generator configuration with writeback-device= (set up, if not in use yet)'
      - 'If swap is LUKS: check /etc/crypttab for a random key (/dev/urandom) vs a persistent keyslot'
      - 'Note: zswap (/sys/module/zswap/parameters/enabled) still writes to disk swap; it is not zram'
    fix: >
      Offer zram-generator (the helper writes /etc/systemd/zram-generator.conf, without writeback, when
      zram-generator is installed, no zram is in use and there is no configuration; zram already on (Omarchy):
      only the disk swap's removal; configured but not running: started), or crypttab swap with a random key (a
      partition by PARTUUID, a logical volume by /dev/mapper/NAME, saying when it is inside LUKS already, an encrypted
      swap volume's crypttab line replaced). Warn that they rule out hibernation. Taking the disk swap out of
      /etc/fstab, and deleting a swap file afterwards (with what deleting doesn't do), stay commands for the user.
      Devices are named /dev/mapper/NAME, never /dev/dm-N. zram writeback: commands to delete the
      writeback-device line (copying the distribution's file to /etc first) and reboot, or encrypt the writeback
      device with a random key. A note explains who can read earlier sessions' swap.
    remedy: >
      Swap on disk keeps pieces of earlier sessions. Guide… offers swap in memory (zram) or swap with
      a fresh random key at every boot, so nothing survives a restart.

  - id: enc.luks_weak_kdf
    title: Disk encryption passphrase is easier to brute-force than it needs to be (LUKS key slots)
    category: encryption
    severity: 5
    scope: system
    tier: guided
    why: >
      LUKS1 and PBKDF2 keyslots are much cheaper to brute-force than Argon2id. Common on
      installs that encrypt /boot for GRUB.
    detect:
      - 'cryptsetup luksDump <device>  (root)'
      - 'Flag "Version: 1" or any keyslot with "PBKDF: pbkdf2"'
    fix: >
      Explain "cryptsetup luksConvertKey --pbkdf argon2id". Warn that GRUB-decrypted /boot
      may not support Argon2id and the machine could become unbootable.
    remedy: >
      Some passphrases of the encrypted disk are protected by an older method (PBKDF2) that makes
      guessing them far cheaper. Guide… gives the command to convert each one to Argon2: it takes a
      few seconds and asks for that passphrase. Keys held by a security key, TPM or recovery key are
      fine as they are. If GRUB unlocks the disk at boot, the guide explains what to do instead.

  - id: enc.tpm_no_pin
    title: TPM-only disk unlock without a PIN
    category: encryption
    severity: 6
    modifiers:
      - when: "autologin"
        severity: 10
    scope: system
    tier: guided
    why: >
      The disk unlocks automatically at boot, so protection depends entirely on the login
      screen. Combined with autologin, nothing protects the data.
    detect:
      - 'cryptsetup luksDump <device>: systemd-tpm2 token with "tpm2-pin: false"'
      - 'clevis luks list -d <device> (tpm2 pin)'
      - 'grep tpm2-device /etc/crypttab'
    fix: 'systemd-cryptenroll --wipe-slot=tpm2 --tpm2-device=auto --tpm2-with-pin=yes <device>'
    remedy: >
      The disk unlocks with the TPM chip alone, so anyone holding the computer can start it with the
      disk unlocked. Guide… enrols the TPM again with a PIN asked at every boot.
    related: [auth.autologin]

  - id: enc.backups_unencrypted
    title: Backups are not encrypted
    category: encryption
    severity: 7
    scope: user
    tier: guided
    why: Backups often outlive the original data and are stored on easily lost drives.
    detect:
      - 'Timeshift: /etc/timeshift/timeshift.json (Timeshift has no encryption)'
      - 'Déjà Dup: gsettings list-recursively org.gnome.DejaDup; check repository for encryption'
      - 'Duplicity: volumes ending in .gpg are encrypted'
      - 'Borg: borg info <repo> shows Encrypted; restic always encrypts'
      - 'Back In Time: ~/.config/backintime/config profileN.snapshots.mode (local_encfs/ssh_encfs, newer
        local_gocryptfs/ssh_gocryptfs encrypt; ssh doesn''t; local is judged by the drive of snapshots.path)'
      - 'Kup: ~/.config/kuprc [Plan/N]: it never encrypts, so Destination type 0 (Filesystem destination path) or 1
        (External drive UUID) is judged by its drive'
      - 'Vorta: $XDG_DATA_HOME/Vorta/settings.db repomodel.encryption (Vorta 0.11.6, tested); Pika Backup:
        ~/.config/pika-backup/config.json encryption_mode (0.8.4, from the program); borg''s none and authenticated
        modes are unencrypted'
    fix: Recommend an encrypting tool (restic, borg, Déjà Dup with encryption) or a LUKS target drive.
    remedy: >
      Backups hold copies of your files, deleted ones included, without encryption. Guide… shows how
      to switch to an encrypting backup tool or an encrypted drive.

  - id: enc.removable_unencrypted
    title: External or removable drives are not encrypted
    category: encryption
    severity: 5
    scope: user
    tier: advice
    detect:
      - 'lsblk -J -o NAME,FSTYPE,RM,HOTPLUG,TRAN,LABEL,MOUNTPOINTS; flag removable devices without crypto_LUKS'
      - 'Removable: RM, a USB or FireWire transport, or HOTPLUG except on SATA (firmware hot-swap marks internal drives)'
      - 'Installer and boot sticks (a hybrid ISO image, Ventoy''s VTOYEFI or Ventoy labels) are left out, and named'
    fix: Offer guidance to format new drives with LUKS (GNOME Disks / KDE Partition Manager).
    remedy: >
      Anyone who finds or borrows this drive can read it. Copy its files off, then format it with
      encryption; How to… shows how with your desktop's disk tool.

  - id: enc.coredumps_retained
    title: Core dumps and crash reports kept on disk
    category: encryption
    severity: 5
    warn_lower: 2
    kind: hygiene
    scope: system
    tier: guided
    why: Dumps contain process memory from browsers, password managers and messengers.
    detect:
      - 'cat /proc/sys/kernel/core_pattern'
      - 'systemd-coredump: Storage= in /etc/systemd/coredump.conf and coredump.conf.d/*; where the pattern hands it the
        program''s own limit (%c: Fedora, Arch; Ubuntu and Mint hand it a fixed one), a limit under a page stores nothing'
      - 'ls /var/lib/systemd/coredump; coredumpctl list'
      - 'apport (Ubuntu): /var/crash/*.crash; grep enabled /etc/default/apport'
      - 'A pipe to /bin/false or /bin/true keeps nothing; to a program the app doesn''t know: couldn''t check'
      - 'A plain core file name: the soft core size limit of the programs the user runs (the app''s parent''s
        /proc/PID/limits, never the app''s own, which it sets to 1; systemctl --user show -p DefaultLimitCORESoft), under
        a page: none written'
      - 'Kept but none there now: a risk, not a problem'
    fix: 'Drop-in coredump.conf.d with Storage=none and ProcessSizeMax=0; delete existing dumps; disable apport.'
    remedy: >
      Crash dumps hold the memory of programs that crashed: passwords and documents can be in them.
      Guide… deletes them and stops new ones being kept.
    easy:
      option: turn_off
      cost: "Developers lose the core dumps they debug crashes with; the crash itself is still logged."

  - id: enc.snapshots_retain_deleted
    title: Filesystem snapshots keep deleted files
    category: encryption
    severity: 4
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 3
    scope: system
    tier: guided
    applies_to: [openSUSE (Snapper default), btrfs, zfs, Timeshift]
    detect:
      - 'snapper list-configs; snapper -c <cfg> list'
      - 'btrfs subvolume list -s /'
      - 'zfs list -t snapshot'
      - '/etc/timeshift/timeshift.json (btrfs mode, include @home?)'
      - 'btrbk: /etc/btrbk/btrbk.conf (or /etc/btrbk.conf); snapshot_preserve_min is "all" unless set (every snapshot
        for ever, btrbk.conf(5), btrbk 0.32), and weeks, months or years in it or in snapshot_preserve are long (tested
        with btrbk''s example config on CachyOS)'
      - 'Whether the home folder is in them (a fail whatever the retention): on btrfs, the subvolume holding the home
        folder (its mount''s subvol= in /proc/mounts, and the topmost folder above it with its st_dev, since each
        subvolume has its own: a nested subvolume isn''t in its parent''s snapshots) against each snapper SUBVOLUME,
        btrbk volume/subvolume (globs allowed) and Timeshift''s @ (and @home with include_btrfs_home_for_backup); on
        ZFS, the dataset mounted at or above the home folder (zfs list -t filesystem) among those with snapshots'
    fix: >
      Explain that deleted files persist until snapshots expire; take the home folder out of them (Timeshift's
      include_btrfs_home_for_backup through the helper; snapper, btrbk and ZFS as commands), and shorter retention.
    remedy: >
      Snapshots keep every file you delete until the snapshot itself goes. If your home folder is in them, every
      personal file you delete stays too: Guide… takes it out of them. Guide… also keeps fewer snapshots and deletes
      the extra ones, or turns snapshots off (and explains what you lose). Where your home folder isn't in them,
      keep it that way: it is where most of your personal data is.

  - id: enc.journal_persistent
    title: System journal kept indefinitely
    category: encryption
    severity: 3
    warn_lower: 2
    kind: hygiene
    scope: system
    tier: guided
    why: Records USB serials, Wi-Fi SSIDs, volume labels, sudo command lines and app messages.
    detect:
      - 'test -d /var/log/journal'
      - 'Storage=volatile with files still in /var/log/journal: kept in memory from now, older logs still on disk'
      - 'systemd-analyze cat-config systemd/journald.conf  (Storage, MaxRetentionSec, SystemMaxUse)'
      - 'MaxRetentionSec as a systemd time span: more than about a month (31 days) is still a finding'
      - 'A syslog daemon (rsyslog.service, syslog-ng.service, syslog-ng@default.service) running with its text logs in
        /var/log (helper.SYSLOG_FILES: syslog, messages, auth.log... and Arch syslog-ng''s *.log names, with rotated
        copies): a finding whatever the journal is set to. Running with none (Arch''s syslog-ng.conf ships with every
        destination commented out, tested) is not; text logs left with no daemon running are a warning'
    fix: >
      Drop-in journald.conf.d with MaxRetentionSec=2week (or Storage=volatile); journalctl --vacuum-time=2weeks. One
      drop-in holds either, so a limit is never offered over Storage=volatile (the step is done), nor one longer than
      the limit set. Once in memory, the files left in /var/log/journal (system.journal and user-*.journal, which
      --vacuum-time never deletes) through the helper's clear_journal_files, its folders kept, refused while journald
      has one open. Where a syslog daemon writes text logs: stop and disable it, then delete them (the helper's
      clear_syslog, by fixed names, refused while one runs), named as this machine has them (Debian's syslog and
      auth.log, Fedora's messages and secure). Tested on CachyOS with syslog-ng writing /var/log/messages and auth.log.
      The size on the disk is what the files take (st_blocks), not their length.
    remedy: >
      The system log keeps a record of activity on disk with no time limit, and a syslog program may keep a
      second copy in text files. Guide… limits it to two weeks, or keeps it in memory only and deletes what is
      left on the disk, and turns off the second copy.
    easy:
      option: two_weeks
      cost: "System log entries older than two weeks are deleted as they age."

  - id: enc.trash
    title: Trash not emptied (including on removable drives)
    category: encryption
    severity: 3
    kind: hygiene
    scope: user
    tier: auto
    detect:
      - '$XDG_DATA_HOME/Trash/{files,info}'
      - 'For each mount: <mount>/.Trash-$UID and <mount>/.Trash/$UID'
      - 'GNOME: gsettings get org.gnome.desktop.privacy remove-old-trash-files / old-files-age'
      - 'KDE: ~/.config/ktrashrc, group named after the trash folder: UseTimeLimit, Days'
    fix: >
      Empty on confirmation: each item in files/ whole (a folder with what is in it, empty ones too; a link as a link,
      never followed; DeleteFiles(whole=True)) and the records in info/. Turn on automatic removal of old trash where
      the desktop does it: GNOME after 30 days (its own setting); KDE: ktrashrc's time limit of 30 days for the home
      trash. Cinnamon's schema has the same keys as GNOME's, but nothing in Cinnamon 6.6 reads them (grep on Mint 22.3):
      not set there.
    remedy: >
      Clean… empties the trash and, on GNOME and KDE Plasma, has items older than 30 days removed automatically from
      now on.
    verify: ktrashrc's group and key names (UseTimeLimit, Days) and that Plasma applies the limit by itself.

  - id: enc.boot_no_secureboot
    title: Unencrypted /boot without Secure Boot (evil-maid risk)
    category: encryption
    severity: 3
    warn_lower: 2
    modifiers:
      - when: "fde == 'none' or fde == 'home'"
        severity: 0
    scope: user
    tier: advice
    why: >
      An attacker with brief physical access can modify the initramfs to capture the disk passphrase. Secure Boot
      as distributions ship it (shim, GRUB, a signed kernel) doesn't check the initramfs or GRUB's configuration;
      a unified kernel image (UKI), signed as a whole, does.
    detect:
      - 'Where the kernels and initramfs are, and that none of it has no crypt ancestor: /boot when it holds vmlinuz* or
        initrd* (its own partition, or a folder of the root filesystem), and an EFI partition mounted at /efi, /boot/efi
        or /boot that holds them (unified kernel images in EFI/Linux, what systemd-boot''s loader/entries/*.conf name in
        their linux and initrd lines); a booted UKI came from the EFI partition even where it can''t be listed (umask=0077)'
      - 'A UKI booted: systemd-stub sets the StubInfo-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f EFI variable'
      - 'Secure Boot: the SecureBoot EFI variable under the EFI global GUID, SecureBoot-8be4df61-93ca-11d2-aa0d-00e098032b8c
        (efivarfs, readable by all; old sysfs efi/vars); UEFI with efivars visible but no SecureBoot variable = not
        supported (off); then mokutil --sb-state (stdout and stderr); then the kernel log line "secureboot: Secure boot
        enabled|disabled"'
      - 'Kernel lockdown (/sys/kernel/security/lockdown): mentioned only in confidentiality mode, in plain words'
    fix: >
      Explain Secure Boot, and that only a signed UKI brings the initramfs under the signature: with shim and GRUB,
      Secure Boot on is a warning, not a pass. A TPM bound to PCR 7 alone doesn't notice a changed initramfs either.
      Drivers built on the machine (DKMS, akmods) are signed with its own key (/var/lib/shim-signed/mok/MOK.der,
      /var/lib/dkms/mok.pub, /etc/pki/akmods/certs/public_key.der): `mokutil --test-key` (as the user) says whether it is
      enrolled, waiting, or neither; neither: `sudo mokutil --import` it first, or they won't load with Secure Boot on
      (seen on Mint 22.3: NVIDIA's module signed by a key that was neither).
    remedy: >
      Someone with a few minutes alone with the computer could change the unencrypted boot files to
      capture your disk passphrase. Secure Boot stops a changed bootloader or kernel from running, but
      as most distributions set it up it doesn't check the initramfs, where the passphrase is typed.
      How to… explains what this computer's bootloader can do.

  - id: enc.tmp_on_disk
    title: /tmp is on disk rather than in memory
    category: encryption
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 1
    scope: user
    tier: guided
    detect:
      - 'findmnt -n -o FSTYPE /tmp'
      - 'tmp.mount: installed (systemctl show), or shipped but not installed (/usr/share/systemd/tmp.mount, Debian,
        Ubuntu, Mint), and whether it is enabled for the next boot'
    fix: >
      Enable tmp.mount (the helper; on Debian, Ubuntu and Mint it links the distribution's own
      /usr/share/systemd/tmp.mount, as `systemctl enable /usr/share/systemd/tmp.mount` does), from the next boot:
      mounting it now would hide the files of running programs. Otherwise an fstab tmpfs entry, as a command. Never
      offered where enabling changes nothing (systemctl is-enabled): masked (unmask it first), generated from an
      /etc/fstab line for /tmp (change that line), static (local-fs.target add-wants).
    remedy: >
      Temporary files stay on disk after you log out. Guide… keeps /tmp in memory from the next boot,
      so it starts empty every time.
    verify: >
      That `systemctl disable tmp.mount` also removes the link `systemctl enable <path>` made, on the
      systemd versions targeted.
    easy:
      option: tmp_mount
      cost: "From the next restart. /tmp is then emptied at every restart, and large files put there use memory."

  - id: enc.trim_through_luks
    title: TRIM passed through LUKS
    category: encryption
    severity: 1
    scope: system
    tier: advice
    why: Reveals which blocks are in use (not their contents). Usually an acceptable trade-off.
    detect:
      - 'grep discard /etc/crypttab; cryptsetup status <name> shows "flags: discards"'
    fix: >
      Informational only; this passes with a note when TRIM is on, since it is the usual choice: it shows which
      blocks are in use (not their contents), keeps the SSD fast, and clears deleted files from it (most SSDs read
      trimmed blocks back as zeros; not guaranteed). Without it, a note says deleted files stay recoverable while the
      volume is unlocked, and enc.trim_off (a finding, with a guide) turns it on. Turning it off again: remove discard
      from /etc/crypttab and, on LUKS2, `cryptsetup --persistent refresh <name>` without --allow-discards.
    remedy: >
      Usually nothing to do: TRIM keeps an SSD fast and lets it clear deleted data, and the only cost
      is showing which parts of the disk are in use.
    related: [enc.deleted_data_recoverable, enc.trim_off]

  - id: enc.deleted_data_recoverable
    title: Deleted files can be recovered from the disk
    category: encryption
    severity: 3
    warn_lower: 2
    modifiers:
      - when: "fde == 'none'"
        severity: 5
    kind: info
    scope: user
    tier: advice
    why: >
      Not a fault: how deleting works. Deleting unlinks a file; its contents stay on the disk until the space is
      reused or trimmed. On btrfs (copy-on-write) older copies also survive in snapshots, in the unused parts of
      partly rewritten extents and in recent copies of the filesystem's trees (btrfs restore can use them).
      Their names often stay too: on ext4, in the folder's own records and the journal, which TRIM never reaches.
      Overwriting doesn't help on SSDs or copy-on-write filesystems (rule 8). Full-disk encryption protects all of
      it from someone who has the disk, not from someone using the machine while it is unlocked.
    detect:
      - 'The filesystems holding / and the home folder (/proc/mounts): type, mount options (discard)'
      - 'Their disk: /sys/block/<disk>/queue/rotational (0 = SSD); TRIM through the stack:
        /sys/block/<dm-N or disk>/queue/discard_max_bytes (0 = no TRIM)'
      - 'systemctl is-enabled fstrim.timer (weekly TRIM) when not mounted with discard'
      - 'Encryption: a crypt device under the filesystem (lsblk)'
    fix: >
      Informational: full-disk encryption (enc.fde_missing) is the protection that always matters; keep TRIM on
      (discard or the fstrim timer): it leaks the usage pattern through encryption but clears deleted files from
      most SSDs and keeps them fast; on btrfs, delete snapshots that aren't needed and know that a balance
      guarantees nothing. Every plan that deletes files says this for the machine it runs on.
    remedy: >
      Deleted files can be recovered from an unencrypted disk with free tools. Full-disk encryption is
      what protects them (see “Full-disk encryption not enabled”); keeping TRIM on helps on SSDs, and
      the TRIM test in Tools… checks that your SSD really drops what you delete.
    related: [enc.fde_missing, enc.trim_through_luks, enc.snapshots_retain_deleted]

  - id: enc.trim_off
    title: Deleted data isn't trimmed from the SSD
    category: encryption
    severity: 2
    modifiers:
      - when: "fde == 'none'"
        severity: 3
    scope: user
    tier: guided
    why: >
      An SSD keeps the data of deleted files, readable to anyone who has the drive (with the encryption key, on an
      encrypted disk), until the space is reused or trimmed. TRIM tells the drive the space is free, and most drives
      then stop returning the old data. It works only if it reaches the drive (every layer passes it: LUKS needs
      discards allowed, some RAID levels and many USB adapters drop it) and if something runs it (the weekly
      fstrim timer, or the discard mount option).
    detect:
      - 'The filesystems holding / and the home folder (/proc/mounts), and the stack under each from /sys/class/block:
        dm/uuid (CRYPT-, LVM-), md/level, partition, slaves; queue/discard_max_bytes at each layer (0 = TRIM stops
        there); queue/rotational of the drives (hard disks have no TRIM)'
      - 'systemctl is-enabled fstrim.timer, unless mounted with discard (btrfs on Linux 6.2+ sets discard=async on
        SSDs by itself)'
      - 'systemd-detect-virt --vm: inside a virtual machine TRIM reaches a virtual disk, not a drive (not applicable)'
    fix: >
      A guide. Where TRIM stops is the deepest layer that takes none (a logical volume over LUKS without discards
      reports 0 too: every such layer counts). LUKS2: `cryptsetup --allow-discards --persistent refresh <name>` (asks
      for a passphrase; the flag is kept in the header, applies at every unlock, whichever initramfs or crypttab the
      distribution uses), with the options of the persistent flags already there (luksDump's Flags, read with
      administrator access: --persistent stores exactly the options given, cryptsetup-refresh(8)); the logical volumes
      inside take it up after `lvchange --refresh <vg>` or a restart. LUKS1
      (no persistent flags): `cryptsetup --allow-discards refresh` for now, `discard` in /etc/crypttab for the next
      boot (commands for the user: the app never edits crypttab), the initramfs rebuilt when the volume is unlocked
      there (update-initramfs, dracut, mkinitcpio), and the kernel command line changed instead when it carries the
      options (cryptdevice=…:allow-discards for Arch's encrypt hook, rd.luks.options). A volume that still takes no TRIM
      over layers that do: `lvchange --refresh`. fstrim.timer enabled through the helper (set_service, reversible);
      masked: unmask it, as commands. Never fstab: the discard mount option isn't needed with the timer.
      raid4/5/6 drop discards unless raid456.devices_handle_discard_safely=Y, which is safe only when every member
      reads zeros after TRIM: explained, never offered. USB adapters and drives without TRIM: nothing to do.
    remedy: >
      Files you delete stay readable on this SSD until the space is reused, because TRIM doesn't reach the drive or
      never runs. Guide… turns it on for this machine. With disk encryption, TRIM shows which parts of the disk are in
      use (not what they hold); if you'd rather hide that, accept this instead.
    related: [enc.deleted_data_recoverable, enc.trim_through_luks]
    verify: >
      That `cryptsetup --persistent refresh <name>` without --allow-discards clears the stored flag; that
      /run/udev/data/b<major>:<minor> holds ID_FS_VERSION for LUKS devices on the distributions targeted; the md
      sysfs level file on raid4/5/6 arrays.

# ---------------------------------------------------------------------------
# AUTHENTICATION, SESSIONS AND SECRETS
# ---------------------------------------------------------------------------
    easy:
      option: weekly_timer
      cost: "On an encrypted disk, trimming shows which parts of the disk are in use (not what they hold)."

  - id: auth.autologin
    title: Automatic login enabled
    category: auth
    severity: 6
    modifiers:
      - when: "tpm_unlock_no_pin"
        severity: 10
    scope: user
    tier: guided
    why: >
      Anyone who powers on the device (after LUKS unlock, if any) gets the full session.
      Usually also leads to a keyring or wallet with a blank password.
    detect:
      - 'GDM: AutomaticLoginEnable in /etc/gdm3/custom.conf or /etc/gdm/custom.conf'
      - 'SDDM: [Autologin] User= in /usr/lib/sddm/sddm.conf.d/*.conf, /etc/sddm.conf.d/*.conf and /etc/sddm.conf'
      - 'Plasma Login Manager (plasmalogin, KDE''s fork of SDDM, Plasma 6.6+): [Autologin] User= in
        /usr/lib/plasmalogin/defaults.conf, /usr/lib/plasmalogin/plasmalogin.conf.d/*.conf, /etc/plasmalogin.conf.d/*.conf
        and /etc/plasmalogin.conf (tested on Plasma 6.7: automatic login from /etc and from a packaged drop-in)'
      - 'LightDM: autologin-user= or autologin-guest=true in /usr/share/lightdm/lightdm.conf.d/*, /etc/lightdm/lightdm.conf.d/* and lightdm.conf'
    fix: >
      Disable autologin (root): the lines are commented out in the files under /etc; a packaged file
      (/usr/lib/sddm/sddm.conf.d, /usr/lib/plasmalogin, /usr/share/lightdm/lightdm.conf.d) that sets it is overridden by a
      file of the app's own read after it (99-daprivacyscanner-autologin.conf: User= for SDDM and Plasma Login Manager,
      tested on the latter, autologin-user= and
      autologin-guest=false for LightDM). Explain the keyring consequences before and after.
    verify: >
      That SDDM and LightDM take an empty User= / autologin-user= in a later file as "no automatic login"
      (SDDM's daemon checks User.get().isEmpty(); LightDM's seat.c turns "" into no user), on a current release.
    remedy: >
      Anyone who turns the computer on gets your desktop without a password. Guide… turns automatic
      login off and explains what changes for your keyring.
    related: [auth.keyring_blank, enc.tpm_no_pin]

  - id: auth.empty_password
    title: User account has an empty password
    category: auth
    severity: 8
    scope: system
    tier: guided
    detect:
      - 'passwd -S <user>  -> status "NP"  (root)'
    fix: Set a password with passwd.
    remedy: >
      An account without a password can be logged into by anyone. Guide… shows how to set one.

  - id: auth.screen_lock
    title: Screen lock disabled, delayed, or not applied on suspend
    category: auth
    severity: 7
    warn_lower: 4
    modifiers:
      - when: "device == 'desktop' and not multi_user"
        severity: 5
    scope: user
    tier: auto
    detect:
      - 'GNOME: org.gnome.desktop.screensaver lock-enabled, lock-delay; org.gnome.desktop.session idle-delay (0 = never)'
      - 'Ubuntu GNOME: org.gnome.desktop.screensaver ubuntu-lock-on-suspend'
      - 'KDE: kreadconfig6 --file kscreenlockerrc --group Daemon --key Autolock / Timeout / LockOnResume (empty = default)'
      - 'Cinnamon: org.cinnamon.desktop.screensaver lock-enabled'
      - 'XFCE: xfconf-query -c xfce4-screensaver -p /lock/enabled, /lock/saver-activation/enabled and /delay, /lock/sleep-activation, /saver/idle-activation/enabled and /delay (minutes); a property never set is the default (light-locker isn''t read)'
    fix: >
      Enable locking, idle timeout of 5 minutes or less, lock on suspend and lid close. KDE Plasma: kscreenlockerrc
      through kwriteconfig (Timeout 0, never, set to 5 too; a value from /etc/xdg counts as the user's), each followed by
      kscreenlocker's configure call on the session bus (org.kde.screensaver /ScreenSaver, through qdbus or dbus-send:
      KConfigSet's `then`), after writing and again after reverting, since it reads its settings only at login or when
      asked. MATE: lock-enabled, idle-delay and lock-delay (minutes). Xfce: the same
      xfce4-screensaver properties through xfconf-query (XfconfSet: a property never set is removed again on
      revert). The side effects are the desktop's own (GNOME blanks the screen at its idle delay, Cinnamon and MATE
      start the screensaver); a plan with nothing left to change names the desktop's settings page.
    remedy: >
      Fix… locks the screen after 5 minutes idle, and when the computer sleeps or the lid closes.
    verify: >
      KDE defaults are not written to the file; treat a missing key as the default. xfce4-screensaver's
      property names and defaults (lock on, lock with the saver on after 0 minutes, lock on sleep, saver after
      5 minutes) in 4.18 and 4.20 (src/gs-prefs.c).

  - id: auth.lockscreen_notifications
    title: Notification content shown on the lock screen
    category: auth
    severity: 3
    scope: user
    tier: auto
    detect:
      - 'GNOME: gsettings get org.gnome.desktop.notifications show-in-lock-screen; with it on, the lock screen shows
        only which apps sent notifications, and their text only for apps whose details-in-lock-screen is true
        (org.gnome.desktop.notifications.application, one path per app in application-children; default false)'
      - 'KDE Plasma: the lock screen shows no notifications (plasma-desktop 6.7, lockscreen/LockScreenUi.qml: its messages are the unlock prompt''s own); it shows media playing unless kscreenlockerrc [Greeter][LnF][General] showMediaControls=false (a note)'
      - 'Cinnamon: cinnamon-screensaver 6.6 shows only a count of notifications received while locked (widgets/notificationWidget.py); org.cinnamon.desktop.screensaver show-notifications is not read by it'
    fix: Disable notifications on the lock screen (show-in-lock-screen false), which also hides every app's details.
    remedy: >
      Some apps show the text of their messages on the lock screen, so anyone at the screen can read
      them. Fix… hides notifications on the lock screen.
    verify: Other desktops (XFCE, MATE, Budgie) and older Plasma 5 lock screens.
    easy:
      cost: "Message text no longer shows on the lock screen: you see it once you unlock."

  - id: auth.keyring_blank
    title: Keyring or wallet with a blank password (secrets stored unencrypted)
    category: auth
    severity: 7
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 6
    scope: user
    tier: guided
    why: Saved Wi-Fi, email, browser and app secrets are readable by anyone with file access.
    detect:
      - 'GNOME Keyring: $XDG_DATA_HOME/keyrings/*.keyring; encrypted files begin with the binary magic "GnomeKeyring\n\r\0\n", unencrypted ones are plain-text INI starting with "[keyring]"'
      - 'KWallet: $XDG_DATA_HOME/kwalletd/*.kwl (+ .salt). A blank password still encrypts (with a key made from the empty password), so try that key in memory: PBKDF2-SHA512 with the salt (or the pre-4.13 SHA-1 key), Blowfish CBC (ECB for old wallets), then the size field and KWallet''s own SHA-1 must match (kwallet.py; checked against wallets made by KWallet 6.30). GPG wallets are protected by the GPG key.'
    fix: >
      Set a password: one step per kind of store found blank, whatever the desktop (GNOME keyrings in Passwords and
      Keys, Seahorse, by the name it shows them under: display-name, or the name in an encrypted file's header; KDE
      wallets in KDE Wallet Manager), with the program, or its install command when it isn't installed (Fedora
      Workstation and Omarchy have no Seahorse). Explain the trade-off with autologin.
    remedy: >
      Your keyring holds saved passwords and opens without one, so anyone who can read your files can
      read them. Guide… shows how to give it a password: your login password makes it unlock at login.
    related: [auth.autologin, auth.chromium_basic_store]

  - id: auth.chromium_basic_store
    title: Chromium/Electron apps using the "basic" password store
    category: auth
    severity: 7
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 6
    scope: user
    tier: guided
    applies_to: [Chrome, Chromium, Brave, Edge, Vivaldi, Electron apps using safeStorage]
    why: >
      Without a Secret Service keyring, saved passwords and cookies are encrypted with a
      hardcoded key, which is effectively plaintext.
    detect:
      - 'Launch flags: --password-store=basic in any ~/.config/*-flags.conf (browsers'', code-flags.conf, electron*-flags.conf)
        and any menu entry the desktop uses, browsers and Electron apps alike: the first file of a name in
        $XDG_DATA_HOME/applications, Flatpak''s exports (the user''s, then the system''s), /usr/local/share and /usr/share,
        so an entry hidden by a copy of the user''s own (the guide''s, without the flag) doesn''t count'
      - 'Browser profiles: "Login Data" (SQLite) logins.password_value and "Cookies" encrypted_value: prefix "v10" =
        hardcoded key, "v11" = keyring key'
      - 'Electron apps (a ~/.config folder with GPUCache or Code Cache, native and Flatpak): their cookies are not a sign
        of the store used, since Electron leaves cookie encryption off unless the app turns it on (its
        EnableCookieEncryption fuse; tested with Electron 44, the value in plain text with the keyring and with basic).
        Cookies kept unencrypted are counted, never read, in a note: not a finding, nothing here can change it'
      - 'Check that a Secret Service provider is on the session bus (org.freedesktop.secrets)'
    fix: >
      Remove the flag (a menu entry of the system's: a copy of the user's own without it); a keyring for this desktop
      (KDE Wallet on Plasma, turned on in kwalletrc; GNOME Keyring elsewhere, installed or started); re-save what is
      stored: the step gives the counts of passwords and cookies still under the built-in key, which keep the check
      failing (Chromium reads them with that key and doesn't encrypt them again; a cookie only when its site sets it
      anew, or the browser's cookies are deleted).
    remedy: >
      This browser keeps passwords and cookies under a key built into the browser, which anything that
      reads your files can use. Guide… removes the setting that forces this, so the system keyring
      protects them.

  - id: auth.remote_desktop
    title: Remote desktop or screen sharing server enabled
    category: auth
    severity: 7
    scope: user
    tier: guided
    detect:
      - 'GNOME: grdctl status (Status: enabled under RDP or VNC); its daemon and user service run on every GNOME desktop
        with sharing off, so their running proves nothing'
      - 'KDE: krdpserver / krfb in autostart or running'
      - 'systemctl is-active xrdp x11vnc; ss -tlnp for 3389 and 5900-5910'
      - 'Running: RustDesk, AnyDesk, TeamViewer, Chrome Remote Desktop (remoting_me2me_host, chrome-remote-desktop-host:
        it listens on no port, connecting out through Google), NoMachine (nxserver.bin, nxnode.bin), Sunshine'
    fix: >
      Disable when not needed; otherwise require strong credentials and bind to a VPN interface. What the guide has no
      option for: where this desktop starts programs at login (Cinnamon: System Settings → Startup Applications; KDE
      Plasma: Autostart, and Remote Desktop for KDE's RDP server), and for each program found running the commands that
      show it (pgrep), the systemd unit that starts it, and stop it now; for a port alone, the program listening (ss).
    remedy: >
      Others on the network can connect to your desktop. Guide… turns it off if you don't use it; if
      you do, give it a strong password.

    verify: The process names of Chrome Remote Desktop, NoMachine and Sunshine (from their programs' names, not seen running).
  - id: auth.ssh_key_no_passphrase
    title: SSH private keys without a passphrase
    category: auth
    severity: 6
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 5
    scope: user
    tier: guided
    detect:
      - 'For each private key in ~/.ssh: "ssh-keygen -y -P \"\" -f <key>" succeeds = no passphrase'
      - 'ssh-keygen refuses a key others can read ("bad permissions"): then read the key itself (openssh-key-v1
        cipher name "none", or a PEM key without ENCRYPTED) and report the loose permissions too'
      - 'Only "incorrect passphrase" means it asks for one. Any other failure (a key type this OpenSSH dropped, DSA in
        OpenSSH 10; a damaged file): read the key itself as above, its reason in the evidence; a format the app doesn''t
        know is couldn''t check, never protected'
    fix: >
      ssh-keygen -p -f <key>, after chmod 600 where its group or others can read it (ssh-keygen refuses the key
      otherwise, -p included); a key this ssh-keygen can't load: a new key in its place. Recommend an agent
      (ssh-agent, gnome-keyring, KeePassXC).
    remedy: >
      Anyone who copies these SSH keys can use them. Guide… gives the command to add a passphrase, and
      how an agent saves typing it.

  - id: auth.plaintext_credentials
    title: Plaintext credential files
    category: auth
    severity: 6
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 5
    scope: user
    tier: guided
    detect:
      - '~/.git-credentials, ~/.netrc, ~/.aws/credentials, ~/.docker/config.json ("auths" with "auth" values)'
      - '~/.pgpass, ~/.my.cnf, ~/.config/rclone/rclone.conf (obscured, not encrypted), ~/.config/gh/hosts.yml'
      - '~/.npmrc _authToken, unless its value names an environment variable (${NPM_TOKEN}, as npm documents; $VAR): npm
        reads it when it runs. Of the formats read, only npm and .env files document that form'
      - '.env files under home (limit depth, skip node_modules), counted only with a variable named as a secret (a word
        such as PASSWORD, SECRET, TOKEN, KEY; not PUBLIC or PUBLISHABLE) holding a real value (not empty or a placeholder),
        or a URL with a password'
      - 'Also flag group/world-readable permissions on any of these'
    fix: Move to credential helpers (git-credential-libsecret, docker credential helpers); chmod 600 at minimum.
    remedy: >
      These files hold passwords or tokens in plain text. Guide… makes them readable by you only and
      shows how to move each to a helper that uses the keyring.

  - id: auth.shell_history_secrets
    title: Shell and REPL history containing secrets
    category: auth
    severity: 6
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 5
    scope: user
    tier: guided
    detect:
      - 'Files: ~/.bash_history, ~/.zsh_history, ~/.zhistory, $HISTFILE, ~/.local/share/fish/fish_history, ~/.python_history,
        ~/.psql_history, ~/.mysql_history, ~/.sqlite_history, ~/.node_repl_history, ~/.lesshst, zsh and bash histories in
        the XDG folders, nushell, redis-cli, mongosh and mongo, irb, Julia, R, ~/.viminfo'
      - '$ZDOTDIR (the environment, or as ~/.zshenv sets it) and its .zsh_history; HISTFILE= as the shell profiles set it
        (zsh keeps it as a shell variable, so the app''s environment rarely has it), with $HOME, ~ and the XDG variables
        expanded'
      - 'Patterns: password=, passwd, -p<value>, token, secret, Authorization:, Bearer, AKIA[0-9A-Z]{16}, ghp_[A-Za-z0-9]{36}, xox[bp]-'
    fix: Offer per-line redaction; suggest HISTCONTROL=ignorespace (bash) or setopt HIST_IGNORE_SPACE (zsh).
    remedy: >
      Your shell history has lines that look like passwords or tokens. Guide… shows them masked,
      removes the ones you choose, and shows how to keep commands out of history.

  - id: auth.sudo_nopasswd
    title: Passwordless sudo
    category: auth
    severity: 6
    scope: user
    tier: guided
    why: Lets malware running as the user escalate silently.
    detect:
      - 'sudo -n -l: the commands that run without a password: a NOPASSWD tag (among the other tags, LOG_OUTPUT: and
        the like, and options such as TIMEOUT=; a tag holds for the commands after it until PASSWD:), or no tag with
        Defaults !authenticate (also Defaults:user), or Defaults>runas or Defaults!command !authenticate for that runas
        or command. Read by shape, not the headings, which are translated; long rules wrap onto further lines'
      - '/etc/doas.conf: permit nopass rules for this user (by name or uid) or a group of theirs (:group, by name or
        gid; `id`, else /etc/group); another account''s rule is theirs. A rule as another account than root is narrow'
      - 'A rule is as good as root when it allows ALL, or a program that can run others (GTFOBins) with any arguments; with
        fixed arguments only when the program can escape to a shell anyway (editors, pagers, journalctl, git, systemctl
        verbs that page or edit) or runs a file this user can write'
    fix: Remove NOPASSWD entries, and a Defaults !authenticate line, via visudo; for doas, nopass.
    remedy: >
      Any program running as you can become administrator without a password. Guide… shows how to
      remove that rule safely.

  - id: auth.firefox_no_primary_password
    title: Firefox or Thunderbird without a Primary Password
    category: auth
    severity: 5
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 4
    scope: user
    tier: guided
    detect:
      - 'Profiles: ~/.mozilla/firefox, ~/.var/app/org.mozilla.firefox/.mozilla/firefox, ~/snap/firefox/common/.mozilla/firefox, ~/.thunderbird and Flatpak/Snap equivalents'
      - 'If logins.json is non-empty, use NSS on key4.db: PK11_NeedLogin on the internal key slot'
    fix: Guide the user to set a Primary Password.
    remedy: >
      Passwords saved in Firefox can be read by anything that reads your files. Set a Primary Password
      in Firefox; Guide… shows where.
    verify: >
      Firefox 157 on Linux Mint 22 keeps profiles in $XDG_CONFIG_HOME/mozilla/firefox (seen 2026-10-03);
      check other distributions and whether older ~/.mozilla profiles are moved there.

  - id: auth.home_world_readable
    title: Home directory readable by other users
    category: auth
    severity: 5
    modifiers:
      - when: "not multi_user"
        severity: 2
    scope: user
    tier: guided
    applies_to: [Ubuntu before 21.04, other distros defaulting to 755]
    detect:
      - 'stat -c %a $HOME  (flag if the "other" digit is non-zero)'
      - 'The group digit when the home''s group has other accounts in it (/etc/group members, or their primary group;
        openSUSE''s users group)'
      - 'A POSIX ACL (system.posix_acl_access) naming other users or groups with read or search, within its mask
        (tested on CachyOS with setfacl -m u:nobody:rx)'
    fix: 'chmod 750 or 700 $HOME (warn about ~/public_html and similar); 700 when the group or an ACL lets others in (it
      empties the mask, so named ACL entries count for nothing).'
    remedy: >
      Other accounts on this computer can browse your files. Guide… makes your home folder yours
      alone.

  - id: auth.startup_files_writable
    title: Files that run as you can be changed by other accounts
    category: auth
    severity: 6
    modifiers:
      - when: "not multi_user"
        severity: 2
    scope: user
    tier: auto
    why: >
      Your shell runs ~/.bashrc, ~/.profile or ~/.zshrc, and your desktop ~/.xprofile, every time you log in
      or open a terminal; a program in ~/.local/bin on PATH runs whenever you type its name. Another account
      that can change any of them, or the folders that hold them, can make you run its commands, as you and
      with your files: a line in ~/.bashrc, or a "sudo" in ~/.local/bin that keeps your password. On a
      machine with one person the other accounts are system services, so it matters less.
    detect:
      - 'Login files: ~/.profile, .bash_profile, .bash_login, .bashrc, .bash_logout, .zshenv, .zprofile, .zshrc,
        .zlogin, .zlogout, .xprofile, .xsessionrc, .pam_environment, ~/.config/fish/config.fish and conf.d,
        ~/.config/environment.d; the folders holding them (home, ~/.config, ~/.config/fish)'
      - 'Folders on this session''s PATH that are under home, and the programs in them (at most 2000)'
      - 'Followed through links (a dotfiles repository); write permission for others, or for a group with
        another account in it (/etc/group members and accounts whose primary group it is; a group that can''t
        be looked up counts as shared), or another owner. A sticky bit doesn''t help: others can still create
        a file that is missing'
    fix: >
      ChmodPath per path the user owns, taking away only the write bits that let others in (o+w, g+w for a
      shared group); a link's target is changed, never the link. Reversible from History. Files another
      account owns are listed with the chown command for an administrator.
    remedy: >
      Other accounts on this computer can change files that run as you when you log in or type a command,
      and so make you run their commands. Fix… takes their write permission away; you keep yours.
    related: [auth.home_world_readable, auth.umask]
    easy: true

  - id: auth.gpg_no_passphrase
    title: GPG secret keys without a passphrase
    category: auth
    severity: 4
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 3
    scope: user
    tier: guided
    detect:
      - '~/.gnupg/private-keys-v1.d/*.key: "(protected-private-key" = protected, "(private-key" = unprotected'
    fix: gpg --edit-key <id> passwd.
    remedy: >
      Anyone who copies these keys can use them. Guide… gives the command to add a passphrase.

  - id: auth.gpg_keys
    title: GnuPG keys that are weak or stay unlocked for long
    category: auth
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "gpg_weak_key"
        severity: 5
    scope: user
    tier: guided
    why: >
      A signature made with a DSA key, or an RSA key under 2048 bits, can be forged by someone with enough
      computing power, and mail encrypted to such a key may be read later. (An expired key is no risk of its
      own: nobody can encrypt to it any more. It is noted, with the commands to renew or remove it.) gpg-agent keeps your passphrase for a while after you type it; with a cache
      of days, any program running as you can sign or decrypt with your key all that time.
    detect:
      - 'Secret keys: keygrips of ~/.gnupg/private-keys-v1.d/*.key ($GNUPGHOME honoured); none = not applicable'
      - 'gpg --batch --no-auto-check-trustdb --trust-model always --lock-never --with-colons --with-keygrip
        --fixed-list-mode --list-keys (public listing: it doesn''t start gpg-agent, and with trust-model always
        it doesn''t create a trustdb); a pub or sub whose keygrip has a secret part is the user''s'
      - 'Weak: DSA (algorithm 17), RSA (1-3) or Elgamal (16, 20) under 2048 bits, on a key that isn''t expired or
        revoked; expired: validity e, or an expiry date in the past (the primary key)'
      - 'gpg-agent.conf: default-cache-ttl over an hour, or max-cache-ttl over 12 hours (defaults 600 and 7200)'
    fix: >
      The cache: WriteFile of gpg-agent.conf with the values replaced (GnuPG's defaults, or one hour and eight
      hours), then gpgconf --reload gpg-agent. Keys: commands only, run by the user (a new Ed25519 key,
      revocation certificates, gpg --quick-set-expire for an expired key, --delete-secret-keys).
    remedy: >
      Some of your GnuPG keys are weak, or the passphrase stays remembered for a long time, so any program
      running as you can use the key meanwhile. Guide… shortens the time the passphrase is remembered and gives
      the commands to replace weak keys (and to renew or remove expired ones).
    related: [auth.gpg_no_passphrase]
    verify: >
      Whether pinentry's "Save in password manager" (pinentry-gnome3, the login keyring) bypasses the cache
      times, and gpg 2.2's listing with --lock-never on keyboxd setups.

  - id: auth.umask
    title: New files can be read by other accounts (default umask)
    category: auth
    severity: 2
    modifiers:
      - when: "not multi_user"
        severity: 1
    scope: user
    tier: guided
    detect:
      - 'umask  (0022 = new files readable by other users)'
      - 'Home directory mode: when others can''t enter it (no o+x), the umask only matters outside it (/tmp, shared
        folders): a pass with a note'
    fix: >
      027 or 077 in the login files (login shells, and the X11 session script that starts Cinnamon, Xfce and MATE), and
      UMask= in a drop-in for the user's user@UID.service (GNOME and Plasma start through the systemd user manager, on
      X11 as on Wayland; ~/.config/environment.d sets variables only, never the umask). The drop-in applies when the
      user manager starts again (a restart, or every session closed with nothing of the user's left running), not
      reliably at the next login: the guide says so, with the command that shows the manager's umask now.
    remedy: >
      New files you create can be read by other accounts on this computer. Guide… makes new files
      private by default, for your terminals and your desktop apps.

  - id: auth.ssh_known_hosts_plain
    title: SSH known_hosts lists the servers you connect to
    category: auth
    severity: 3
    warn_lower: 2
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 2
    scope: user
    tier: auto
    why: >
      ~/.ssh/known_hosts names every server this account has ever connected to. Hashed entries
      still verify servers but don't show them to whoever reads the file; a guessed name or IP address can
      still be tested against them (ssh-keygen -F), so hashing hides the list, not every entry.
    detect:
      - '~/.ssh/known_hosts: lines whose first field does not start with "|1|" are plain host names; @cert-authority
        and @revoked lines and wildcard patterns are not counted (ssh-keygen -H leaves them as they are)'
      - 'HashKnownHosts yes (new entries are then hashed): ~/.ssh/config, then /etc/ssh/ssh_config and its Includes (Debian and Ubuntu set it there); first value wins, outside Host blocks or in Host *'
    fix: >
      ssh-keygen -H -f ~/.ssh/known_hosts (the plain copy it leaves as known_hosts.old is deleted),
      and HashKnownHosts yes in ~/.ssh/config. The file is backed up for revert for 7 days only (`HashKnownHosts.BACKUP_DAYS`,
      `UndoLog.expire_backups`; History can delete it sooner): kept, the copy would be the list the fix hides.
    remedy: >
      Your SSH known-hosts file is a readable list of every server you've connected to. Fix… scrambles
      the names, so it no longer reads as a list.

  - id: auth.ssh_client_settings
    title: SSH settings that weaken every connection
    category: auth
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "host_keys_unchecked"
        severity: 5
      - when: "agent_forwarded_everywhere"
        severity: 5
      - when: "agent_forwarded_everywhere and agent_keys_unlimited"
        severity: 6
    scope: user
    tier: guided
    why: >
      With ForwardAgent on for every server, any server you log in to (or anyone who has taken it over) can use
      the keys in your agent to log in elsewhere as you, for as long as you are connected. StrictHostKeyChecking
      no, or a known-hosts file of /dev/null, lets a machine in the middle impersonate a server without ssh
      noticing, and see what you type to it, passwords included. Keys that stay in the agent until logout can be
      used by any program running as you all that time.
    detect:
      - '~/.ssh/config, then /etc/ssh/ssh_config and the files it Includes (ssh_config.d/*.conf); the first value
        wins, as in ssh; outside Host blocks, in Host * or Match all = for every server'
      - 'ForwardAgent anything but no (yes, or a socket path); StrictHostKeyChecking no or off; UserKnownHostsFile
        /dev/null only'
      - 'Host blocks for particular servers with ForwardAgent on: counted, as a note'
      - 'The agent: $SSH_AUTH_SOCK (gnome-keyring /keyring/ssh, gcr-ssh-agent /gcr/ssh, gpg-agent S.gpg-agent.ssh,
        otherwise ssh-agent); keys loaded: ssh-add -l (the count only, never the comments); the default lifetime:
        ssh-agent''s -t argument (/proc/PID/cmdline), gpg-agent''s max-cache-ttl-ssh (default 7200), none for
        GNOME''s agents'
      - 'AddKeysToAgent for every server with a time (1h, 600, confirm 1h) or confirm: the keys ssh adds as it
        connects leave the agent, or ask before each use, so ssh-agent without -t is not "until logout" (keys added
        by hand without -t: a note), and the guide doesn''t give that advice again'
    fix: >
      One option, WriteFile: a setting in the user's own files is changed on its line (ForwardAgent no,
      StrictHostKeyChecking accept-new, UserKnownHostsFile back to ssh's default); a setting from /etc is
      overridden by a Host * block appended to the end of ~/.ssh/config (read before /etc, and after the
      user's own per-server blocks, so those still win). The agent: commands only (ssh-add -D, ssh-add -t,
      AddKeysToAgent with a time, ssh-agent -t). The /etc files are left to the user (sudoedit).
    remedy: >
      Your SSH settings let every server you log in to use your keys, or stop ssh from noticing a server
      that isn't the one it claims to be. Guide… changes them for your account, keeping any settings you
      made for particular servers, and shows how to make keys leave the agent after a while.
    related: [auth.ssh_key_no_passphrase, auth.ssh_known_hosts_plain]
    verify: >
      The socket paths of GNOME Keyring, gcr-ssh-agent (GNOME 46+), KDE and systemd's ssh-agent.service on
      Fedora, Arch and openSUSE; KeePassXC's keys with its own lifetime.

  - id: auth.ssh_authorized_keys
    title: Keys that can log in as you
    category: auth
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "sshd_reachable"
        severity: 4
      - when: "weak_authorized_keys"
        severity: 5
      - when: "weak_authorized_keys and sshd_reachable"
        severity: 7
    scope: user
    tier: guided
    why: >
      Every key in ~/.ssh/authorized_keys lets whoever holds its private half log in as you, without your
      password, whenever an SSH server is listening. Keys get added and forgotten (an old laptop, a former
      job, a script), and adding one is how an intruder keeps a way back in. DSA and RSA keys under 2048
      bits can be broken or are refused by current OpenSSH.
    detect:
      - '~/.ssh/authorized_keys and ~/.ssh/authorized_keys2 (the default AuthorizedKeysFile): per key its type,
        size (RSA modulus, DSA p, from the key itself), options (from=, command=, restrict, cert-authority) and
        SHA256 fingerprint; counts per type in the evidence, never the comments (they often hold an email address)'
      - 'Weak: DSA, or RSA under 2048 bits'
      - 'An SSH server reachable from other machines: a TCP listener (ss) not bound to loopback on a port sshd uses:
        sshd -T through the helper with administrator access, else Port and ListenAddress in /etc/ssh/sshd_config and
        sshd_config.d (22 by default); systemd''s ssh.socket counts. Both are root''s alone on Fedora (0600, the
        folder 0700): without administrator access a listener on 22 still counts, otherwise it can''t be told (a note)'
      - '~/.ssh and the key files writable by group or others'
    fix: >
      One option per key: WriteFile removing exactly that line (found again by its text when applied).
      Fingerprints are shown in the guide only, so the user can match them with ssh-keygen -lf on the
      machine the key comes from. Commands for a new Ed25519 key and ssh-copy-id; turning the server off
      when it isn't used (systemctl disable --now ssh / sshd).
    remedy: >
      These keys let whoever holds them log in to this computer as you, without your password. Guide…
      lists them with their fingerprints, removes the ones you don't recognise, and shows how to replace
      weak ones.
    related: [net.exposed_services, auth.ssh_key_no_passphrase]
    verify: >
      AuthorizedKeysFile other than the default (sshd_config is root-only on Fedora); Ubuntu 24.04's
      ssh.socket listener as ss shows it.

  - id: auth.login_history
    title: Login history readable by every user
    category: auth
    severity: 3
    modifiers:
      - when: "not multi_user"
        severity: 0
    scope: user
    tier: guided
    why: >
      /var/log/wtmp and /var/log/lastlog record when, and from which address, every account
      logged in; the `last` and `lastlog` commands show them to any user.
    detect:
      - 'stat /var/log/wtmp /var/log/lastlog /var/log/btmp, their rotated copies in /var/log (wtmp.1; wtmp-YYYYMMDD with
        Fedora''s dateext; compressed), /var/lib/wtmpdb/wtmp.db and /var/lib/lastlog/lastlog2.db: flag world-readable'
    fix: >
      A chmod alone doesn't last: systemd-tmpfiles sets the mode again at every boot (tmpfiles.d var.conf,
      `f /var/log/wtmp 0664`) and logrotate creates a new wtmp with `create 0664`. The helper writes its own
      /etc/tmpfiles.d/00-daprivacyscanner-wtmp.conf (0660 for wtmp and lastlog; an earlier name wins for the same
      path), applies it now with systemd-tmpfiles, and sets logrotate's create mode to 0660 where the rule for
      /var/log/wtmp is: /etc/logrotate.d/wtmp (Debian, Ubuntu, Fedora 44) or /etc/logrotate.conf; a rule elsewhere, or
      another create line, is the user's to edit (sudoedit, the line named). Rotated copies keep the mode they had: chmod
      o-r commands (btmp's: chmod 600). Non-administrators then can't run `last`. wtmpdb and lastlog2 databases (Debian
      13, Fedora 44, openSUSE) aren't covered by the rule: the guide gives chmod o-r commands for them and says an update
      may reset it.
    remedy: >
      Every account can see when you logged in, and from where. Guide… makes the login records
      readable by administrators only, lasting through restarts.
    verify: >
      That tmpfiles.d applies the entry of the earliest-named file for a path on the targeted systemd versions,
      and where Arch's and openSUSE's logrotate keep the rule for wtmp (Fedora 44: /etc/logrotate.d/wtmp, seen
      2026-10-17; Omarchy has no logrotate).

# ---------------------------------------------------------------------------
# NETWORK EXPOSURE AND TRACKING
# ---------------------------------------------------------------------------

  - id: net.exposed_services
    title: Services listening on all interfaces
    category: network
    severity: 7
    warn_lower: 2
    modifiers:
      # listening but blocked by the firewall is a risk (warn_lower below this): 2
      - when: "firewall_blocks_exposed"
        severity: 4
    scope: user
    tier: guided
    detect:
      - 'ss -tulpnH; flag local addresses 0.0.0.0, [::], *'
      - 'Allowlist expected listeners (DHCP client on 68, mDNS on 5353 handled by net.hostname_broadcast)'
      - 'sshd: sshd -T | grep -Ei "passwordauthentication|permitrootlogin"'
      - 'CUPS: cupsctl | grep _share_printers=1'
      - 'Active firewall: ufw status verbose (root), or firewall-cmd --list-all for the active zones; a port
        the firewall blocks is listening but not reachable (firewall_blocks_exposed when all of them are).
        nftables/iptables rulesets are not interpreted: unknown.'
      - 'firewalld 2.x marks the default zone in --get-active-zones ("FedoraWorkstation (default)"): the zone is the
        first word. A service''s ports come with those of the services it includes (--info-service includes:,
        samba-client includes netbios-ns). Fedora Workstation''s default zone lets in 1025-65535/tcp and udp.
        firewall-cmd runs as the user (polkit lets an active session query it); administrator access doesn''t change
        what it says, so only ufw''s note asks for it'
    fix: Disable unneeded services, bind dev servers to 127.0.0.1, disable SSH password and root login.
    remedy: >
      Programs here accept connections from other machines. Guide… goes through each: stop it, limit
      it to this computer, or check its settings.
    related: [net.firewall_off, net.docker_bypass]

  - id: net.docker_bypass
    title: Docker published ports bypass the host firewall
    category: network
    severity: 7
    scope: user
    tier: guided
    why: Docker inserts its own iptables/nftables rules ahead of ufw (and often firewalld zones).
    detect:
      - 'docker ps --format "{{.Names}} {{.Ports}}"; flag 0.0.0.0: or :::'
      - 'docker --version naming Podman: podman-docker''s shim. Rootless Podman (docker info
        {{.Host.Security.Rootless}}), and rootless Docker (its SecurityOptions name rootless), publish ports as
        ordinary sockets the host firewall filters: a pass'
      - 'docker.service not running (systemctl is-active) and no dockerd or containerd shim left running: no
        container runs, a pass, and docker ps isn''t run (through docker.socket it would start the service: Omarchy
        enables only the socket)'
      - 'Rules in DOCKER-USER aren''t read (root, and what they block depends on what they match): the finding says
        to accept it once they cover the ports'
    fix: Publish as 127.0.0.1:<port>:<port>, or add rules to the DOCKER-USER chain.
    remedy: >
      Docker's published ports get past the firewall. Guide… shows how to publish them on this
      computer only, or add firewall rules Docker respects.
    verify: Check rootful Podman (netavark) behaviour too.

  - id: net.firewall_off
    title: Host firewall disabled
    category: network
    severity: 3
    modifiers:
      - when: "exposed_services"
        severity: 6
    scope: system
    tier: guided
    detect:
      - 'ufw status; firewall-cmd --state; nft list ruleset: only chains hooked on input that drop or reject
        (policy drop, or drop/reject rules) count; Docker, libvirt and Tailscale add NAT and forward rules that
        filter nothing coming in'
    fix: >
      Enable ufw or firewalld with a default-deny inbound policy. ufw: the helper's ufw_enable runs ufw --force enable
      and, where ufw.service isn't enabled and running (Arch's package enables nothing), enables and starts it, which
      loads the rules at boot; both are journalled and reverted.
    remedy: >
      Nothing filters incoming connections. Guide… turns on a firewall that blocks them by default.

  - id: net.mac_permanent
    title: Wi-Fi connections use the permanent MAC address
    category: network
    severity: 4
    modifiers:
      - when: "device == 'desktop'"
        severity: 2
    scope: user
    tier: guided
    why: Lets public networks and their operators recognise the device across visits.
    detect:
      - 'nmcli -g 802-11-wireless.cloned-mac-address connection show <id>'
      - 'NetworkManager --print-config wifi.cloned-mac-address: the default for networks joined from now on (unset =
        the hardware address), from the [connection*] sections in the order NetworkManager searches them
        (NetworkManager.conf(5)): named ones as --print-config lists them (later files first), [connection] last; the
        first whose match-device covers Wi-Fi (type:wifi, *, or none) and has the key wins; stop-match ends the search.
        Fedora 40+ sets stable-ssid in [connection.22-wifi-mac-addr] (match-device=type:wifi), which also outranks the
        app''s [connection] default'
      - 'NetworkManager --print-config [device*] wifi.scan-rand-mac-address, searched the same way (default yes; no =
        the permanent address while scanning; Ubuntu and Mint set no in NetworkManager.conf)'
    fix: >
      Every network, including those joined later: a NetworkManager drop-in of the helper's own
      (/etc/NetworkManager/conf.d/99-daprivacyscanner-mac.conf) setting the default for Wi-Fi to "stable" (a random
      address per network, kept for it) or "random" (a new one at every connection), and random addresses while
      scanning; the saved networks that set the hardware address themselves are changed too. Wired networks are a
      separate, optional drop-in (ethernet.cloned-mac-address). Note captive portal and MAC filtering side effects.
      A later file wins over every section of earlier ones, driver-specific ones included (man NetworkManager.conf),
      so the drivers NetworkManager's own files exempt (no-mac-addr-change.conf: wl, eagle_sdio, and any this
      machine's files add) are exempted again at the top of the app's file, with match-device sections, and keep
      the hardware address; the guide says to revert if Wi-Fi stops working on a driver that isn't listed.
    remedy: >
      Your Wi-Fi uses its real hardware address everywhere, so networks can recognise this computer.
      Guide… gives it a random address for each network, including ones you join later.
    easy:
      option: stable
      cost: "Each network sees a new address once, so a hotel or café Wi-Fi may ask you to sign in again. Rarely, a Wi-Fi driver can't change its address: if Wi-Fi stops working, revert it from History."

  - id: net.hostname_broadcast
    title: Identifying hostname broadcast via DHCP and mDNS
    category: network
    severity: 4
    scope: user
    tier: guided
    detect:
      - 'hostnamectl hostname; compare with the user''s name from getent passwd (GECOS)'
      - 'nmcli -g ipv4.dhcp-send-hostname,ipv6.dhcp-send-hostname connection show <id>: -1 (NetworkManager 1.52 and
        later, by NetworkManager --version, else by a connection showing -1) takes the default from NetworkManager''s
        [connection*] sections (as for wifi.cloned-mac-address, per kind: Wi-Fi, wired); yes/no only (older) has
        none, so a network joined later sends the hostname whatever was done to the saved ones'
      - 'Other DHCP clients: systemd-networkd (the .network file it applies to each interface, the first by name whose
        [Match] takes it: Name= globs and Virtualization= judged, so systemd''s 80-container-host0.network counts only
        in a container; with its drop-ins; DHCP= on and [DHCPv4] SendHostname not off, on by default) and dhcpcd (a
        hostname line in /etc/dhcpcd.conf, as Arch ships it); the guide says what to change'
      - 'systemctl is-active avahi-daemon; /etc/avahi/avahi-daemon.conf [publish]'
      - 'resolvectl status: a link showing +mDNS or +LLMNR answers for the hostname (the per-link state is the one in
        effect; mDNS=resolve and LLMNR=resolve only ask: Fedora''s LLMNR=resolve listens on 5355 and announces
        nothing). Without resolvectl, a listener on port 5355 counts as LLMNR'
    fix: >
      Offer a generic hostname; stop sending it over DHCP: NetworkManager's default for every connection (a conf.d
      drop-in of the app's own, where NetworkManager reads one) and dhcp-send-hostname=no on saved connections that
      set it themselves; disable Avahi publishing if unused; systemd-resolved's mDNS set to resolve only (the
      helper's resolved-llmnr drop-in, MulticastDNS=resolve, keeping its LLMNR value); systemd-networkd: commands
      writing a drop-in ([DHCPv4] SendHostname=no) beside each .network file it applies. Tested on NetworkManager 1.58 (CachyOS, tcpdump): with
      [connection] ipv4.dhcp-send-hostname=0 the DHCP request carried no hostname, and did again once it was removed.
    verify: >
      That NetworkManager 1.52 is the first to read dhcp-send-hostname's default (the app goes by NetworkManager
      --version, else by the -1 a connection shows; Fedora 44's 1.56 shows -1).
    remedy: >
      This computer's name is announced on every network you join, and names often identify their
      owner. Guide… sets a generic name and stops sending it.

  - id: net.kdeconnect
    title: KDE Connect / GSConnect enabled
    category: network
    severity: 4
    scope: user
    tier: guided
    why: Listens on the LAN and can sync notifications, clipboard and files with paired phones.
    detect:
      - 'pgrep kdeconnectd; ~/.config/kdeconnect/trusted_devices'
      - 'gnome-extensions list --enabled | grep gsconnect'
      - 'ss -tulpn for ports 1714-1764'
      - 'kdeconnectd''s /proc/PID/exe reading "PATH (deleted)" with nothing at PATH: KDE Connect was removed while it
        ran. The package manager leaves the daemon running and listening until logout (tested with pacman on CachyOS)'
    fix: >
      Review paired devices and enabled plugins; disable when unused. Removed while running: stop the daemon left
      running (pkill), which nothing starts again.
    remedy: >
      KDE Connect (or GSConnect) is waiting for phones on the local network. If you don't use it,
      Guide… turns it off; if you do, check which phones are paired.

  - id: net.vpn_leaks
    title: VPN without DNS leak protection or kill switch
    category: network
    severity: 4
    scope: user
    tier: advice
    detect:
      - 'While a VPN is up: resolvectl status. A "~." routing domain on the VPN link (or globally) keeps every
        query off the other links (systemd-resolved(8)); without one, links with DefaultRoute are asked too'
      - 'Only when lookups go through systemd-resolved (its stub in /etc/resolv.conf, or resolve in nsswitch.conf''s
        hosts line); otherwise the nameservers in /etc/resolv.conf, by the interface `ip route get` sends each through'
      - 'A VPN app that blocks leaks itself, always, with no setting (vpn-providers.yaml leak_protection: Mullvad VPN,
        whose firewall rejects every lookup but to the servers it set), with its daemon running and its tunnel carrying
        the traffic: a pass, and its lockdown setting read from the daemon (mullvad lockdown-mode get)'
    fix: >
      Configure DNS routing to the VPN link and a kill switch where the VPN client supports it. Never tell the user to
      turn on a protection their app has always on with no setting (vpn-providers.yaml leak_protection).
    remedy: >
      While the VPN is on, some lookups can go around it. Turn on your VPN app's DNS leak protection
      and kill switch where it has them as settings (some apps, Mullvad VPN's among them, have them
      always on); How to… explains for this computer.

  - id: net.vpn_provider
    title: Which VPN this computer uses, and who runs it
    category: network
    severity: 1
    scope: user
    tier: advice
    kind: info
    why: >
      A VPN moves trust from your internet provider to the VPN provider, which can see where your
      traffic goes. Who owns it, where it is based, whether its no-logs claim has been audited or
      tested in court, and whether it asks who you are all bear on how far to trust it.
    detect:
      - 'Interfaces named as a provider names its tunnel (wg0-mullvad, proton0, nordlynx...), from /sys/class/net'
      - 'The DNS server set on the tunnel interface (resolvectl status), matched against the addresses providers push'
      - 'The provider''s daemon among running processes; its own status command (local daemon only) for the server in use'
      - 'Facts come from vpn-providers.yaml, each with its source and the date it was last checked'
    fix: >
      Informational. Facts are data (vpn-providers.yaml), never verdicts; ownership changes often, so each fact
      shows its source and date, and a note appears when the data is more than a year old.
    remedy: >
      Nothing to fix here: this shows which VPN carries your traffic, the app's rating of it, and what
      is publicly known about who runs it, with the source of each fact. A provider rated low is also
      listed under “Your VPN provider is hard to trust”.
    related: [net.vpn_leaks, net.dns_leak, net.vpn_ipv6_leak, net.vpn_trust]
    verify: Interface, daemon and in-tunnel DNS names of each provider's current Linux app (vpn-providers.yaml `verify`).

  - id: net.vpn_trust
    title: Your VPN provider is hard to trust
    category: network
    severity: 4
    modifiers:
      - when: "vpn_closed_client"
        severity: 5
      - when: "vpn_closed_client and vpn_ownership_concerns"
        severity: 6
      - when: "vpn_avoid"
        severity: 8
    scope: user
    tier: advice
    why: >
      A VPN sees where all your traffic goes. A provider with harm on record (logging despite promising
      not to, selling its users' bandwidth, harvesting what they do), a Linux app whose source isn't
      published, or an owner with a record like Kape's asks for trust it hasn't earned.
    detect:
      - 'The provider in use, as net.vpn_provider recognises it (its interfaces, DNS, daemon), else one whose app is running'
      - 'vpn.rate on vpn-providers.yaml: harm on record (avoid, 8), a closed Linux client (5), an owner capped for its record (Kape: 4), closed and capped (6)'
      - 'Each reason is a fact with its source and the date it was checked'
    fix: >
      Advice: move to a provider rated Recommended or Good. The rating is data (vpn-providers.yaml, RATING), each
      gate decided by tagged facts; only the Linux client is judged.
    remedy: >
      Your VPN provider has a record that makes it hard to trust: the reasons are listed, each with its
      source. Consider moving to one rated Recommended or Good: the details name them, from the app's
      current data, with the facts behind each rating under “Which VPN this computer uses, and who runs it”.
    related: [net.vpn_provider, br.vpn_extensions]
    verify: The facts in vpn-providers.yaml, before each release (packaging/check-vpn-links.py).

  - id: net.dns_unencrypted
    title: Unencrypted DNS
    category: network
    severity: 3
    warn_lower: 2
    scope: system
    tier: guided
    detect:
      - 'resolvectl status (DNSOverTLS setting); check whether systemd-resolved is in use at all'
      - 'A local resolver: dnscrypt-proxy, stubby and cloudflared always encrypt; unbound, kresd, AdGuard Home,
        dnsproxy and blocky may send plain DNS (unbound resolves recursively in plain text by default): unknown'
      - 'A VPN tunnel that carries the traffic and takes every lookup (as net.vpn_leaks judges it: a "~." routing
        domain on its link, Mullvad VPN''s app sets one, or nameservers reached only through it): a pass, the lookups
        encrypted in the tunnel'
      - 'Firefox-family profiles with network.trr.mode 2 or 3 (DNS over HTTPS): listed; when every profile uses it,
        plain system DNS is a warning (other programs'' lookups) rather than a failure'
    fix: Configure DNSOverTLS in resolved.conf.d with a chosen resolver, or use the browser's DoH.
    remedy: >
      The names of the sites you visit travel unencrypted to your DNS server. Guide… turns on
      encrypted DNS with a provider you choose. It hides the lookups, not your browsing: your internet
      provider still sees which servers you connect to, and usually their names; a VPN or Tor hides those.

  - id: net.ipv6_privacy
    title: IPv6 privacy extensions disabled
    category: network
    severity: 3
    scope: user
    tier: auto
    detect:
      - 'use_tempaddr of each physical interface that is up with a global IPv6 address (with NetworkManager: others
        take the connection''s setting when they connect, so an unplugged port''s kernel value says nothing; without
        it, every physical interface''s own value); nmcli -g ipv6.ip6-privacy connection show <id>: a saved
        connection that sets anything but 2 is a finding'
      - 'Networks joined from now on: NetworkManager''s ipv6.ip6-privacy default from its [connection*] sections, per
        kind (Wi-Fi, wired; NetworkManager --print-config), else /proc/sys/net/ipv6/conf/default/use_tempaddr
        (NetworkManager.conf(5)); not 2 is a finding'
    fix: >
      NetworkManager's default for every connection that doesn't set its own, those joined later included (a conf.d
      drop-in of the app's own, through the helper), and ipv6.ip6-privacy=2 on saved connections that set something
      else. Tested on NetworkManager 1.58 (CachyOS): after the drop-in, the reconnected interface's use_tempaddr went from
      0 to 2, and back after the revert.
    remedy: >
      Your IPv6 address stays the same, so it can be used to track this computer. Fix… uses temporary
      addresses that change regularly.
    easy: true

  - id: net.hidden_ssid
    title: Saved hidden-SSID networks
    category: network
    severity: 3
    scope: user
    tier: guided
    why: The device broadcasts the network names in probe requests wherever it goes.
    detect:
      - 'nmcli -g 802-11-wireless.hidden connection show <id>'
    fix: Suggest making the network visible on the router, or removing the saved profile.
    remedy: >
      To find hidden networks, this computer calls out their names wherever it is. Guide… lists them:
      make the network visible on its router, or forget it here.

  - id: net.bluetooth
    title: Bluetooth always on, discoverable, or named after the user
    category: network
    severity: 3
    scope: user
    tier: guided
    detect:
      - 'bluetoothctl show (Powered, Discoverable, Alias)'
      - '/etc/bluetooth/main.conf DiscoverableTimeout'
      - 'On, hidden and not named after the user: a pass with a note (being on isn''t a finding)'
    fix: >
      Non-discoverable and a generic alias (recommended); turning the radio off is offered as a
      separate step, since it disconnects whatever is connected.
    remedy: >
      Bluetooth announces this computer to anyone nearby. Guide… hides it and gives it a generic name,
      or turns Bluetooth off.
    easy:
      option: hide
      cost: "Headphones, mice and keyboards pair as before (this computer looks for them). For a phone to find this computer, make it discoverable in the Bluetooth settings while pairing."

  - id: net.connectivity_check
    title: Connectivity checks to distro servers
    category: network
    severity: 1
    scope: system
    tier: guided
    detect:
      - 'NetworkManager config [connectivity] uri / enabled / interval (NetworkManager --print-config); interval=0
        turns checking off (NetworkManager.conf(5))'
    fix: Informational; can be disabled at the cost of captive-portal detection.
    remedy: >
      The system regularly contacts a server to check the internet works. Guide… turns that off; Wi-Fi
      sign-in pages then no longer open by themselves.

  - id: net.wifi_history
    title: Saved Wi-Fi networks record where this machine has been
    category: network
    severity: 3
    modifiers:
      - when: "fde == 'none' or fde == 'home'"
        severity: 5
    scope: user
    tier: guided
    why: >
      Every saved network keeps the time it was last used, so together they are a history of
      places; their passwords sit in /etc/NetworkManager/system-connections, readable from a
      live USB when the disk isn't encrypted.
    detect:
      - 'nmcli -g connection.timestamp connection show <uuid> for each 802-11-wireless connection (counts and ages, never names)'
    fix: Only networks unused for 90 days or more are a finding. Forget networks not used for months (nmcli connection delete); the app lists which ones in the guide.
    remedy: >
      Saved Wi-Fi networks are a record of places you've been. Guide… lists the ones not used for
      months and forgets those you choose.
    related: [net.hidden_ssid, enc.fde_missing]

  - id: net.open_autoconnect
    title: Saved open Wi-Fi networks reconnect automatically
    category: network
    severity: 3
    scope: user
    tier: auto
    why: >
      A saved network without a password is matched by its name alone, so any hotspot with the
      same name (an attacker's) gets this machine to join it without asking.
    detect:
      - 'nmcli: 802-11-wireless connections with no 802-11-wireless-security.key-mgmt and connection.autoconnect yes'
    fix: connection.autoconnect no for each; they still connect when chosen by hand.
    remedy: >
      This computer joins open Wi-Fi networks by itself, so a fake hotspot with the same name can
      catch it. Fix… makes them connect only when you choose them.
    easy:
      cost: "Open networks you saved connect only when you choose them in the network menu."

  - id: net.local_root_certs
    title: Root certificates were added to this computer
    category: network
    severity: 6
    warn_lower: 2
    scope: user
    tier: advice
    why: >
      A root certificate in the system's store is trusted to vouch for every website. Whoever holds
      the key of one that was added here (an antivirus or "web protection" product, an employer's or
      school's proxy, a developer tool such as mitmproxy, or someone who had administrator access)
      can stand between this computer and any site, read the traffic and change it, and the
      browser's padlock looks as it always does. A risk, not a problem: the app can't tell one you
      added on purpose from one you never heard of.
    detect:
      - 'Files in /usr/local/share/ca-certificates (Debian, Ubuntu), /etc/pki/ca-trust/source/anchors (Fedora), /etc/ca-certificates/trust-source/anchors (Arch), /etc/pki/trust/anchors (openSUSE)'
      - 'And the .p11-kit files `trust anchor FILE` writes beside those folders: /etc/ca-certificates/trust-source, /etc/pki/ca-trust/source, /etc/pki/trust (not blocklist/, nor one marked x-distrusted)'
      - 'Each one named with openssl x509 -noout -subject when openssl is installed (it reads a .p11-kit file too)'
      - 'Not counted: links into /usr (the distribution''s own: Fedora''s /etc/pki/ca-trust/source/ca-bundle.legacy.crt,
        a link to ca-certificates'' empty legacy bundle), files holding no certificate (no PEM certificate, DER or
        p11-kit object), and anything but *.crt in /usr/local/share/ca-certificates, the only files
        update-ca-certificates takes from there'
      - 'Not read: certificates added inside a browser (Firefox and Chromium keep stores of their own)'
    fix: Advice only; How to… gives the commands that remove one and rebuild the store.
    remedy: >
      Someone with the key of an added root certificate can read and change what you send to any
      website without a warning. Keep the ones you know and need (a workplace's, a tool you use);
      How to… shows what each is and removes the rest.
    related: [net.tls_interception]
    verify: >
      That a distribution's own package never puts files in these folders (they are the administrator's);
      Firefox's and Chromium's own stores (cert9.db, ~/.pki/nssdb), not read yet.

  - id: net.outgoing_firewall
    title: "Outgoing firewall: OpenSnitch, set up and explained"
    category: network
    severity: 1
    warn_lower: 2
    kind: info
    scope: user
    tier: feature
    why: >
      Not a fault: an optional tool, and a way to learn what programs do. OpenSnitch asks before a program
      connects out, so phone-home traffic shows up, and can be stopped, even in programs with no setting for it.
    detect:
      - 'Installed: /usr/bin/opensnitchd and /usr/bin/opensnitch-ui; the version from its Python package''s
        opensnitch/version.py; the unit opensnitchd.service (upstream, Arch) or opensnitch.service (Debian, Ubuntu):
        is-active, is-enabled'
      - '/etc/opensnitchd/default-config.json (readable by everyone): LogLevel (unset means 1, info), DefaultAction
        (applies while the window isn''t connected), FwOptions.QueueBypass, Server.Loggers'
      - '/etc/opensnitchd/rules: the names only (OpenSnitch names a saved rule after its website or program): the
        app''s own (000-daprivacyscanner-*) told apart and compared with what the helper would write now, the rest counted'
      - '~/.config/opensnitch/settings.conf: global/default_action (1 allow; anything else, or unset, deny, as the
        window reads it), database/type (1: a file); opensnitch-ui running; Autostart in ~/.config/autostart'
      - 'Deny mode: DefaultAction deny and the window''s default action deny. Anything else is allow mode, warned about
        with the feature until deny mode is on'
    fix: >
      A guide that explains as it goes. Installing is a command the user runs. The starter rules
      (helper opensnitch_rules starter: allow-system, a process.path regexp of the essentials installed here, and
      deny-telemetry, a dest.host regexp of phone-home hosts that break nothing, both 000-daprivacyscanner-*, then
      the daemon restarted) and the window's default action set to allow (QSettingsSet, with the window closed). Turning
      it on (set_service enable --now). Log level 3 (edit_config opensnitch, one line), emptying the log and its
      rotated copies (clear_opensnitch_log, irreversible), the window's list of connections back in memory when it is
      a file. A practice with curl and a browser, as commands. Blocking the connectivity checks (opensnitch_rules
      connectivity), not recommended: NetworkManager then reports limited connectivity. Deny mode (DefaultAction deny,
      the window's default action deny), refused until the starter rules are in place. Everything reverted from History.
    remedy: >
      Set up… explains what OpenSnitch is, gives the commands to install it, and walks through its window part by
      part. It adds starter rules that keep the computer working (undone from History), sets its log level so your
      answers aren't written to a log, and, once you're confident, turns on deny mode.
    related: [net.firewall_off, net.connectivity_check, tel.observed_traffic, tel.browser_telemetry, tel.crash_reporters,
              tel.devtools, br.content_blocking]
    verify: >
      Tested on CachyOS with OpenSnitch 1.7.2: what reaches the disk at log levels 2 and 3, the window's default action
      (0, deny) and 12-hour duration, the connection asked about held until the answer while the window's default
      applies to whatever else connects, rule order, the racy live reload of rule files, NetworkManager reporting
      limited connectivity with its check blocked, and every step applied and reverted through the app's API with the
      real helper. With Mullvad VPN 2026.5 (connected, disconnected, reconnecting, lockdown mode, split tunnelling, its
      DNS blockers): its kill switch unaffected, OpenSnitch stopped or killed included; deny mode needs mullvad-daemon
      and "Kernel connection" (the WireGuard tunnel) allowed, which the starter rules now do. Still to check: 1.5.8 on
      Ubuntu 24.04 or Mint 22 (iptables, its config, the rule files as written here, and the kernel's WireGuard packets,
      which without eBPF may get the default action whatever the rules say), openSUSE's and Fedora's packages, the
      Flathub id of Ungoogled Chromium, and how a Flatpak app appears in OpenSnitch.

# ---------------------------------------------------------------------------
# TELEMETRY AND PHONE-HOME
# ---------------------------------------------------------------------------

  - id: tel.crash_reporters
    title: Crash reporters and usage surveys
    category: telemetry
    severity: 3
    scope: system
    tier: guided
    why: Crash reports can include memory contents and are uploaded to vendors.
    detect:
      - 'Ubuntu: systemctl is-enabled apport whoopsie; /etc/default/apport enabled='
      - 'Fedora/RHEL: systemctl is-enabled abrtd'
      - 'Debian: /etc/popularity-contest.conf PARTICIPATE='
      - 'Arch: pkgstats, whose package links pkgstats.timer into timers.target.wants (static: masked or removed, never
        disabled); it sends the installed packages and the mirror weekly (pkgstats 3.5.6, tested on CachyOS)'
      - 'Ubuntu: motd-news, /etc/default/motd-news ENABLED=1 with a real /etc/update-motd.d/50-motd-news (Mint ships it
        empty: not counted); it sends the release, kernel, processor, uptime and cloud to motd.ubuntu.com'
      - 'KDE: DrKonqi asks before sending; User Feedback has its own check (tel.kde_feedback)'
    fix: Disable or set to ask before sending.
    remedy: >
      Crash reports can include parts of your documents. Guide… turns automatic reporting off, or
      makes it ask first.
    related: [tel.kde_feedback]
    easy:
      option: turn_off
      cost: "Crash reports are no longer sent by themselves; you can still report a bug by hand."

  - id: tel.location
    title: Location services enabled
    category: telemetry
    severity: 3
    warn_lower: 2
    scope: user
    tier: auto
    why: GeoClue sends nearby Wi-Fi access points, and the computer's internet address, to an online lookup service.
    detect:
      - 'GNOME: gsettings get org.gnome.system.location enabled'
      - '/etc/geoclue/geoclue.conf, then /etc/geoclue/conf.d/*.conf in name order (GeoClue 2.7+, later files win): [wifi] enable'
      - 'Wi-Fi adapters (/sys/class/net/*/wireless or phy80211): without one the lookup has only the internet address to
        go on, and the summary says so, never "nearby Wi-Fi networks"'
    fix: >
      GNOME: the location switch (gsettings). Other desktops have no switch of their own, so GeoClue's
      online Wi-Fi lookup is turned off for every account through the helper: a drop-in
      /etc/geoclue/conf.d/90-daprivacyscanner.conf ([wifi] enable=false) where GeoClue reads conf.d, else
      enable=false in geoclue.conf's [wifi] section (a fixed rule). GeoClue picks it up when it next starts.
    remedy: >
      Your computer can work out where you are by sending the Wi-Fi networks around you to an online
      service. Fix… turns that off; apps that need your location then can't find it by themselves.
    verify: >
      That GeoClue 2.7 reads conf.d after geoclue.conf with later files winning (2.7.0 on Ubuntu 24.04 has the
      folder), and that with [wifi] enable=false it makes no network lookups at all (GeoIP included).

  - id: tel.browser_telemetry
    title: Browser telemetry and studies
    category: telemetry
    severity: 3
    scope: system
    tier: guided
    detect:
      - 'Firefox and Thunderbird prefs: datareporting.healthreport.uploadEnabled, toolkit.telemetry.enabled, app.shield.optoutstudies.enabled'
      - 'Firefox policies.json: DisableTelemetry, DisableFirefoxStudies'
      - 'Firefox: datareporting.usage.uploadEnabled, the daily usage ping (on by default in Firefox 157, greprefs.js; the
        DisableTelemetry policy locks it off too, its Policies.sys.mjs)'
      - 'Chromium family: MetricsReportingEnabled policy in /etc/opt/chrome/policies/managed, /etc/chromium/policies/managed, etc.'
    fix: Apply enterprise policies (root) or per-profile prefs (user).
    remedy: >
      The browser sends usage data to its maker. Guide… turns it off, for this profile or for every
      account.
    easy:
      option: profile
      cost: "The browser has to be closed while it is changed."

  - id: tel.devtools
    title: Developer tool telemetry
    category: telemetry
    severity: 2
    scope: user
    tier: auto
    detect:
      - 'VS Code / VSCodium: settings.json "telemetry.telemetryLevel"; GitHub Copilot extension noted (sends code to GitHub)'
      - 'JetBrains IDEs: ~/.config/JetBrains/<Product>/options/usage.statistics.xml'
      - 'Env vars: DOTNET_CLI_TELEMETRY_OPTOUT, HOMEBREW_NO_ANALYTICS, NEXT_TELEMETRY_DISABLED, CHECKPOINT_DISABLE (HashiCorp),
        AZURE_CORE_COLLECT_TELEMETRY, SAM_CLI_TELEMETRY, GATSBY_TELEMETRY_DISABLED, NUXT_TELEMETRY_DISABLED, ASTRO_TELEMETRY_DISABLED,
        STRIPE_CLI_TELEMETRY_OPTOUT, DO_NOT_TRACK'
      - '.NET: only with an SDK (dotnet --list-sdks lists one): the runtime''s dotnet alone (dotnet-host, which Pinta
        pulls in on Omarchy) sends no telemetry'
    fix: Set opt-out env vars in ~/.config/environment.d/*.conf and the VS Code setting.
    remedy: >
      Developer tools here send usage data. Fix… opts out of all of them.
    verify: The JetBrains usage.statistics.xml layout, and which tools honour DO_NOT_TRACK.
    easy:
      cost: "Takes effect from your next login."

  - id: tel.http_repos
    title: Package repositories over plain HTTP
    category: telemetry
    severity: 2
    scope: system
    tier: advice
    why: Packages are signature-verified, but network observers can see what software is installed.
    detect:
      - 'grep -r "http://" /etc/apt/sources.list /etc/apt/sources.list.d/  (including deb822 URIs: fields)'
    fix: Switch to HTTPS mirrors.
    remedy: >
      Software downloads go over plain HTTP, so anyone on the network can see what you install (the
      packages themselves are still verified). How to… shows the change to HTTPS for each source.

  - id: tel.countme
    title: Fedora counts this computer in its statistics (DNF countme)
    category: telemetry
    severity: 1
    scope: system
    tier: auto
    applies_to: [Fedora, RHEL family]
    detect:
      - 'grep countme /etc/dnf/dnf.conf /etc/yum.repos.d/*.repo'
    fix: Set countme=0 (anonymous weekly counter; informational).
    remedy: >
      Fix… stops the anonymous weekly count Fedora keeps for its statistics.
    easy: true

  - id: tel.kde_feedback
    title: KDE user feedback (telemetry) enabled
    category: telemetry
    severity: 2
    scope: user
    tier: auto
    applies_to: [KDE Plasma]
    why: Plasma can send system and usage statistics to KDE; it is off unless turned on.
    detect:
      - '~/.config/PlasmaUserFeedback [Global] FeedbackLevel: absent or 0 = disabled (KUserFeedback NoTelemetry); 16 basic system information, 32, 48, 64 send more each'
    fix: FeedbackLevel=0 (kwriteconfig, reversible). Confirmed on Plasma 6.7.5 (System Settings shows 16 as "Basic system information", 0 as "Disabled").
    remedy: >
      Fix… turns off KDE's feedback reporting.
    easy: true

  - id: tel.cloud_sync
    title: Accounts and sync clients that copy data off this machine
    category: telemetry
    severity: 3
    warn_lower: 2
    scope: user
    tier: advice
    kind: info
    why: >
      Not a fault: an inventory of what leaves this machine by design, so it can be weighed
      with the rest. Online accounts sync calendars, contacts and mail; sync clients copy folders.
    detect:
      - 'GNOME Online Accounts: $XDG_CONFIG_HOME/goa-1.0/accounts.conf (provider types only)'
      - 'KDE: $XDG_CONFIG_HOME/libaccounts-glib/accounts.db (count)'
      - 'Nextcloud, ownCloud, Dropbox, Insync, MEGA, OneDrive clients: their config directories, native and Flatpak'
    fix: Informational; review what each account and client syncs, and whether it is end-to-end encrypted.
    remedy: >
      Nothing is wrong: these are the accounts and sync apps that copy data off this computer. Check
      each is something you want, and whether its provider can read what it stores.

  - id: tel.background_callers
    title: Services that contact servers in the background
    category: telemetry
    severity: 1
    warn_lower: 2
    scope: user
    tier: advice
    kind: info
    why: >
      Not telemetry, but regular contact that shows the machine's address to someone: firmware
      metadata from LVFS, Snap Store refresh checks, package metadata, and time servers.
    detect:
      - 'systemctl is-enabled fwupd-refresh.timer; snapd.service active; packagekit-background.timer / PackageKit'
      - 'Arch and CachyOS: archlinux-keyring-wkd-sync.timer (static: counted while active), cachyos-rate-mirrors.timer,
        and Arch-Update''s user timer arch-update.timer (systemctl --user), all on by default (seen on CachyOS)'
      - 'What each does, never how often: the distributions set that in their timers and change it (Fedora 44''s
        dnf-makecache.timer is OnUnitInactiveSec=3h)'
      - 'systemd-timesyncd or chronyd: configured NTP servers (timesyncd.conf, chrony.conf), else the distribution pool'
    fix: Informational; each can be turned off at a cost (no firmware updates, no snap updates, drifting clock).
    remedy: >
      Nothing is wrong: these services contact servers in the background. Each can be turned off, at a
      cost (no firmware updates, no snap updates, a drifting clock).

# ---------------------------------------------------------------------------
# BROWSERS
# ---------------------------------------------------------------------------

  - id: br.crashpad_dumps
    title: Browser and app crash dumps on disk
    category: browser
    severity: 3
    kind: hygiene
    scope: user
    tier: auto
    why: Minidumps can contain memory fragments, including URLs and content from incognito windows.
    detect:
      - '<profile root>/Crash Reports/{pending,completed}, for google-chrome, chromium, BraveSoftware/Brave-Browser, microsoft-edge, vivaldi'
      - 'Flatpak: ~/.var/app/<id>/config/<browser>/Crash Reports; Snap: ~/snap/chromium/common/chromium'
      - 'Firefox, LibreWolf, Thunderbird: <profiles folder>/Crash Reports/pending/*.dmp, *.extra (a minidump of the
        process''s memory and its notes, 2.8 MB, tested on Firefox 157 crashed by SIGSEGV), and each profile''s
        minidumps/ (content crashes)'
      - 'Electron apps (a ~/.config folder with GPUCache or Code Cache, native and Flatpak): Crashpad/{pending,completed,new,attachments}'
    fix: Delete existing dumps while the program that keeps them is closed; disable crash/metrics reporting by policy.
    remedy: >
      Clean… deletes the crash dumps browsers and apps keep, which can hold pages and messages you had open.
    verify: >
      Measure (fatrace, iotop) whether dumps are written locally when reporting is disabled,
      and how much the browser writes overall, before the app makes any claim about SSD wear.

  - id: br.extensions_broad
    title: Extensions with access to all sites
    category: browser
    severity: 5
    scope: user
    tier: guided
    detect:
      - 'Chromium: <profile>/Extensions/<id>/<version>/manifest.json permissions, host_permissions and content_scripts matches containing <all_urls>, *://*/*, http://*/*, https://*/*; skipped when disabled (extensions.settings.<id> in Preferences / Secure Preferences: disable_reasons, state 0), a component (location 5, 10), or limited to "on click" or chosen sites (withholding_permissions, then only runtime_granted_permissions count)'
      - 'Firefox: <profile>/extensions.json, active extensions outside the built-in locations (app-builtin, app-builtin-addons, app-system-*) and not signed by Mozilla (signedState 3, 4): userPermissions.origins, plus for MV3 the optional host permissions granted in extension-preferences.json'
    fix: >
      A step per extension: how to limit it to chosen sites in that browser (Chromium: site access "on click";
      Firefox MV3: the Permissions and data tab) or remove it there, with its own address. Firefox, without
      root: delete its .xpi in the profile while Firefox is closed (Firefox drops it at the next start; checked
      with Firefox 157). Native installs, for every account: block it by policy (ExtensionSettings
      installation_mode blocked / ExtensionInstallBlocklist), which also removes it.
    remedy: >
      These extensions can read and change every page you visit, passwords and messages included. Ad blockers
      and password managers need that; most others don't. Guide… goes through them one by one: keep it, limit
      it to the sites you choose, or remove it.

  - id: br.vpn_extensions
    title: VPN browser extensions with a record of harm
    category: browser
    severity: 4
    modifiers:
      - when: "vpn_closed_client"
        severity: 5
      - when: "vpn_closed_client and vpn_ownership_concerns"
        severity: 6
      - when: "vpn_avoid"
        severity: 8
    scope: user
    tier: guided
    why: >
      A VPN extension sees every page you open. Some have been caught harvesting what their users do
      (Urban VPN's captured conversations with AI chatbots) or selling their users' connections (Hola).
    detect:
      - 'Extensions in Firefox-family and Chromium-family profiles (native, Flatpak, Snap), enabled, whatever their site access'
      - 'Their ids matched against detect.extensions in vpn-providers.yaml; rated as their provider is (vpn.rate)'
    fix: >
      The steps of br.extensions_broad's guide for each one: remove it from the profile (Firefox, while closed), or
      block it by policy for every account (native installs).
    remedy: >
      A VPN extension here comes from a provider with a record of harm or that can't be checked. Guide…
      removes it; if you want a VPN in the browser, use one from a provider rated Recommended or Good.
    related: [br.extensions_broad, net.vpn_trust]
    verify: Extension ids in each store (vpn-providers.yaml `verify`), and that broad_extensions' reader sees MV3 ones.

  - id: br.surveillance_browsers
    title: Chrome, Edge, Opera or Yandex is installed
    category: browser
    severity: 3
    modifiers:
      - when: "chrome_or_edge_installed"
        severity: 4
      - when: "surveillance_default"
        severity: 5
      - when: "chrome_or_edge_default"
        severity: 6
    scope: user
    tier: advice
    why: >
      These browsers come from companies with a record of collecting more than they told people, or an
      owner with a record that is hard to trust. Chrome and Edge can't even run proper ad blocking any
      more. Installed, they are one click from being used; as the default, every link you open goes
      through them.
    detect:
      - 'Installed browsers (browsers.yaml detect.desktop): menu entries in native, Flatpak and Snap application folders and the user''s own, AppImages in the usual folders and on the desktop, pins on the GNOME dash, KDE and Cinnamon panels and XFCE launchers'
      - 'The default browser: xdg-settings get default-web-browser, else mimeapps.list (x-scheme-handler/https), else KDE''s BrowserApplication'
      - 'Each browser''s receipts are facts in browsers.yaml with their source and date'
    fix: >
      How to… gives the removal command for each install (apt/dnf/pacman, flatpak uninstall, snap remove, or deleting
      the AppImage), and Chrome's and Edge's software repositories with them. Advice only: removing a browser is the
      user's call (testing websites, a site that refuses anything else).
    remedy: >
      Remove them unless you need one: the only good reasons are testing websites you build, or a bank or
      government site that refuses every other browser (try Brave or ungoogled-chromium first: same
      engine). How to… gives the commands for this computer. If you keep one, accept this finding; it
      comes back if that browser becomes your default.
    related: [br.default_browser, br.content_blocking]
    verify: Desktop file ids of each browser per packaging (browsers.yaml `verify`); whether Edge's package adds a repository-rewriting cron job like Chrome's.

  - id: br.default_browser
    title: Your default browser isn't one built for privacy
    category: browser
    severity: 2
    modifiers:
      - when: "default_closed_ui"
        severity: 3
    scope: user
    tier: advice
    why: >
      Every link you open goes to the default browser. Some are built to leak as little as possible
      (Brave, LibreWolf, Waterfox, Zen, Floorp, Helium, ungoogled-chromium, Cromite, and at the top Mullvad
      Browser and Tor Browser); the others send more, or ask you to trust more.
    detect:
      - 'The default browser, as br.surveillance_browsers finds it, matched against browsers.yaml (class privacy)'
      - 'Vivaldi: closed interface and a daily unique ID (severity 3); Chrome, Edge, Opera, Yandex as default: not applicable here, br.surveillance_browsers reports it'
      - 'Lists every browser found and how it is installed'
    fix: >
      How to… sets another default for this desktop: xdg-settings set default-web-browser <id>.desktop, or the
      desktop's own default-applications settings.
    remedy: >
      Use one of the browsers built for privacy as your default. For every day, Brave, LibreWolf, Waterfox
      or Zen with history kept are the most practical; Mullvad Browser and Tor Browser protect you far
      better, Tor Browser most of all. How to… sets the default.
    related: [br.surveillance_browsers, br.content_blocking]

  - id: br.content_blocking
    title: Your browser blocks no ads or trackers
    category: browser
    severity: 3
    warn_lower: 2
    scope: user
    tier: advice
    why: >
      Ads and trackers follow you from site to site and are a common way in for malware. A content
      blocker such as uBlock Origin stops most of them before they load.
    detect:
      - 'Per profile: a blocker built in (browsers.yaml blocking: Brave Shields, uBlock Origin in Helium, LibreWolf and Mullvad Browser, Cromite''s own), else the uBlock Origin extension (uBlock0@raymondhill.net; cjpalhdlnbpafiamejdnhcphjbkeiagm) or uBlock Origin Lite (ddkjiahejlhfcafbddmgiahcphecmpfh, partial)'
      - 'Fails for the default browser (or, when it is unknown, any browser with profiles) with none; Tor Browser is exempt: the Tor Project advises adding no extensions'
      - 'A browser with no profile yet (every fresh install) is "not used yet": not applicable, never a pass that claims
        blocking; nor a default browser the app doesn''t know'
    fix: >
      How to… links uBlock Origin for that browser: addons.mozilla.org for Firefox-family browsers; on Chromium-family
      ones the full version needs Manifest V2 (ungoogled-chromium, Brave for now); Chrome and Edge get only uBlock Origin Lite.
    remedy: >
      Install uBlock Origin in this browser: it blocks ads and trackers and makes pages faster. How to… opens
      the right page. In Chrome and Edge only the weaker uBlock Origin Lite still works. Leave Tor Browser as
      it is: extensions make it stand out.
    related: [br.default_browser, br.surveillance_browsers, br.extensions_broad]
    verify: Extension ids of uBlock Origin and uBlock Origin Lite; built-in blockers on by default (Brave Shields, Cromite).

  - id: br.history_retention
    title: History, cookies and site data kept indefinitely
    category: browser
    severity: 4
    kind: hygiene
    scope: user
    tier: guided
    detect:
      - 'Firefox: privacy.sanitize.sanitizeOnShutdown and related clearOnShutdown prefs'
      - 'Chromium: ClearBrowsingDataOnExitList policy'
    fix: >
      Offer clear-on-exit for cookies, cache and history, with exceptions for sites the user wants to stay logged
      in to. Chromium-based browsers, for every user by policy: DefaultCookiesSetting=4 (site data kept only until
      the browser closes), or ClearBrowsingDataOnExitList, which Chromium only honours with SyncDisabled. Side note:
      deleted at exit, the cache can still be recovered from the disk (snapshots, SSD spare blocks); a cache that
      never reaches the disk avoids that, which is a small gain on top of clearing.
    remedy: >
      Guide… makes the browser clear history, cookies and cache when it closes, with exceptions for
      sites you want to stay signed in to.
    verify: That ClearBrowsingDataOnExitList still needs SyncDisabled, and Brave and Vivaldi honour both policies.

  - id: br.tracking_protection
    title: Weak tracking protection
    category: browser
    severity: 4
    warn_lower: 2
    scope: user
    tier: guided
    detect:
      - 'Firefox: browser.contentblocking.category (standard / strict / custom)'
      - 'Chromium: BlockThirdPartyCookies policy (default allows third-party cookies)'
    fix: Strict mode in Firefox; block third-party cookies in Chromium.
    remedy: >
      Guide… turns on stronger tracking protection: Strict in Firefox, blocked third-party cookies in
      Chromium-based browsers.

  - id: br.private_download_leak
    title: Private-session downloads leaking through the OS
    category: browser
    severity: 4
    scope: user
    tier: advice
    why: The browser forgets them, but thumbnails, recent-file lists and indexers still record them.
    detect:
      - 'Cross-reference files in the Downloads directory with desk.thumbnails, desk.recent_files and desk.indexers'
      - 'KDE: the apps'' own lists of what they opened (app.kde_recent_files: gwenviewrc [Recent Files], Gwenview''s
        recentfolders, Kate''s sessions, Ark''s list) and kactivitymanagerd''s resources database (ResourceEvent and
        ResourceScoreCache, targettedResource: a plain path), counted under the Downloads folder (seen with Gwenview
        26.08 on Plasma 6.7)'
    fix: Point to the related clean-ups.
    remedy: >
      Files downloaded in private windows are still recorded by thumbnails, recent files and file
      search, and on KDE by the apps that open them and the activity history. How to… points to the clean-ups that
      cover them.
    related: [desk.thumbnails, desk.recent_files, desk.indexers, app.kde_recent_files, desk.kde_activities]

  - id: br.disk_cache
    title: Disk cache and session store on persistent storage
    category: browser
    severity: 3
    kind: hygiene
    scope: user
    tier: guided
    detect:
      - 'Firefox: browser.cache.disk.enable, browser.sessionstore.privacy_level'
      - 'With the disk cache off, the cache already there: cache2 in the profile''s cache folder (~/.cache/mozilla/firefox/<profile>
        for ~/.mozilla/firefox and ~/.config/mozilla/firefox profiles, ~/.cache/librewolf/<profile>, the Flatpak''s
        ~/.var/app/ID/cache, the Snap''s .cache beside its dot folder); still a finding until it is deleted'
      - 'The session store (sessionstore-backups/recovery.jsonlz4) is written every few seconds whatever the settings:
        tested on Firefox 157, browser.sessionstore.resume_from_crash false included. It is said in a note, never claimed
        as kept off the disk'
      - 'profile-sync-daemon is not counted: it writes profiles back to disk regularly and leaves ~/.cache alone'
    verify: The cache folders of the Firefox forks (LibreWolf, Waterfox, Zen, Floorp) and of the Snap.
    fix: >
      Memory-only cache and sessionstore privacy level 2 in Firefox, and the cache already on disk deleted (every
      install: native, Flatpak, Snap, LibreWolf) while the browser is closed; for Chromium, clearing at exit or private
      windows.
    remedy: >
      Guide… keeps the browser's cache in memory instead of on disk, and deletes the one already there. The list of open
      tabs is still saved in the profile: clearing history when the browser closes, or private windows, keeps that short.

  - id: br.webrtc
    title: WebRTC IP exposure
    category: browser
    severity: 2
    scope: user
    tier: guided
    detect:
      - 'Firefox: media.peerconnection.ice.default_address_only'
      - 'Chromium: WebRtcIPHandling policy'
    fix: Restrict to the default route; mostly relevant with split-tunnel VPNs.
    remedy: >
      Video calls in the browser can reveal your local address, or your real address around a VPN.
      Guide… restricts that.

  - id: br.https_only
    title: Browser opens unencrypted pages without asking
    category: browser
    severity: 2
    scope: user
    tier: guided
    easy:
      option: https_only
      cost: A site that still has no HTTPS shows a warning first, with a button to carry on.
    why: >
      Browsers try HTTPS first, then fall back to plain HTTP without a word when it doesn't answer.
      Someone on the same network (a café's or airport's Wi-Fi, a tampered router) can make it not
      answer, and then reads and changes the page. HTTPS-Only Mode asks before loading anything
      unencrypted, so a forced downgrade shows.
    detect:
      - 'Firefox: dom.security.https_only_mode in prefs.js (the _pbm pref covers private windows only), or the HttpsOnlyMode policy; LibreWolf has it on unless prefs.js turns it off'
      - 'Chromium, Chrome, Edge, Vivaldi: https_only_mode_enabled or https_first_balanced_mode_enabled in Preferences, or the HttpsOnlyMode policy (force_enabled, force_balanced_enabled)'
      - 'Brave: profile.default_content_setting_values.httpsUpgrades 2 (Strict), 1 (Disabled), absent for Standard, its default, which falls back to HTTP'
    fix: Firefox, one pref in prefs.js while it is closed; the Chromium family by its settings page (steps).
    remedy: >
      On a network someone else controls, a page can be quietly loaded without encryption and read
      or changed on the way. Guide… makes the browser ask before it opens an unencrypted page.
    related: [br.tracking_protection]
    verify: >
      Vivaldi's and Edge's own wording for the setting, and that they write Chromium's pref (Chromium 153 and
      Brave 1.97 were set through their settings pages and read back, 2026-10-12).

  - id: br.site_permissions
    title: Websites allowed to use your camera, microphone or location
    category: browser
    severity: 3
    modifiers:
      - when: "site_default_allow"
        severity: 6
    scope: user
    tier: guided
    why: >
      A site you once allowed can turn on the camera or microphone, or read your location, whenever you
      have it open again, without asking; a browser set to allow every site does it for any page, ads and
      embedded frames included. The list of sites is also a record of where you made calls. This is the
      browser's side of the desktop's persisted portal permissions (the desktop asks separately for Flatpak browsers).
    detect:
      - 'Firefox family: permissions.sqlite (read-only, through sqlite_count), moz_perms rows of type camera,
        microphone or geo with permission 1, kept for good (expireType 0) or until a date not yet passed
        (expireType 2); session-only ones are left out. Defaults: permissions.default.camera / .microphone /
        .geo in prefs.js (0 ask, 1 allow, 2 block), and the Permissions policy''s BlockNewRequests'
      - 'Chromium family: Preferences, profile.content_settings.exceptions.media_stream_camera / media_stream_mic
        / geolocation entries with setting 1; defaults in profile.default_content_setting_values (1 allow, 2
        block); the DefaultGeolocationSetting policy'
      - 'Counts per permission and profile only, never the sites'
    fix: >
      Reviewing the sites is the user's (each browser's settings page, named for this machine): the app never
      writes permissions.sqlite or Preferences. Blocking new requests: Firefox-family profiles, FirefoxPref
      permissions.default.camera/microphone/geo = 2 while the browser is closed (the same as the "Block new
      requests" box in Firefox's permission settings); Chromium-family browsers installed natively, the
      DefaultGeolocationSetting = 2 policy through the helper (location only: Chromium has no policy that
      blocks camera requests while still allowing chosen sites).
    remedy: >
      Websites you once allowed can use your camera, microphone or location again without asking. Guide…
      shows where each browser lists them so you can remove the ones you don't need, and can stop sites
      from asking at all, so a page can't get them by a mis-click.
    related: [sbx.portal_permissions]
    verify: >
      Chromium's exception keys on current releases (geolocation may move to geolocation_with_options), and
      Brave's and Vivaldi's settings pages for site permissions.

  - id: br.account_sync
    title: Browser signed in to an account that syncs history and passwords
    category: browser
    severity: 5
    warn_lower: 3
    scope: user
    tier: advice
    why: >
      With sync on, history, passwords, bookmarks and open tabs are copied to Google, Microsoft,
      Opera, Brave, Vivaldi or Mozilla. Chrome, Edge and Opera sync can be read by the provider
      unless a sync passphrase is set: a problem. Firefox, Brave and Vivaldi sync, and Chrome with a
      sync passphrase, are end-to-end encrypted: the provider can't read them, so only a risk (it
      keeps a copy, and the account's password or the passphrase opens it).
    detect:
      - 'Chromium: <profile>/Preferences account_info non-empty or sync.has_setup_completed; sync.encryption passphrase flags'
      - 'Brave (sync chain) and Vivaldi (encryption password) always encrypt end to end'
      - 'Firefox: services.sync.username in prefs.js (only whether it is set, never the address)'
    fix: Sign out, or sync fewer data types; in Chrome set a sync passphrase so Google can't read it.
    remedy: >
      Your browsing data is copied to the provider's servers. Where the provider can read it, sign out,
      sync less, or in Chrome set a sync passphrase so Google can't; where it is end-to-end encrypted,
      give the account a strong password of its own. How to… shows where, for each browser here.
    verify: The Preferences keys for a custom sync passphrase across Chrome versions; Brave's and Vivaldi's sync keys.

  - id: br.ad_features
    title: Browser ad and suggestion features that report what you do
    category: browser
    severity: 3
    scope: user
    tier: guided
    why: >
      Chrome's Privacy Sandbox profiles your interests for advertisers from your history; search
      suggestions send every keystroke in the address bar to the search engine; sponsored
      shortcuts and suggestions in Firefox report what is shown and clicked.
    detect:
      - 'Chromium: Preferences privacy_sandbox.m1.topics_enabled / fledge_enabled / ad_measurement_enabled, search.suggest_enabled, safebrowsing.enhanced'
      - 'Firefox: browser.search.suggest.enabled, browser.urlbar.suggest.quicksuggest.sponsored, browser.newtabpage.activity-stream.showSponsoredTopSites'
      - 'Only a feature turned on in the profile (or by policy) counts; one on only as the browser ships is listed in a note, since every stock profile has them'
    fix: >
      Firefox prefs while it is closed; Chromium policies (PrivacySandboxAdTopicsEnabled, PrivacySandboxSiteEnabledAdsEnabled,
      PrivacySandboxAdMeasurementEnabled, SearchSuggestEnabled) for every user, or the settings page per profile.
    remedy: >
      Guide… turns off the browser's built-in advertising features and search suggestions.
    verify: Chromium's Preferences keys for the Privacy Sandbox APIs, and the policy names, on current releases.

# ---------------------------------------------------------------------------
# DESKTOP ACTIVITY TRACKING
# ---------------------------------------------------------------------------

  - id: desk.thumbnails
    title: Thumbnail cache persists and references sensitive locations
    category: desktop
    severity: 4
    warn_lower: 2
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 3
      # nothing leaking yet is a risk (warn_lower below these): 3, 2 on an encrypted disk, 1 when they expire
      - when: "thumbnails_on_disk_none_leaking"
        severity: 5
      - when: "thumbnails_on_disk_none_leaking and data_on_encrypted_disk"
        severity: 4
      - when: "thumbnails_on_disk_none_leaking and thumbnails_expire"
        severity: 3
      - when: "thumbnails_on_disk_none_leaking and thumbnails_expire and data_on_encrypted_disk"
        severity: 2
      - when: "thumbnails_reference_removable_or_container"
        severity: 7
      - when: "thumbnails_reference_removable_or_container and data_on_encrypted_disk"
        severity: 6
    scope: user
    tier: guided
    why: >
      Thumbnails survive deletion of the original, and each PNG embeds Thumb::URI (the full
      original path). Browsing an open encrypted container or USB stick leaves images and
      paths outside it. A cache on disk that holds none of those yet is still a risk: on a new
      install nothing leaks, but the next picture you download and delete, or open from a USB stick,
      starts the record, kept for months by default (GNOME: 180 days) or for ever. Deleted after at
      most 30 days (the desktop's own maximum age, or this app's clean-up rule) the record is short,
      and the risk is the lowest; kept longer, it is higher. Only a cache in memory passes, and only while the caches Flatpak and Snap apps keep
      for themselves, which stay on the disk, hold no leaking thumbnails.
    detect:
      - '$XDG_CACHE_HOME/thumbnails/{normal,large,x-large,xx-large,fail} and ~/.var/app/*/cache/thumbnails'
      - 'Parse PNG tEXt chunk Thumb::URI; flag orphans (file no longer exists)'
      - 'Flag URIs on removable drives, on encrypted volumes opened on demand (not unlocked at boot from /etc/crypttab:
        VeraCrypt, a LUKS stick), on FUSE mounts under /media, /run/media or /mnt, and under those places where nothing is
        mounted now (the drive is gone). Internal drives, and encrypted ones unlocked at boot, are as protected as the cache'
      - 'App-specific caches: gThumb, Shotwell, digiKam (see app.photo_dbs)'
      - 'GNOME: org.gnome.desktop.thumbnail-cache maximum-age / maximum-size'
      - '/proc/mounts: whether the cache is already a tmpfs mount (then nothing persists)'
      - 'The app''s mount unit in /etc/systemd/system: if it is there but not mounted, systemctl show ConditionResult says whether it was skipped at boot'
      - 'No cache folder and no desktop session (a server): not applicable'
    fix: >
      Delete orphans and sensitive entries; set a maximum age (GNOME's own setting; elsewhere a user tmpfiles.d
      rule of the app's own, ~/.config/user-tmpfiles.d/60-daprivacyscanner-thumbnails.conf, applied by systemd's
      daily user clean-up timer, which is enabled if it isn't); optionally keep ~/.cache/thumbnails
      in memory: a systemd mount unit of the app's own (tmpfs, size-capped, wanted by
      local-fs.target, skipped at boot if a folder on the way has become a link), mounted at once,
      so it is empty at every boot. /etc/fstab is never edited.
    remedy: >
      Thumbnails keep small copies of pictures you've seen, deleted ones and ones from USB drives
      included, and most systems keep them on disk for months. Guide… deletes the ones that leak,
      sets a maximum age, or keeps them in memory so none survive a restart.
    easy:
      option: in_memory
      cost: "Thumbnails are made again as you browse after each restart, and the ones cached now are deleted first. It uses memory only for what it holds, up to a limit."

  - id: desk.recent_files
    title: Recent files list (recently-used.xbel)
    category: desktop
    severity: 5
    kind: hygiene
    scope: user
    tier: guided
    why: Written by any GTK app regardless of desktop, so KDE users have it too.
    detect:
      - '$XDG_DATA_HOME/recently-used.xbel and ~/.var/app/*/data/recently-used.xbel'
      - 'GNOME: org.gnome.desktop.privacy remember-recent-files, recent-files-max-age'
      - 'Cinnamon: the same keys in org.cinnamon.desktop.privacy'
      - 'Other desktops: gtk-recent-files-enabled in ~/.config/gtk-3.0/settings.ini and gtk-4.0/settings.ini'
    fix: >
      Clear, then either keep a short maximum age (30 days; GNOME and Cinnamon) or stop remembering recent files
      (remember-recent-files false; elsewhere gtk-recent-files-enabled=false for GTK apps). To stop every app: an
      empty folder (0500) where the file goes, and on KDE kdeglobals [RecentDocuments] UseRecent=false, which
      KIO's KRecentDocument honours but System Settings' "Do not remember" doesn't set (KDE bug 501802). A
      read-only file is not enough, tested 2026-10-03 with GTK 3.24.52, GTK 4.22.5 and Qt 6.11.2: Qt's QSaveFile
      (KIO) refuses it, but GtkRecentManager (GTK 3 and 4) saves by renaming a new file over it and sets 0600, so
      the next KDE app writes again. A folder stops all three (GTK's rename fails, QSaveFile refuses). Flatpak and
      Snap apps keep a list of their own in their folder (~/.var/app/ID/data/recently-used.xbel): each one found is
      blocked the same way.
    remedy: >
      Every app you open files with adds them to this list, whatever the desktop's settings say. Guide… clears it,
      keeps it short or stops it, and can put a folder where the list is kept, which stops every app writing it
      (a read-only file stops KDE apps, but GTK apps such as Firefox replace it).
    verify: That GTK 3 and GTK 4 apps outside GNOME honour gtk-recent-files-enabled from settings.ini.
    easy:
      option: max_age
      cost: "Files you opened more than 30 days ago drop off the Recent list."

  - id: desk.kde_activities
    title: KDE activity database and recent documents
    category: desktop
    severity: 5
    kind: hygiene
    scope: user
    tier: auto
    applies_to: [KDE Plasma]
    why: Users report that the activity database keeps recording even when history is turned off.
    detect:
      - '$XDG_DATA_HOME/kactivitymanagerd/resources/database (SQLite, plus -wal and -shm)'
      - '$XDG_DATA_HOME/RecentDocuments/*.desktop'
      - '~/.config/kactivitymanagerd-pluginsrc (what to remember, history length)'
      - 'kdeglobals [RecentDocuments] UseRecent, MaxEntries'
      - 'Plasma 6 per-app state in $XDG_STATE_HOME/*staterc (Dolphin, Kate, etc.)'
    fix: >
      Stop kactivitymanagerd, clear the event and score tables, clear RecentDocuments, then stop the
      recording, or it fills again within a day: kdeglobals [RecentDocuments] UseRecent=false, and
      kactivitymanagerd-pluginsrc [Plugin-org.kde.ActivityManager.Resources.Scoring] what-to-remember=2
      (remember nothing); restart. Checked in kactivitymanagerd's source (StatsPlugin.cpp, 2026-09): 2 is
      NoApplications, which stops events, titles and file types being written; the daemon reloads the
      setting when it changes, and System Settings' Recent Files page writes the same key.
    remedy: >
      KDE records which files and apps you use. Fix… clears that record and stops it.
    verify: The ResourceEvent and ResourceScoreCache table names on the target Plasma version.

  - id: desk.indexers
    title: File content indexers (Baloo, LocalSearch/Tracker, Recoll)
    category: desktop
    # a content index is usually a risk (warn_lower below these): 3, or 5 on an unencrypted disk
    severity: 5
    warn_lower: 2
    modifiers:
      - when: "index_on_unencrypted_disk"
        severity: 7
      - when: "indexes_outside_home"
        severity: 6
      - when: "indexes_outside_home and index_on_unencrypted_disk"
        severity: 8
    scope: user
    tier: guided
    why: >
      Content indexers extract the text and metadata (authors, photo locations) of every document they can
      read in the folders they cover (Baloo: the home folder, hidden folders aside; LocalSearch: Desktop,
      Documents, Music, Pictures and Videos, plus the top of the home folder and Downloads) into a
      database of their own in the home folder. A risk whenever it is on, or an index from before is
      left: anything running as the user can search every document's words at once, home backups
      often take the database along, and the text of a deleted file stays in it for a while (its pages
      are freed, not overwritten). Worse on an unencrypted disk (a thief reads it too), and a problem
      when it covers removable drives, encrypted containers or other volumes (their text stays here
      after the drive is gone). File names only (Baloo's
      basic indexing) passes: it keeps no contents.
    detect:
      - 'Baloo: balooctl6 status (balooctl on Plasma 5); $XDG_DATA_HOME/baloo/index; ~/.config/baloofilerc'
      - 'GNOME 47+: localsearch status; older: tracker3 status; data in $XDG_CACHE_HOME/tracker3/files or
        $XDG_CACHE_HOME/localsearch'
      - 'LocalSearch with index-recursive-directories and index-single-directories both empty indexes nothing: tested
        with LocalSearch 3.11 (CachyOS), its count went to 0 and neither the words nor the file names were left in its
        database files, after a restart too. With no folders but files still counted, they are taken as left behind'
      - 'Recoll: an index in its configuration folder ($RECOLL_CONFDIR or ~/.recoll)/xapiandb is a full-text index;
        recoll.conf topdirs beyond the home folder count as indexes_outside_home. Tested with Recoll 1.44'
      - 'What they cover beyond the home folder: Baloo baloofilerc [General] folders; LocalSearch
        org.freedesktop.Tracker3.Miner.Files index-removable-devices and index-recursive-directories (indexes_outside_home)'
      - 'An index left on disk while indexing is off still holds what was indexed: warned like indexing on'
      - 'Whether the home folder (where the index lives) is encrypted (index_on_unencrypted_disk)'
    fix: >
      Recommended: turn indexing off and delete the index (Baloo: Indexing-Enabled=false, balooctl disable, delete
      ~/.local/share/baloo; LocalSearch: no folders to index, no removable drives, its service stopped while its
      database is deleted, then started again empty; Recoll: its index deleted, and its real-time indexer's autostart
      entry hidden, while recollindex isn't running). Alternatives: Baloo's basic indexing (file names only), with
      the index deleted so it is rebuilt without contents: baloo_file stopped through kde-baloo.service (or by
      name) and waited for, never with balooctl disable, which turns indexing off outside the plan's record, then
      started again through the unit (balooctl enable started it holding the app's captured output, and the app
      waited until its timeout: tested on Plasma 6.7). balooctl disable returns before baloo_file has exited, so the
      off option waits for it too before deleting. Never excluding folders as a fix: Baloo isn't trusted to
      forget (tested on Plasma 6.7: a RAM disk under the home folder is indexed, contents included; excluded
      afterwards, its files stayed in the index across a restart). The browser panel offers turning it off and
      deleting the index on its own (option key baloo_off).
    remedy: >
      File search copies the words inside your documents, and details such as where photos were taken,
      into a database that keeps them for a while even after you delete the files. Guide… turns it off and
      deletes that database, or limits it to file names.
    verify: >
      What stops working without it, as the guide says: Elisa (KDE) finding music through Baloo, GNOME Music
      showing an empty library without LocalSearch folders, Dolphin's tag searches.

  - id: desk.clipboard_history
    title: Clipboard history saved to disk
    category: desktop
    severity: 5
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 4
    scope: user
    tier: auto
    why: Copied passwords and sensitive text persist across reboots.
    detect:
      - 'Klipper (Plasma 6): a library in plasmashell, loaded by the Clipboard applet of the system tray
        (plasma-org.kde.plasma.desktop-appletsrc: the tray''s [General] extraItems, the applet under it); it
        writes every copy to $XDG_DATA_HOME/klipper/history3.sqlite and data/ as it is made, whatever
        klipperrc KeepClipboardContents says (that only empties it when Klipper starts). On is a finding
        before anything was copied; off with files left is one too'
      - 'Klipper (Plasma 5): history2.lst; KeepClipboardContents=false counts as not kept'
      - 'CopyQ (native and Flatpak com.github.hluk.copyq): copyq.conf [Options] clipboard_tab (default "&clipboard",
        translated: the first tab), its [Tabs] N\store_items (default true), copyq_tab_<the name in base64, "/" as "-">.dat
        beside copyq.conf up to CopyQ 16 and in $XDG_DATA_HOME/copyq/copyq/ from 17, which moves them at its first start;
        items over 1 KB under $XDG_DATA_HOME/copyq/copyq/items/, shared by every tab'
      - 'GPaste: $XDG_DATA_HOME/gpaste/'
      - 'xfce4-clipman: $XDG_CACHE_HOME/xfce4/clipman/'
      - 'GNOME extensions (e.g. Clipboard Indicator): check the extension''s cache directory; Pano: $XDG_DATA_HOME/pano@elhan.io/'
      - 'Diodon: $XDG_DATA_HOME/diodon/'
    fix: >
      Klipper on Plasma 6: KeepClipboardContents off, its history cleared through Klipper itself
      (clearClipboardHistory over D-Bus, while it still runs), then the Clipboard entry turned off in the
      system tray through plasmashell's evaluateScript (PlasmaTraySet: Klipper stops at once and stays off;
      reverting turns it back on). Plasma keeps the emptied database open until logout, and the copied text stays in
      its write-ahead log (history3.sqlite-wal) until then (live on Plasma 6.7): a second Fix… after logging back in
      deletes it ("Log out and back in first" until then); the check says Klipper is off and its old history is still
      on the disk meanwhile, never that Klipper saves it. A Clipboard widget of its own
      blocks the fix (it would keep Klipper running); outside Plasma, only the setting and the files. Plasma 5:
      the setting and the files, with how to turn it off by hand. CopyQ, while closed: the clipboard tab's
      "Save Items" off in copyq.conf (CopyQTabSet: that one setting, since CopyQ rewrites the rest of the file
      as it runs), and a script command of the app's own (CopyQCommand) that puts the newest item back when the
      clipboard's app quits, as Klipper's "prevent empty clipboard" does, with KWin's application/x-kde-onlyReplaceEmpty
      (taken only while the clipboard is empty; from Plasma 6.8 only once its app has quit; passwords marked with
      x-kde-passwordManagerHint are never kept by CopyQ, so never put back); its file and item files deleted when no other tab could
      own them (else CopyQ deletes them at its next start and quit); the user's other tabs are never
      touched. Suggests CopyQ, kept in memory, where Klipper was turned off. GPaste: save-history off (gsettings),
      then its file deleted (gpaste-daemon always runs, and doesn't hold the file open); xfce4-clipman: save-on-quit
      off (xfconf, xfce4-panel /plugins/clipman/settings/save-on-quit), then its file deleted; the Clipboard
      Indicator extension and Diodon: cleared, and the plan says their history comes back and how to turn their
      saving off (the extension's cache; Diodon has no setting). A manager holding its history open blocks the fix
      ("Close X first"). Pano runs inside GNOME Shell: its history is cleared from its own menu (a note, not a step).
    remedy: >
      Everything you copy is kept on disk, passwords included, where it outlasts a restart. Fix… deletes it and
      stops it being saved where the clipboard manager has a setting for it: KDE's Klipper is turned off, CopyQ is
      set to keep its history in memory only, and GPaste and Clipman stop saving theirs.
      If you want a clipboard history, CopyQ set up that way is the one to use.
    verify: >
      Plasma 5: whether Klipper writes history2.lst during a session with KeepClipboardContents off, and a way
      to turn its tray entry off (its tray is a containment of its own). The qdbus tool's name on Debian,
      Fedora and openSUSE. CopyQ's openSUSE package name (CopyQ).

  - id: desk.zeitgeist
    title: Zeitgeist activity log
    category: desktop
    severity: 4
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 3
    scope: user
    tier: auto
    detect:
      - '$XDG_DATA_HOME/zeitgeist/activity.sqlite; pgrep zeitgeist-daemon'
    fix: >
      Clear and disable: the datahub's autostart entry hidden, and the daemon (org.gnome.zeitgeist.Engine, with its
      indexer) kept from starting on demand over D-Bus by service files of the user's own that run /bin/false (a user
      file wins over the system's, tested with dbus-broker on CachyOS; the bus reloads its configuration after, since
      dbus-broker doesn't see a folder made since it started), since apps with Zeitgeist plugins log to it
      directly. What runs now is stopped first and waited for, by its name as the kernel keeps it (15 characters):
      the datahub (zeitgeist-datah, a logger started at login that runs until logout), the indexer (zeitgeist-fts)
      and the daemon (zeitgeist-daemo, through zeitgeist-daemon --quit), which holds the log open.
    remedy: >
      Fix… clears the activity log and stops it.
    easy:
      cost: "Its activity log so far is deleted; docks and launchers that show recent items from it start empty."

  - id: desk.gvfs_metadata
    title: File manager and viewers keep notes on each file (GVFS metadata)
    category: desktop
    severity: 3
    kind: hygiene
    scope: user
    tier: guided
    why: >
      Per-file notes kept by the file manager and document viewers (Evince, Xreader: the page each document
      was left on), including for files on removable drives and in encrypted containers.
    detect:
      - '$XDG_DATA_HOME/gvfs-metadata/'
      - '/proc/mounts: whether the folder is already a tmpfs mount (then nothing persists)'
    fix: >
      Stop gvfsd-metadata (it restarts on demand) and clear. Optionally keep ~/.local/share/gvfs-metadata in memory
      with a mount unit of the app's own, as for thumbnails: the notes work during a session and are forgotten at
      every boot.
    remedy: >
      The file manager keeps notes about files you've looked at. Guide… clears them, or keeps them in
      memory only.
    verify: That gvfsd-metadata starts afresh on an empty tmpfs and that Nautilus and Nemo cope with losing it at boot.

  - id: desk.screenshots
    title: Screenshots accumulating automatically
    category: desktop
    severity: 3
    warn_lower: 2
    kind: hygiene
    scope: user
    tier: guided
    detect:
      - '$(xdg-user-dir PICTURES)/Screenshots; Spectacle save location'
      - 'Screen recordings: $(xdg-user-dir VIDEOS)/Screencasts (GNOME, Spectacle); .webm, .mp4, .mkv, .gif'
      - 'The folder names Spectacle translates into the user''s language: spectaclerc [ImageSave]
        translatedScreenshotsFolder and [VideoSave] translatedScreencastsFolder (Plasma 6.7, tested); its
        videoSaveLocation when named like a screenshots or recordings folder'
      - '~/.config/user-tmpfiles.d/60-daprivacyscanner-screenshots.conf: whether they already expire'
    fix: >
      Report count and age; offer review. Optionally let them expire: a user tmpfiles.d rule of the app's own
      deleting screenshots in the Screenshots folder (never loose files elsewhere in Pictures) once they are older
      than 30 or 90 days (by modification and change time, so looking at one doesn't keep it), applied by systemd's
      daily user clean-up timer, which is enabled if it isn't. Where gnome-screenshot (Cinnamon) saves straight into
      Pictures, it is first pointed at a Screenshots folder (org.gnome.gnome-screenshot auto-save-directory, and the
      folder is created), since a rule can't expire loose files safely.
    remedy: >
      Guide… has old screenshots deleted automatically after 30 or 90 days.
    verify: >
      That the user systemd-tmpfiles-clean.timer runs on the targeted distributions once enabled, and that
      Cinnamon's Print key honours gnome-screenshot's auto-save-directory.

  - id: desk.gnome_app_usage
    title: GNOME application usage tracking
    category: desktop
    severity: 2
    kind: hygiene
    scope: user
    tier: auto
    applies_to: [GNOME]
    detect:
      - 'gsettings get org.gnome.desktop.privacy remember-app-usage'
      - '$XDG_DATA_HOME/gnome-shell/application_state'
    fix: Disable and clear. Outside GNOME, only the record a GNOME session left is deleted.
    remedy: >
      GNOME keeps a count of how often you use each app, for its Frequent list. Fix… clears it and
      stops it.

  - id: desk.session_restore
    title: Session restore reopens apps and documents
    category: desktop
    severity: 2
    kind: hygiene
    scope: user
    tier: auto
    detect:
      - 'KDE: ksmserverrc [General] loginMode'
      - 'GNOME: org.gnome.SessionManager auto-save-session; Cinnamon: org.cinnamon.SessionManager; MATE: org.mate.session'
      - 'Xfce (xfce4-session''s source, 4.16 to 4.20): /general/SaveOnExit, unset on before 4.19 (the logout dialog''s
        "Save session for future logins" box takes it as its default) and off from 4.19; saved sessions in
        ~/.cache/sessions/xfce4-session-HOST:DISPLAY; and with the logout dialog shown (/general/PromptOnLogout) and
        /general/ShowScreenshots (both on by default), a screenshot of the whole screen at each logout,
        ~/.cache/sessions/thumbs-DISPLAY/SESSION.png'
    fix: >
      Start with an empty session. Xfce: SaveOnExit and ShowScreenshots off (xfconf, reversible), the saved sessions
      and logout screenshots deleted. Tested against the real xfconf (xfce4-session 4.20.4 on CachyOS, run as Xfce).
    remedy: >
      The desktop saves which apps and documents were open when you logged out, and reopens them
      at the next login; Xfce also keeps a screenshot of your screen from each logout. Fix… makes it
      start fresh instead.

  - id: desk.folder_view_records
    title: File manager per-folder view records
    category: desktop
    severity: 2
    kind: hygiene
    scope: user
    tier: auto
    detect:
      - 'Dolphin: $XDG_DATA_HOME/dolphin/view_properties; .directory files on removable drives'
      - 'Dolphin 24.08 and later (26.08 tested) keep a folder''s view settings in its extended attribute
        user.kde.fm.viewproperties#1 (KFileMetaData; its source), a .directory file only where the filesystem has none:
        counted on removable drives'
    fix: Informational; offer cleanup.
    remedy: >
      Dolphin keeps view settings for each folder you've opened, USB drives included: a list of
      folders you've looked at. Clean… deletes them.

  - id: desk.file_manager_actions
    title: Verify and Remove metadata in the file manager's right-click menu
    category: desktop
    severity: 1
    warn_lower: 2
    kind: info
    scope: user
    tier: feature
    why: >
      Not a fault: an optional convenience. Right-click a download to verify it, or a photo or
      document to see and remove its metadata, without opening the app first.
    detect:
      - 'Installed file managers: nemo, dolphin, nautilus'
      - 'Nemo: ~/.local/share/nemo/actions/daprivacyscanner-verify.nemo_action and daprivacyscanner-metadata.nemo_action'
      - 'Dolphin: ~/.local/share/kio/servicemenus/daprivacyscanner.desktop (executable, as Plasma 6 requires)'
      - 'Nautilus: ~/.local/share/nautilus/scripts/Verify download and Remove metadata (executable)'
      - 'Each entry''s command: the program it names still exists (the app may have been moved)'
    fix: >
      WriteFile for each installed file manager's entries, calling `daprivacyscanner --tool verify` and
      `--tool metadata` with the selected files (the AppImage file, the installed command, or python -m),
      executable where the file manager requires it; written again when the app has moved; reverting removes
      them.
    remedy: >
      Set up… adds "Verify download…" and "Remove metadata…" to your file manager's right-click menu.
    related: [app.metadata_outbox]
    verify: >
      Nemo action keys on current Mint (checked against Mint 22.3's own mintstick-verify action), Dolphin
      service menus on Plasma 6 (MimeType=all/allfiles, the executable bit) and Plasma 5
      (X-KDE-ServiceTypes=KonqPopupMenu/Plugin), and Nautilus passing NAUTILUS_SCRIPT_SELECTED_FILE_PATHS.

  - id: desk.ephemeral_folder
    title: A folder in memory for temporary work (~/Ephemeral)
    category: desktop
    severity: 2
    warn_lower: 2
    kind: info
    scope: user
    tier: feature
    why: >
      Not a fault: an optional tool. Downloads, scans and working copies that shouldn't outlive the
      task can go in ~/Ephemeral, a folder kept in memory: nothing in it is written to the disk, and it
      is empty again after a reboot (or a logout, if chosen).
    detect:
      - '/proc/mounts: whether ~/Ephemeral is a tmpfs mount now, and its size and options'
      - 'The app''s mount unit for it in /etc/systemd/system: present, and wanted at boot (local-fs.target) or at
        login (user@UID.service)'
      - 'Swap (enc.swap_unencrypted, enc.swap_persistent) and hibernation: a tmpfs can be paged out to swap, and
        hibernation writes all of memory to disk'
    fix: >
      Set up by the helper, as the thumbnail cache's mount: a mount unit of the app's own for the calling user's
      ~/Ephemeral (tmpfs, mode 0700, their own), with the size the user chooses (500 MB by default), nosuid and
      nodev, and noexec unless the user chooses to run programs from it. Emptied at every reboot (wanted by
      local-fs.target), or also at logout (bound to the user's service manager, user@UID.service, which stops
      when their last session ends). The folder on disk under the mount is made read-only for its owner, so
      if the mount is ever missing, nothing can be saved there by mistake. Reverting refuses while the folder
      has files in it, unless forced: unmounting deletes them. The guide warns that swap on disk and
      hibernation undo much of the benefit, and names what else records the files (thumbnails, recent files,
      indexers, backups).
    remedy: >
      Set up… creates ~/Ephemeral, a folder kept in memory: what you put in it is gone at logout or
      restart. For files that should last, but open only with a password of their own (in a cloud-synced
      folder too, out of the sync company's reach), the guide suggests an encrypted vault made with Cryptomator.
    related: [enc.swap_unencrypted, enc.swap_persistent, desk.thumbnails, desk.recent_files, desk.indexers]
    verify: >
      That a mount unit bound to user@UID.service is stopped (unmounted) when the user's last session ends, and
      that lingering (loginctl enable-linger) keeps it until reboot.

# ---------------------------------------------------------------------------
# APPLICATIONS
# ---------------------------------------------------------------------------

  - id: app.photo_dbs
    title: Photo manager databases, including face recognition data
    category: apps
    severity: 5
    kind: hygiene
    scope: user
    tier: guided
    detect:
      - 'digiKam: digikam4.db, thumbnails-digikam.db, recognition.db (in the collection root by default)'
      - 'Shotwell: $XDG_DATA_HOME/shotwell/data/photo.db, $XDG_CACHE_HOME/shotwell/'
      - 'gThumb: native and Flatpak (org.gnome.gThumb) cache directories'
    fix: Inform; offer to clear caches and face data.
    remedy: >
      Photo apps keep databases of your photos, face recognition data included. Guide… clears their
      caches and face data.

  - id: app.messengers_mail
    title: Messenger and email local stores
    category: apps
    severity: 5
    warn_lower: 4
    kind: hygiene
    scope: user
    tier: advice
    detect:
      - 'Signal ~/.config/Signal; Telegram $XDG_DATA_HOME/TelegramDesktop; Discord ~/.config/discord; Slack ~/.config/Slack; Thunderbird profiles'
      - 'Include Flatpak and Snap variants'
    fix: Recommend local passcodes (Telegram), keyring-backed safeStorage, attachment cache cleanup.
    remedy: >
      Messages and attachments are stored on this computer. Set a local passcode where the app offers
      one (Telegram Desktop does; Signal Desktop has none, unlike Signal on a phone), and clear attachment
      caches from within each app. Where Signal keeps its database key in plain text, it encrypts the key
      with the system keyring at its next start once one is running and the "basic" password store isn't
      forced: see “Chromium/Electron apps using the "basic" password store”.
    related: [auth.chromium_basic_store]

  - id: app.editor_residue
    title: Editor swap, backup and undo files
    category: apps
    severity: 4
    kind: hygiene
    scope: user
    tier: guided
    why: Copies of files edited inside encrypted containers can end up outside them.
    detect:
      - 'Vim: ~/.viminfo, swap files (.*.swp next to files or in directory option), undodir'
      - 'Neovim: $XDG_STATE_HOME/nvim/{shada,swap,undo}'
      - 'Emacs: #file# and file~ backups'
      - 'gedit: file~ backups; Kate: swap file directory (configurable)'
      - 'VS Code and its builds (Code, Code - OSS, Code - Insiders, VSCodium; native and Flatpak): User/History, its Local
        History (a copy of each version saved, deleted files'' included; workbench.localHistory.enabled, on by default);
        Backups (unsaved files, hot exit) counted in a note, never deleted. JetBrains IDEs: ~/.cache/JetBrains/<product>/LocalHistory'
    verify: >
      That VS Code writes User/History when it saves (seen created empty by Code - OSS 1.138 on CachyOS; entries may be
      written at shutdown), and that workbench.localHistory.enabled false stops it.
    fix: >
      Offer cleanup; then keep Vim's and Neovim's swap and undo files in $XDG_RUNTIME_DIR (a per-user tmpfs,
      emptied at logout), written into the vimrc / init.vim / init.lua as a block of the app's own (a new ~/.vimrc
      also loads Vim's defaults.vim, which a user vimrc would otherwise turn off); Emacs as advice.
    remedy: >
      Guide… deletes the swap, backup and undo files editors leave behind, and keeps Vim's in memory
      from now on.

  - id: app.office
    title: Office suite recent lists and autorecovery copies
    category: apps
    severity: 4
    kind: hygiene
    scope: user
    tier: guided
    detect:
      - 'LibreOffice: ~/.config/libreoffice/4/user/registrymodifications.xcu (history entries), backup/'
      - 'Flatpak: ~/.var/app/org.libreoffice.LibreOffice/config/libreoffice'
      - 'OnlyOffice: $XDG_DATA_HOME/onlyoffice'
    fix: Clear history via the app (editing registrymodifications.xcu directly is fragile); clear backup copies.
    remedy: >
      Guide… clears LibreOffice's recent documents and leftover backup copies.

  - id: app.media_players
    title: Media player history and resume data
    category: apps
    severity: 4
    kind: hygiene
    scope: user
    tier: auto
    detect:
      - 'mpv: $XDG_STATE_HOME/mpv/watch_later (newer) or ~/.config/mpv/watch_later (older)'
      - 'VLC: ~/.config/vlc/vlc-qt-interface.conf [RecentsMRL]; vlcrc qt-recentplay'
      - 'SMPlayer: ~/.config/smplayer/'
      - 'Celluloid (Linux Mint''s player): mpv''s resume files in ~/.config/celluloid/watch_later (its source, 0.30)'
      - 'Haruna (KDE''s player): $XDG_DATA_HOME/haruna/haruna.db, tables recent_files and playback_position (full paths),
        and haruna.conf [General] LastPlayedFile; it saves a position for anything longer than [Playback]
        MinDurationToSavePosition minutes (1), whether or not it restores it (tested with Haruna 1.8)'
    fix: >
      Clear; disable recent lists where supported. Haruna: its database and last file cleared, MaxRecentFiles=0 and
      MinDurationToSavePosition=9999 (the most its settings page offers), after which it kept no recent files or
      positions (tested); it still notes the last file played, which no setting stops.
    remedy: >
      Clean… clears media players' recent lists and turns them off where possible.

  - id: app.cups_spool
    title: Print jobs and history retained by CUPS
    category: apps
    severity: 4
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 3
    scope: system
    tier: guided
    warn_lower: 2
    why: By default CUPS keeps document files for a day and job history (including titles) indefinitely.
    detect:
      - '/etc/cups/cupsd.conf PreserveJobFiles, PreserveJobHistory (Fedora keeps it root-only: needs administrator access)'
      - 'ls /var/spool/cups (d* = document data)'
      - 'lpstat -W completed -o'
      - 'Judged apart: documents kept at all is a problem; with none kept, the job list kept for good is a problem, for
        longer than a day a risk, for a day or less a pass (the guide''s second option; live on Mint it still failed,
        saying "keeps printed documents")'
    fix: Set PreserveJobFiles No and PreserveJobHistory to No or a short time; purge completed jobs.
    remedy: >
      Copies of documents you've printed are kept. Guide… stops keeping them and deletes completed
      jobs.

  - id: app.pdf_readers
    title: PDF reader document history
    category: apps
    severity: 3
    kind: hygiene
    scope: user
    tier: auto
    detect:
      - 'Okular: $XDG_DATA_HOME/okular/docdata/ (where each document was left); native and Flatpak. Its Open Recent
        list is app.kde_recent_files''s'
      - 'Zathura: $XDG_DATA_HOME/zathura/bookmarks.sqlite, table fileinfo (every file opened, with its page; zathura 0.5,
        tested), or the older plain history file; native and Flatpak'
      - 'Evince/Atril: stored in GVFS metadata (desk.gvfs_metadata)'
    fix: >
      Okular: delete docdata, while it is closed. Zathura: delete its database
      while it is closed, unless it holds the user's bookmarks or quickmarks (then left, and said, with set
      database "null" for zathurarc).
    remedy: >
      Clean… clears where you stopped reading in each document, and Zathura's list of the documents you opened.

  - id: app.kde_recent_files
    title: KDE apps keep their own lists of the files you opened
    category: apps
    severity: 3
    warn_lower: 2
    kind: hygiene
    scope: user
    tier: guided
    why: >
      Beside the shared recent files list, many KDE apps keep one of their own, with full paths: KolourPaint and
      Okular in their settings, Ark, Kate and KWrite in a file of their own, Gwenview a record of each folder
      browsed. None has a setting to turn it off, and System Settings' "Do not remember" doesn't reach them.
    detect:
      - '[Recent Files] (or [RecentFiles], KRecentFilesAction''s default) with File<N> entries in every
        $XDG_CONFIG_HOME/*rc and $XDG_STATE_HOME/*staterc, and the same in org.kde.* Flatpaks; marked [$i] is stopped.
        KolourPaint (kolourpaintrc, written as a file is opened) and Okular (okularrc, written when it quits), tested
        with KDE Gear 26.08.1 on Plasma 6.7.5; installed with nothing listed yet: still recording'
      - 'Ark: $XDG_DATA_HOME/ark/ark_recentfiles, a QSettings file (files\size), written when it quits; Kate and KWrite:
        $XDG_DATA_HOME/{kate,kwrite}/anonymous.katesession ([Recent Files] and each open document''s URL=); Gwenview:
        $XDG_DATA_HOME/gwenview/recentfolders/ (a file per folder); a folder where the file goes, or a read-only
        empty folder for Gwenview''s, is stopped (all tested, Gear 26.08.1)'
    fix: >
      Guided: clear the lists (ClearInFile on the group's entries; DeleteFiles for Ark's, Kate's and KWrite's files and
      Gwenview's records), while the app is closed. Stop them: the group marked immutable, [Recent Files][$i]
      (KConfigLock: KConfig's Kiosk marker, which the app can't write past) in a file of the app's name in
      ~/.config/kdedefaults, which Plasma 6 puts in XDG_CONFIG_DIRS beneath the user's own folder: the app reads it and
      never writes it. In the app's own file the marker didn't last: Gwenview, and Okular 26.08 when anything else in
      its file changed, rewrote the file without the empty group and listed again at the next start (live, 2026-10-17);
      in kdedefaults it held through those rewrites and a new session (Gwenview 26.08.2, Okular 26.08.2, Plasma 6.7),
      and reverting removes the file the fix made. Only that marker counts as stopped (or one in /etc/xdg). Flatpak
      apps (their XDG_CONFIG_DIRS is the runtime's) and lists in <app>staterc (read alone) can't be locked: cleared
      only, said so. For Ark, Kate, KWrite and Gwenview's records an empty 0500 folder where the list goes (MakeDir phase
      4, after the deletions). Tested: nothing recorded afterwards, the apps open files as before and show no error.
    remedy: >
      These KDE apps each keep their own list of the files you opened, with full paths, apart from the system's
      recent files list. Guide… clears the lists and can stop the apps keeping them; Open Recent then stays empty in
      them, and Kate and KWrite no longer reopen the documents you had open last time.
    related: [desk.recent_files, app.pdf_readers]

  - id: app.electron_caches
    title: Electron app caches
    category: apps
    severity: 3
    kind: hygiene
    scope: user
    tier: auto
    detect:
      - '~/.config/<App>/{Cache,Code Cache,GPUCache,IndexedDB,Service Worker}'
    fix: Clear only while the app is not running.
    remedy: >
      Clean… clears the caches of apps like Slack and Discord while they are closed.

  - id: app.package_logs
    title: Package manager logs reveal installation history
    category: apps
    severity: 2
    modifiers:
      - when: "not multi_user"
        severity: 0
    kind: hygiene
    scope: system
    tier: advice
    detect:
      - '/var/log/apt/history.log, /var/log/dpkg.log, /var/log/pacman.log, /var/log/zypp/history, dnf history, and
        DNF''s own logs (/var/log/dnf5.log on Fedora 41+, /var/log/dnf.log and dnf.rpm.log before: world-readable, seen
        on Fedora 44), each with its rotated copies'
      - 'Their mode: apt history.log, dpkg.log and pacman.log are 0644 (every account can read them; checked on Mint 22)'
      - 'Only another account could read them: on a computer with one account it isn''t applicable, as
        auth.login_history'
    fix: Informational.
    remedy: >
      Nothing to fix: these logs record what was installed and when. Most are trimmed over time; Arch's
      pacman.log isn't, and keeps everything since the system was installed. Where every account can read them,
      other users of this computer can see what you installed.

  - id: app.mail_remote_content
    title: Mail clients load remote content (tracking pixels)
    category: apps
    severity: 4
    scope: user
    tier: guided
    why: >
      Loading images from the sender's server tells them when, where and on what you opened a
      message. Both clients block it by default; this catches it turned on.
    detect:
      - 'Thunderbird: mailnews.message_display.disable_remote_image (true = blocked, the default)'
      - 'Evolution: gsettings org.gnome.evolution.mail image-loading-policy (never | sometimes | always); unreadable
        (a Flatpak keeps it in its sandbox) is couldn''t check, never blocked. Evolution is the program, the Flatpak, or
        mail in ~/.local/share/evolution: evolution-data-server alone (Mint) makes that folder without Evolution'
    fix: >
      Thunderbird pref back to blocked (while it is closed), offered only for profiles that load it (a missing pref is
      the default, blocked); Evolution image-loading-policy never.
    remedy: >
      Remote images in emails tell the sender when and where you read them. Guide… blocks them by
      default.

  - id: app.login_items
    title: What starts when you log in
    category: apps
    severity: 2
    warn_lower: 2
    scope: user
    tier: advice
    kind: info
    why: >
      Programs that start by themselves run as you, with your files, every time you log in, and keep
      running in the background: sync clients, chat apps, updaters, and anything else that added itself.
      Unwanted programs keep coming back the same way, through an autostart entry, a user service, a crontab
      line, or a program of the same name as a system one placed earlier on PATH (a "sudo" there sees your
      password). Most entries are expected; one that appeared without you is worth a look.
    detect:
      - 'XDG autostart: $XDG_CONFIG_HOME/autostart over $XDG_CONFIG_DIRS/autostart (/etc/xdg/autostart), less
        Hidden=true, X-GNOME-Autostart-enabled=false, OnlyShowIn/NotShowIn against $XDG_CURRENT_DESKTOP and a
        missing TryExec; what each starts (the Exec program''s name, never its arguments)'
      - 'systemd user units in *.wants and *.requires folders: ~/.config/systemd/user (yours), /etc/systemd/user and
        /usr/lib/systemd/user (the system''s); units masked by the user left out; the app''s own named as such'
      - 'crontab -l: entries counted (and @reboot ones), identified by a hash of the line: commands can hold
        passwords and are never shown'
      - 'Plasma: ~/.config/autostart-scripts, ~/.config/plasma-workspace/env and shutdown; ~/.xprofile and
        ~/.xsessionrc when not empty'
      - 'PATH (this session''s): folders under home before the system''s, and programs in them with the name of
        one in /usr/local/bin, /usr/bin, /bin, /usr/sbin or /sbin; sudo, su, ssh, gpg, passwd and the like are a risk
        note'
      - 'New since the last scan: the baseline keeps an HMAC (a random salt of its own) of each entry''s name, never
        the name; the scan''s changes list the new ones by name (from this scan), and scheduled scans notify'
    fix: >
      Advice with How to…: where this desktop lists autostart entries (GNOME Tweaks, Cinnamon's Startup
      Applications, Plasma's System Settings → Autostart, Xfce's Session and Startup), systemctl --user
      disable --now for units, crontab -e, and deleting a program from a PATH folder. The app changes nothing.
    remedy: >
      Nothing is wrong by itself: this lists what starts by itself when you log in, and programs of yours that
      run instead of the system's. Look for anything you don't recognise, above all an entry marked new since
      the last scan: that is how unwanted programs keep coming back. How to… shows where to turn each one off.
    related: [auth.startup_files_writable]

  - id: app.newer_than_checked
    title: Apps newer than this version of DA Privacy Kit was made for
    category: apps
    severity: 1
    warn_lower: 2
    scope: user
    tier: advice
    kind: info
    why: >
      The checks read where each app keeps its history, settings and data, and the fixes change those settings.
      Apps move them from time to time, most often in a major release. A check made for an older version can then
      look in the wrong place and find nothing, or a fix change a setting the app no longer reads.
    detect:
      - 'apps.yaml: each app''s packages (dpkg-query, rpm -q, pacman -Q), Flatpak ids (flatpak list --app) and snaps
        (snap list), read once per scan; the newest installed version against `checked`, by major version
        (major_parts, tolerance)'
      - 'Where the app keeps its data (`data`, natively, in its Flatpak and its Snap): nothing there while it is
        newer makes the checks that read it "couldn''t check" unless they found a problem anyway'
      - 'Notes on each check that reads such an app, and a line in its fix''s dry run (appversions.annotate,
        plan_note)'
    fix: >
      Advice only. packaging/check-app-versions.py is the maintainer's side: it compares apps.yaml with the latest
      releases and writes a review brief.
    remedy: >
      Nothing is wrong by itself: these apps have had a major release since this version of DA Privacy Kit
      was made, and a major version is more likely to change where and how an app keeps its data. The checks
      still ran, but may miss something: after a fix, scan again to see that it worked, and look for a newer
      version of DA Privacy Kit made for these versions.

  - id: app.shared_file_metadata
    title: Documents and pictures you save carry your name or location
    category: apps
    severity: 4
    scope: user
    tier: guided
    why: >
      LibreOffice writes the user name from its settings into every document's author and
      editing history, and GIMP copies a photo's metadata, GPS position included, into every image
      it exports; both travel with the file when shared.
    detect:
      - 'LibreOffice registrymodifications.xcu: /org.openoffice.UserProfile/Data givenname or sn set (whether, not what)'
      - 'LibreOffice /org.openoffice.Office.Common/Security/Scripting RemovePersonalInfoOnSaving (true = stripped on save)'
      - 'GIMP gimprc (~/.config/GIMP/<version>/gimprc, Flatpak org.gimp.GIMP, Snap gimp): (export-metadata-exif no),
        (export-metadata-xmp no), (export-metadata-iptc no); a missing option is GIMP''s default, which exports them'
      - 'Git: user.name / user.email in ~/.gitconfig or $XDG_CONFIG_HOME/git/config (whether it is a no-reply address,
        never the address): a note, since commits only travel when pushed'
      - 'mat2 / exiftool installed, for the Remove metadata tool'
    fix: >
      Turn on "Remove personal information on saving" (while LibreOffice is closed); set GIMP's three
      export-metadata options to no in gimprc (while GIMP is closed: it rewrites gimprc as it exits). Both apps
      rewrite these files every time they quit, so each change is its own lines (SettingLines: RemovePersonalInfoOnSaving's
      <item> line, gimprc's three lines), recorded and put back alone; a whole-file backup conflicted with every revert,
      and forced, put back an old file over everything changed since. Point to the Remove metadata tool and the Outbox
      (app.metadata_outbox) for photos and other files.
    remedy: >
      Documents and pictures you save carry your name, or where a photo was taken. Guide… makes LibreOffice
      remove personal information when saving and stops GIMP copying a photo's details into what it exports;
      for files you already have, Tools → Remove metadata makes a clean copy.
    related: [app.metadata_outbox]
    verify: >
      The registrymodifications.xcu paths for RemovePersonalInfoOnSaving on LibreOffice 7 and 24.x; GIMP's
      gimprc option names export-metadata-exif, -xmp and -iptc on 2.10 and 3.0, and that their default is yes.

  - id: app.metadata_outbox
    title: An Outbox that removes metadata from files you share (~/Outbox)
    category: apps
    severity: 2
    warn_lower: 2
    kind: info
    scope: user
    tier: feature
    why: >
      Not a fault: an optional tool. Photos and documents carry where they were made, who made them
      and with what; a copy put in ~/Outbox comes out in ~/Outbox/Cleaned without them, ready to send.
    detect:
      - '~/.config/systemd/user/daprivacyscanner-outbox.path and .service: present, the path unit enabled'
      - 'The service''s ExecStart: the program it names still exists (the app may have been moved)'
      - 'mat2 installed (the service runs it)'
    fix: >
      A user path unit of the app's own (PathChanged=%h/Outbox) starting a oneshot service that runs
      `daprivacyscanner --outbox` (the AppImage file, the installed command, or python -m from a source tree):
      each file put directly in ~/Outbox is copied into a private temporary folder, cleaned by mat2 there, the
      clean copy moved to ~/Outbox/Cleaned and the original to ~/Outbox/Originals; what mat2 can't clean is
      moved to ~/Outbox/Not cleaned. Nothing is deleted; a notification says what happened. Set up with MakeDir
      (~/Outbox, 0700), WriteFile for both units and UserUnitSet enabling the path unit; reverting disables it
      and removes the units, leaving ~/Outbox and what is in it.
    remedy: >
      Set up… creates ~/Outbox: put a copy of a photo or document in it, and a copy without its hidden
      details (where it was taken, the author, the camera) appears in ~/Outbox/Cleaned.
    related: [app.shared_file_metadata]
    verify: >
      Confirmed on systemd 255 (Mint 22.3) that PathChanged= on a directory starts the service for a file
      written into it; the other distributions' systemd, and the whole Outbox with a real mat2.

  - id: app.boxes
    title: A Box for an app you don't fully trust (~/Boxes)
    category: apps
    severity: 2
    warn_lower: 2
    kind: info
    scope: user
    tier: feature
    why: >
      Not a fault: an optional tool. An app you need but don't fully trust (a chat or meeting app, a tool
      from outside your distribution) can read everything in your home folder like any other program. In a
      Box it has a home folder of its own and never sees yours.
    detect:
      - '~/Boxes/<name>/box.json for each Box: what it runs and what it gets'
      - '~/.local/share/applications/daprivacyscanner-box-<name>.desktop: present, and starting this copy of the app'
      - 'Its program still there: the copy in the Box, the installed program, or the Flatpak'
    fix: >
      MakeDir for ~/Boxes/<name> with home and Exchange (0700), CopyTree for a program kept from a trial of a
      downloaded file (into ~/Boxes/<name>/app), WriteFile for box.json and for a menu entry that runs
      `daprivacyscanner --box <name>`. The Box starts in the sandbox a trial uses (tools/trial.py: bubblewrap,
      or Flatpak's own sandbox with the app's declared permissions dropped), with ~/Boxes/<name>/home as its
      home and ~/Boxes/<name>/Exchange at ~/Exchange inside. Each run is watched only while it runs and kept
      as numbers in runs.json (hosts as salted hashes, never names). Reverting removes the menu entry, the
      settings and the copied program; the home and Exchange stay when they hold anything.
    remedy: >
      Set up… makes a Box for an app: it then starts from the menu as "NAME (in its Box)", with a home folder
      of its own in ~/Boxes. It can't read your files; what you want to give it, or take from it, goes through
      the Box's Exchange folder.
    related: [sbx.flatpak_broad_perms]
    verify: >
      Tried on Mint 22.3 (Cinnamon, X11) and CachyOS (KDE Plasma 6.7, Wayland): the Box set up through the guide,
      started from its menu entry's command, its data kept between runs, and reverted from History.

# ---------------------------------------------------------------------------
# SANDBOXING AND PERMISSIONS
# ---------------------------------------------------------------------------

  - id: sbx.flatpak_broad_perms
    title: Flatpak apps with broad permissions
    category: sandbox
    severity: 5
    scope: user
    tier: guided
    detect:
      - 'flatpak list --app --columns=application; flatpak info --show-permissions <id>; flatpak override --show <id>'
      - 'Flag filesystems=home|host|host-os|host-etc, devices=all, session bus access'
      - 'Flag talk access to org.freedesktop.Flatpak as critical (allows escaping the sandbox)'
    fix: 'flatpak override --user --nofilesystem=home <id> (and similar); suggest Flatseal.'
    remedy: >
      These Flatpak apps can read your whole home folder. Guide… removes that access per app; they can
      still open files you pick.

  - id: sbx.flatpak_caches
    title: Flatpak apps keep separate caches and history
    category: sandbox
    severity: 2
    kind: hygiene
    scope: user
    tier: auto
    why: Cleaners that only look at native paths miss everything under ~/.var/app.
    detect:
      - '~/.var/app/<id>/{cache,config,data,.local/state}'
    fix: Every other check must enumerate these paths; this check reports totals.
    remedy: >
      Clean… clears the Flatpak apps' caches.

  - id: sbx.x11_session
    title: X11 session lets every app see the clipboard and other windows
    category: sandbox
    severity: 4
    modifiers:
      - when: "session == 'wayland'"
        severity: 0
    scope: user
    tier: advice
    why: >
      X11 has no isolation between programs: any X11 client can read the clipboard, capture what any other
      window shows (password prompts included) and log keystrokes, with no permission asked. Wayland keeps
      programs to their own windows and asks before one records the screen.
    detect:
      - 'echo $XDG_SESSION_TYPE'
    fix: >
      Recommend a Wayland session where the hardware and apps allow it, or a desktop with full Wayland support
      (GNOME, KDE Plasma). Cinnamon's Wayland session is experimental; its full support is hoped for by the end
      of 2026, and the guide says so on Cinnamon.
    remedy: >
      In an X11 session any app can read the clipboard, see what other windows show and record what you type.
      Use a Wayland session if your desktop, hardware and apps work with it, or a desktop with full Wayland
      support; How to… shows where to choose it.

  - id: sbx.leftover_data
    title: Leftover data from uninstalled apps
    category: sandbox
    severity: 3
    modifiers:
      - when: "data_on_encrypted_disk"
        severity: 2
    scope: user
    tier: guided
    detect:
      - '~/.var/app/* not in flatpak list'
      - '~/snap/* not in snap list'
      - 'Native ~/.config and ~/.local/share dirs with no matching installed package (low confidence)'
    fix: List for review; never auto-delete native candidates.
    remedy: >
      Apps you've uninstalled left their data behind. Guide… lists it for you to review and delete.

  - id: sbx.portal_permissions
    title: Persisted portal permissions (camera, microphone, location, screenshots)
    category: sandbox
    severity: 3
    scope: user
    tier: guided
    detect:
      - 'flatpak permissions; flatpak permission-show <id>'
    fix: Review; flatpak permission-reset <id>.
    remedy: >
      Apps keep permissions you gave them for the camera, microphone, location or screenshots. Guide…
      lists them and resets the ones you choose.

  - id: sbx.snap
    title: Snap retained revisions and classic confinement
    category: sandbox
    severity: 3
    scope: user
    tier: guided
    detect:
      - 'snap list --all (disabled revisions); snap get system refresh.retain'
      - 'snap list: "classic" in Notes = unconfined'
      - '~/snap/<name>/<rev> per-revision data copies'
    fix: Remove disabled revisions; inform about classic snaps.
    remedy: >
      Guide… removes old snap versions, which keep copies of app data.

  - id: sbx.appimages
    title: AppImages run without a sandbox
    category: sandbox
    severity: 2
    warn_lower: 2
    scope: user
    tier: advice
    kind: info
    why: An AppImage is a plain program with full access to your files; nothing confines it.
    detect:
      - '*.AppImage under ~/Applications, ~/Downloads, ~/bin, ~/.local/bin, ~/.local/share/applications (count only)'
    fix: Informational; prefer the Flatpak where the app offers one, and keep AppImages from sources you trust.
    remedy: >
      Nothing is wrong, but AppImages run with full access to your files. Prefer a Flatpak where one
      exists, and keep AppImages only from sources you trust.

# ---------------------------------------------------------------------------
# KERNEL AND PHYSICAL ATTACK SURFACE
# ---------------------------------------------------------------------------

  - id: kern.updates
    title: Updates waiting to be installed
    category: kernel
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "security_updates_pending"
        severity: 6
      - when: "kernel_update_pending or kernel_restart_pending"
        severity: 7
    scope: system
    tier: guided
    why: >
      Graded by what is waiting. A kernel or CPU microcode update matters most: every program, and
      the walls between programs and accounts, run on top of it, so a kernel flaw lets any program
      that is compromised take over the machine, and its fixes only apply after a restart (a newer
      kernel installed but not yet running counts the same). Updates the distribution marks as
      security fixes come next (a browser's can be as urgent). Other updates are worth installing,
      and can carry fixes nobody labelled, but are rarely urgent. pacman marks no update as a
      security fix, so on Arch the severity says it could be higher.
    detect:
      - 'Debian/Ubuntu: apt list --upgradable (security: the -security suite); /etc/apt/apt.conf.d/20auto-upgrades'
      - 'Fedora: dnf -C check-update, dnf -C updateinfo list --security; dnf-automatic timer'
      - 'Arch: pacman -Qu (no security marking offline); openSUSE: zypper lu, zypper lp --category security'
      - 'Kernel: kernel and microcode package names; a newer kernel in /usr/lib/modules (same build) than /proc/sys/kernel/osrelease, or the running one''s modules gone'
      - 'flatpak remote-ls --updates; snap refresh --list'
      - 'Firmware: fwupdmgr get-updates --json --no-metadata-check --no-unreported-check --no-reboot-check (the metadata already on the machine; not in a VM or container)'
    fix: Prompt to update (and restart for a new kernel); offer automatic security updates where the distro supports them; fwupdmgr update for firmware.
    remedy: >
      Guide… shows how to install the waiting updates and turns on automatic security updates. Restart
      afterwards if the kernel was updated.
    verify: Kernel and microcode package names on each distro; dnf -C updateinfo output (dnf4 and dnf5); zypper list-patches table; fwupdmgr's JSON with updates waiting on real hardware (Devices[].Releases[], Urgency).

  - id: kern.release_unsupported
    title: This release of the operating system no longer gets security updates
    category: kernel
    severity: 8
    warn_lower: 5
    scope: user
    tier: advice
    why: >
      Every release of a distribution gets security fixes for a set time, then none: flaws found
      after that stay open in the browser, the kernel and everything else, for good. Nothing on the
      computer says so by itself, since an update tool with no updates to offer looks the same as
      one that is up to date. A warning when the end is less than 90 days away, or when only a
      reduced, extended support is left (Debian's Long Term Support).
    detect:
      - 'SUPPORT_END in /etc/os-release (Fedora, NixOS, whoever sets it)'
      - 'Ubuntu, Debian, Devuan and what is built on them (UBUNTU_CODENAME, DEBIAN_CODENAME or VERSION_CODENAME in os-release: Mint, LMDE, Pop!_OS, Zorin): the eol column of /usr/share/distro-info/ubuntu.csv, debian.csv or devuan.csv (distro-info-data), eol-esm for Ubuntu Pro and eol-lts for Debian LTS'
      - 'Ubuntu past eol with eol-esm ahead: Ubuntu Pro in use when /etc/apt/sources.list.d/ubuntu-esm-infra.list or .sources is there'
      - 'Rolling releases (BUILD_ID=rolling, Arch and what is built on it, openSUSE Tumbleweed, or no VERSION_ID at all) and development releases (no release date yet): not applicable'
    fix: Advice only; How to… gives this distribution's route to a supported release.
    remedy: >
      Once a release is out of support, the flaws found in it are published and never fixed on your
      computer, and "no updates waiting" stops meaning anything. Move to a release that is still
      supported: How to… gives the steps for this distribution.
    related: [kern.updates]
    verify: >
      That Ubuntu Pro's esm-infra source file is only there while the machine is attached; dnf system-upgrade's
      reboot command on DNF5. Read in containers on 2026-10-12: Fedora 44, AlmaLinux 9 and Rocky Linux 9 set
      SUPPORT_END, openSUSE Leap 15.6 doesn't (couldn't check); distro-info-data comes with Debian 12's desktops
      and Debian 13's Cinnamon, not with Debian 13's GNOME, KDE or Xfce (the result then gives the command that
      installs it).

  - id: kern.package_signatures
    title: Packages installed without checking their signatures
    category: kernel
    severity: 3
    warn_lower: 2
    modifiers:
      - when: "signature_checks_off"
        severity: 7
      - when: "signature_checks_off and unsigned_over_http"
        severity: 9
    scope: user
    tier: advice
    why: >
      Updates run as root. Package managers check that each package is signed by the repository's
      key, so a hacked mirror or anyone on the network can't hand you a changed one. With that check
      turned off for a repository, whoever controls the mirror, or (over plain HTTP) the network
      between you, can install anything on this machine with the next update. Less serious: a key in
      apt's old shared keyring (/etc/apt/trusted.gpg, from apt-key) is trusted for every repository,
      so one added for a small third-party repository could sign packages that replace the
      distribution's own.
    detect:
      - 'apt: [trusted=yes], [allow-insecure=yes], [allow-weak=yes], [allow-downgrade-to-insecure=yes] in sources.list(.d) one-line entries; Trusted / Allow-Insecure / Allow-Weak / Allow-Downgrade-To-Insecure: yes in .sources stanzas (Enabled: no skipped)'
      - 'apt.conf(.d): APT::Get::AllowUnauthenticated, Acquire::AllowInsecureRepositories, Acquire::AllowDowngradeToInsecureRepositories, Acquire::AllowWeakRepositories set true'
      - 'apt: /etc/apt/trusted.gpg present and not empty (the apt-key keyring, trusted for every repository)'
      - 'apt: keys in /etc/apt/trusted.gpg.d that aren''t the distribution''s (owned by its keyring package,
        dpkg-query -S, or named after its os-release ID or ID_LIKE: Mint''s installer leaves an unowned
        linuxmint.key.asc), trusted for every repository too; seen on Mint 22: none flagged'
      - 'dnf/yum: gpgcheck (or pkg_gpgcheck) 0/false/no/off in an enabled section of /etc/yum.repos.d/*.repo, or in [main] of /etc/dnf/dnf.conf or /etc/yum.conf'
      - 'zypper: gpgcheck / pkg_gpgcheck off in /etc/zypp/repos.d/*.repo (enabled ones) or /etc/zypp/zypp.conf [main]'
      - 'pacman: SigLevel containing Never, PackageNever, Optional or PackageOptional in /etc/pacman.conf [options] or a repository section (LocalFileSigLevel is left alone: files you install by hand)'
      - 'Flatpak: gpg-verify=false in a [remote "..."] section of /var/lib/flatpak/repo/config or ~/.local/share/flatpak/repo/config'
      - 'Plain HTTP: the same entry, section or stanza has an http:// URI, baseurl, Server or url'
    fix: >
      Advice, with How to…: per file, the line to change (sudoedit), and for repositories that then fail,
      that they have no valid signature and shouldn't be used. dnf: gpgcheck=1; zypper: zypper modifyrepo
      --gpgcheck; pacman: SigLevel = Required DatabaseOptional; Flatpak: flatpak remote-modify --gpg-verify
      (with --gpg-import when the key isn't there). The legacy apt keyring: move each key to
      /etc/apt/keyrings and name it with signed-by in the one repository that uses it. The app never edits
      these files: a mistake there breaks updates.
    remedy: >
      Your package manager has been told not to check that some packages really come from their
      repository, so whoever runs that mirror, or anyone on the network if it is plain HTTP, could slip
      you a changed package with the next update, and updates run as administrator. How to… shows the
      exact line to change in each file.
    related: [tel.http_repos, kern.updates]
    verify: dnf5's name for gpgcheck (pkg_gpgcheck, with gpgcheck as an alias) and its default; zypper's
      option names in zypp.conf on Leap and Tumbleweed.

  - id: kern.ptrace_scope
    title: Processes can read each other's memory (ptrace_scope 0)
    category: kernel
    severity: 4
    scope: system
    tier: guided
    why: Any process running as the user can read password manager and browser memory.
    detect:
      - 'cat /proc/sys/kernel/yama/ptrace_scope'
    fix: sysctl.d drop-in kernel.yama.ptrace_scope=1 (note it affects attaching debuggers).
    remedy: >
      Guide… stops programs reading the memory of other programs you run.
    easy:
      option: scope_1
      cost: "A debugger can only attach to a program it starts itself, unless run as administrator."

  - id: kern.dmesg_restrict
    title: Any user can read the kernel log (dmesg_restrict 0)
    category: kernel
    severity: 3
    modifiers:
      - when: "multi_user"
        severity: 5
    scope: system
    tier: auto
    why: >
      The kernel log records every USB device plugged in (with serial numbers), drives mounted, and
      Wi-Fi and Bluetooth activity: a record of what was done with the machine, readable by every
      account and every program.
    detect:
      - 'cat /proc/sys/kernel/dmesg_restrict (0 = anyone may read)'
      - 'Members of adm / systemd-journal can still read kernel messages through the journal'
    fix: sysctl kernel.dmesg_restrict=1 now and a sysctl.d drop-in for boot (root, reversible).
    remedy: >
      Fix… makes the kernel log readable by administrators only.
    related: [kern.proc_hidepid]
    easy: true

  - id: kern.proc_hidepid
    title: Other users can see your processes and their command lines
    category: kernel
    severity: 4
    modifiers:
      - when: "not multi_user"
        severity: 0
    scope: user
    tier: advice
    why: >
      Without hidepid on /proc, every account can list what you run with its full command line,
      including passwords and tokens passed as arguments.
    detect:
      - '/proc/self/mountinfo: options of the /proc mount; hidepid=2 or hidepid=invisible (or 1/noaccess) hides them'
    fix: >
      Explain the fstab option (hidepid=invisible,gid=proc) and that systemd-logind, polkit and
      monitoring tools need the gid exception; some distributions break without it. Never automate.
    remedy: >
      Other accounts can see which programs you run. Hiding them takes a careful change to how /proc
      is mounted; How to… explains it and what can break.
    related: [auth.shell_history_secrets, kern.dmesg_restrict]
    verify: Which distributions' logind and polkit work with hidepid out of the box.

  - id: kern.init_on_free
    title: Freed memory isn't cleared (init_on_free)
    category: kernel
    severity: 1
    scope: system
    tier: advice
    why: >
      Freed memory keeps its old contents until it is reused, so secrets linger a little longer for
      a memory dump or cold-boot attack to find. Defence in depth with a real performance cost, which
      is why few distributions enable it; live data is in memory either way, so it narrows the risk
      rather than removing it.
    detect:
      - '/proc/cmdline init_on_free='
      - 'CONFIG_INIT_ON_FREE_DEFAULT_ON in /boot/config-$(uname -r) or /proc/config.gz'
    fix: Explain the kernel parameter and its performance cost.
    remedy: >
      Optional extra protection with a performance cost. How to… shows the boot option for this
      computer's bootloader.

  - id: kern.init_on_alloc
    title: Kernel memory isn't cleared before use (init_on_alloc)
    category: kernel
    severity: 4
    scope: system
    tier: advice
    why: >
      Kernel hardening against bugs that leak uninitialised kernel memory to programs. Not a serious
      threat on its own, but it is on by default in almost every distribution kernel, costs almost
      nothing and meaningfully improves security, so finding it off is strange: it usually means a
      custom kernel or a boot option turned it off, and is worth looking into.
    detect:
      - '/proc/cmdline init_on_alloc='
      - 'CONFIG_INIT_ON_ALLOC_DEFAULT_ON in the kernel config'
    fix: Explain the kernel parameter and its performance cost.
    remedy: >
      Nearly every distribution has this on. How to… shows the boot option to turn it back on for this
      computer's bootloader.

  - id: kern.landlock
    title: Kernel can't keep sandboxed programs from the session's hidden sockets (Landlock)
    category: kernel
    severity: 1
    scope: user
    tier: advice
    why: >
      Landlock lets a program fence itself and everything it starts. From Linux 6.12 (Landlock ABI 6) it can also
      keep a sandbox from abstract Unix sockets made outside it (an X server's or XWayland's, sometimes a session
      D-Bus bus) and from signalling programs outside it. A sandbox that shares the computer's network (the
      browser in memory without a network of its own, other bubblewrap sandboxes) can otherwise connect to those
      sockets: through XWayland, a taken-over browser could read and type into other programs' windows.
      Defence in depth: most programs aren't sandboxed, and a sandbox with its own network doesn't need it.
    detect:
      - '/sys/kernel/security/lsm: landlock in the list of active security modules'
      - 'The running kernel: landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION) returns the ABI version
        (6 or more for scopes); EOPNOTSUPP means built in but not turned on at boot'
      - 'Without the syscall (a fixture): /proc/sys/kernel/osrelease 6.12 or later'
      - 'CONFIG_SECURITY_LANDLOCK in /boot/config-$(uname -r) or /proc/config.gz: whether it is built in at all'
    fix: >
      A kernel 6.12 or newer from the distribution (Ubuntu 24.04 and Mint 22: the HWE kernel; Debian 12:
      bookworm-backports; Debian 13, Fedora, Arch and openSUSE Tumbleweed have it); when it is built in but not
      active, lsm= on the kernel command line with landlock added to the active list.
    remedy: >
      Your kernel can't keep sandboxed programs, such as the app's sandboxed browser, from other programs' hidden
      sockets. It is extra protection, not a problem on its own. How to… shows how to get a kernel that can,
      for this computer.
    related: [sbx.x11_session]
    verify: >
      The HWE package name on Linux Mint 22 (linux-generic-hwe-24.04, or Update Manager's kernel list) and that
      bookworm-backports carries 6.12 or later for Debian 12.

  - id: kern.suspend_keys_in_ram
    title: Suspend keeps disk keys in RAM
    category: kernel
    severity: 3
    modifiers:
      - when: "device == 'desktop'"
        severity: 1
      - when: "fde == 'none'"
        severity: 0
    kind: hygiene
    scope: user
    tier: guided
    why: A stolen sleeping laptop has its keys in memory, exposed to DMA or cold-boot attacks.
    detect:
      - 'Informational for laptops with FDE'
      - 'What takes the keys out of memory, as set up: cryptsetup-suspend (its systemd-suspend.service.d drop-in); what
        closing the lid does: Plasma''s powerdevilrc [Battery][SuspendAndShutdown] LidAction and SleepMode (standby, then
        hibernate), Cinnamon''s lid-close-battery-action (hibernate; it holds logind''s lid inhibitor, inhibit-lid-switch),
        else logind.conf''s HandleLidSwitch (hibernate, suspend-then-hibernate); with hibernation working and its image
        encrypted, a pass. Set up but hibernation not working: a fail that says so'
      - 'Memory encryption: /proc/cpuinfo flags sme (AMD; active with mem_encrypt=on or
        CONFIG_AMD_MEM_ENCRYPT_ACTIVE_BY_DEFAULT) or tme (Intel; turned on in firmware, the kernel
        log says "x86/tme: enabled by BIOS")'
    fix: >
      Advise shutting down when travelling; note memory encryption when the CPU has it but it is off. Where
      hibernation works and its image goes to encrypted storage: suspend-then-hibernate (the helper's sleep.conf.d
      HibernateDelaySec and logind.conf.d lid and suspend-key drop-ins), so a machine left asleep powers off and
      the keys leave memory. On Debian and Ubuntu with the root filesystem on LUKS: cryptsetup-suspend (the
      package), which wipes the key on suspend and asks for the passphrase on resume, as commands.
    remedy: >
      Asleep, the computer keeps the disk unlocked in memory. Shut down when you travel; Guide… offers
      hibernating after a while asleep, where that is safe.
    verify: >
      PowerDevil's SleepMode numbers (1 standby, 2 hybrid sleep, 3 standby then hibernate) and LidAction's (1 sleep,
      2 hibernate) on a laptop with Plasma 6; that GNOME leaves the lid to logind. Seen on Mint 22.3: Cinnamon's
      settings daemon holds the lid (inhibit-lid-switch true, lid-close-*-action suspend) and its media-keys daemon the
      suspend and power keys; cryptsetup-suspend is packaged on Ubuntu 26.04 (2.8.4).

  - id: kern.usb_trusted
    title: USB devices are trusted on sight
    category: kernel
    kind: info
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "device == 'laptop'"
        severity: 3
      - when: "virtualization != 'none'"
        severity: 0
    scope: user
    tier: advice
    why: >
      A device that looks like a cable, a charger or a memory stick can tell the computer it is a keyboard
      and type commands into your session within seconds (BadUSB, "rubber ducky"); others pose as a network
      card and redirect your traffic. Linux accepts any USB device plugged in, even with the screen locked.
      It takes someone at the machine, or a gift of a device, so it matters most for a laptop taken
      out. A virtual machine's USB is decided by its host. It is how nearly every Linux computer is set up,
      so it is listed for information, not counted as a finding.
    detect:
      - '/sys/bus/usb/devices/usbN/authorized_default (1 = every device, the default; 0 = none until allowed; 2 =
        built-in only)'
      - 'USBGuard: usbguard-daemon installed, systemctl is-active usbguard.service'
      - 'GNOME: org.gnome.desktop.privacy usb-protection and usb-protection-level (it uses USBGuard)'
    fix: >
      Advice with How to…: install USBGuard, generate a policy from the devices plugged in now (so the
      keyboard isn't locked out), enable it; on GNOME, usb-protection with level lockscreen (new devices
      are blocked only while the screen is locked) and the IPC group that lets GNOME Shell talk to the
      daemon; allowing a new device with usbguard allow-device -p. Never automated: a wrong policy can lock
      out a USB keyboard.
    remedy: >
      Like almost every Linux computer, this one trusts any USB device plugged into it at once, including one
      made to look harmless that types commands as if it were a keyboard. Worth knowing if the computer is
      left where others can reach it, or someone gives you a USB device. How to… sets up USBGuard, so only the
      devices you allow can connect, or on GNOME only while the screen is locked.
    related: [kern.dma]
    verify: >
      USBGuard's IPCAllowedGroups default per distribution (GNOME Shell needs it to block devices at the lock
      screen), and whether Debian's package generates a policy from the devices present when installed.

  - id: kern.dma
    title: Thunderbolt/DMA protections weak
    category: kernel
    severity: 3
    scope: user
    tier: advice
    detect:
      - 'boltctl domains (security level); /sys/bus/thunderbolt/devices/domain*/security'
      - '/sys/bus/thunderbolt/devices/domain*/iommu_dma_protection; ls /sys/class/iommu'
    fix: Explain enabling IOMMU and bolt security levels. Note that memory encryption (SME/TME) is no substitute.
    remedy: >
      Devices plugged into Thunderbolt or USB4 ports could read memory. How to… shows how to turn on
      the protections on this computer.

# ---------------------------------------------------------------------------
# ONLINE TESTS (scope: online). Never part of a normal scan: they run only when the user starts
# them, after seeing every host each one contacts. Endpoints are configurable (online.json).
# ---------------------------------------------------------------------------

  - id: tel.observed_traffic
    title: Phone-home traffic seen on the network
    category: telemetry
    severity: 4
    warn_lower: 2
    scope: online
    tier: advice
    why: >
      Settings say what should happen; watching the traffic shows what does. Confirms that telemetry,
      crash reporting and connectivity checks you turned off really stopped.
    detect:
      - 'With root: resolvectl monitor --json=short (DNS names asked) and ss -tunp samples (which program) for N seconds'
      - 'Without root: ss -tunp samples of your own programs, matched against addresses of known phone-home hosts'
      - 'Match names against a list of known telemetry, crash-report, connectivity-check and location hosts'
      - 'Other names are only counted per program, never listed: they would be your browsing'
    fix: Point to the check that turns off what was seen (browser telemetry, crash reporters, connectivity check...).
    remedy: >
      Each connection seen names the check that turns it off; open that check to stop it.
    contacts:
      - 'Nobody: it only watches. Without root it looks up the addresses of known phone-home hosts (your DNS resolver sees those lookups).'
    related: [tel.browser_telemetry, tel.crash_reporters, net.connectivity_check, tel.devtools, tel.location]
    verify: The host list, and resolvectl monitor's JSON format (systemd 254+).

  - id: net.dns_encryption_in_use
    title: DNS over TLS configured but not used
    category: network
    severity: 3
    warn_lower: 2
    scope: online
    tier: guided
    why: >
      systemd-resolved can be set to DNS over TLS yet fall back to plain DNS (opportunistic mode, or a
      server that doesn't support it) without saying so.
    detect:
      - 'Only when resolved has DNSOverTLS set'
      - 'resolvectl query --cache=no <probe name>: "Data was acquired via local or encrypted transport: yes|no"'
    fix: >
      Use DNSOverTLS=yes with a server that supports it: net.dns_unencrypted's guide, with its provider options,
      built for this check from the test's kept result (never by running the test again).
    remedy: >
      Encrypted DNS is set up, but lookups still go out unencrypted: the DNS server it points at doesn't
      support DNS over TLS. Guide… switches to a provider that does (the same choice as in “Unencrypted DNS”).
    contacts:
      - 'Your configured DNS server: one lookup of example.com.'
    related: [net.dns_unencrypted]
    verify: The resolvectl query output line across systemd versions.

  - id: net.dns_leak
    title: DNS queries leak outside the VPN
    category: network
    severity: 7
    modifiers:
      - when: "not vpn_active"
        severity: 1
    scope: online
    tier: advice
    why: >
      With a VPN on, the sites you look up should be resolved through it. If queries reach your
      internet provider's resolvers instead, it sees every site you visit despite the VPN.
    detect:
      - 'Get a test id from the leak-test service, look up unique names under it, ask the service which resolvers asked'
      - 'With a VPN: each resolver''s network (as the service names it) is the exit''s own, the VPN provider''s, a hosting
        network or a public DNS service (vpn-providers.yaml: exit_networks, datacentres, public_dns), or an ordinary
        provider''s; only the last is a leak (VPNs often rent their DNS servers from a different hosting company)'
      - 'Without a VPN: informational, shows who resolves your names'
    fix: Use the VPN's DNS (its app's DNS leak protection), or route all DNS through the tunnel (resolved ~. on the VPN link).
    remedy: >
      Some other network's DNS server answers your lookups while the VPN is on, and sees every site you
      look up. Turn on your VPN app's DNS leak protection, or route all DNS through the VPN: How to…
      names your VPN and gives the commands for this computer.
    contacts:
      - 'bash.ws (the leak-test service): sees your public IP address and which resolvers asked for its test names.'
      - 'Your DNS resolvers: ten lookups of random names under bash.ws.'
    related: [net.vpn_leaks]

  - id: net.dnssec_validation
    title: DNS answers aren't checked with DNSSEC
    category: network
    severity: 2
    scope: online
    tier: advice
    why: >
      Without DNSSEC validation, a forged DNS answer (on public Wi-Fi, or from a compromised
      resolver) is accepted and can send you to the wrong server.
    detect:
      - 'Look up a correctly signed name (it must resolve) and dnssec-failed.org (deliberately broken: must fail)'
    fix: Explain resolved's DNSSEC= setting and validating resolvers; many networks break DNSSEC, so allow-downgrade is common.
    remedy: >
      DNS answers aren't checked for forgery. Use a DNS provider that validates them (Quad9,
      Cloudflare), or turn on validation in systemd-resolved: How to… gives the commands for this computer.
    contacts:
      - 'Your DNS resolver: lookups of example.com and dnssec-failed.org (its servers see the second lookup).'

  - id: net.nxdomain_rewrite
    title: Failed DNS lookups are redirected
    category: network
    severity: 4
    scope: online
    tier: advice
    why: >
      Some providers and routers answer lookups of names that don't exist with their own server (for
      search pages or ads): they are reading and altering your DNS.
    detect:
      - 'Look up a random, non-existent .com name; any address in reply means NXDOMAIN rewriting'
      - 'A resolver that answers SERVFAIL (Python: temporary failure) instead of NXDOMAIN: retry once, then look up a known name; if that works, nothing was rewritten'
    fix: Use a different DNS resolver (or DNS over TLS), and turn off "DNS assist" / "search help" in the provider account or router.
    remedy: >
      Your DNS provider or router sends mistyped addresses to its own pages. Use another DNS provider
      (the Guide… of “Unencrypted DNS” sets one, encrypted), or turn off "DNS assist" in the router or
      provider account: How to… names the resolver answering and where to turn it off.
    contacts:
      - 'Your DNS resolver: one lookup of a random, non-existent .com name (the .com servers see it too), asked again once if it fails, then example.com if it still does.'
    related: [net.dns_unencrypted]

  - id: net.vpn_ipv6_leak
    title: IPv6 traffic bypasses the VPN
    category: network
    severity: 7
    modifiers:
      - when: "not vpn_active"
        severity: 0
    scope: online
    tier: advice
    why: >
      Many VPN setups only carry IPv4. If IPv6 still works outside the tunnel, sites reachable over
      IPv6 see your real address.
    detect:
      - 'IPv6 default route via a non-VPN interface'
      - 'Ask an IPv6 address echo service which address it sees; a global address of a non-VPN interface is a leak'
      - 'Also show the public IPv4 address websites see'
    fix: Turn on the VPN's IPv6 support or leak protection, or disable IPv6 on the physical interface while the VPN is on.
    remedy: >
      IPv6 traffic goes around the VPN. Turn on the VPN's IPv6 support or leak protection, or turn
      IPv6 off while the VPN is on: How to… gives the commands for the connection it leaks through.
    contacts:
      - 'api.ipify.org and api6.ipify.org (address echo services): see your public IPv4 and IPv6 addresses.'
    related: [net.vpn_leaks, net.dns_leak]

  - id: net.vpn_exit
    title: Traffic doesn't leave through the VPN
    category: network
    severity: 7
    warn_lower: 2
    scope: online
    tier: advice
    why: >
      A VPN is only doing its job if websites see its address instead of yours. A tunnel that is up can
      still carry nothing, a VPN app can be connected to a different server than it says, and a VPN on
      the router often carries IPv4 only, so IPv6 goes out through your internet provider, showing
      your real address to every site reachable over IPv6.
    detect:
      - 'Public IPv4 and IPv6 addresses from two echo services each (they must agree), or from the VPN provider''s own check service when it is the one in use (Mullvad, IVPN)'
      - 'Who owns each address: the provider''s check service, else RIPEstat (prefix-overview); matched against vpn-providers.yaml (provider networks, datacentres)'
      - 'Local tunnel carrying traffic: the provider''s service must call the exit its own, and name the server its app reports; an exit in a residential network is suspect'
      - 'No local tunnel, default route to a LAN gateway, exit in a known VPN or datacentre network: a VPN upstream (likely the router; the host, in a VM)'
      - 'One family through a VPN or datacentre network and the other through an ordinary provider: a bypass'
    fix: >
      Point to the VPN app's IPv6 setting or leak protection, the router's VPN settings (tunnel IPv6 too, or turn IPv6 off
      on the LAN), or reconnecting the app. Path MTU and traceroute were considered as corroboration and left out (PPPoE
      shrinks the MTU too).
    remedy: >
      Websites don't see the VPN's address for all your traffic. If IPv6 goes around a VPN on your
      router, turn on IPv6 in the router's VPN settings, or turn IPv6 off on your home network. If
      the VPN app is connected, reconnect it and turn on its leak protection. How to… gives the steps
      for this computer.
    contacts:
      - 'api.ipify.org and api6.ipify.org, ipv4.icanhazip.com and ipv6.icanhazip.com (address echo services): see your public IPv4 and IPv6 addresses.'
      - 'stat.ripe.net (RIPEstat, run by the RIPE NCC internet registry): is asked who owns those addresses, so sees them.'
      - 'Only when Mullvad or IVPN is the VPN in use: their own check service (am.i.mullvad.net, api.ivpn.net) instead of the second echo service and RIPEstat.'
    related: [net.vpn_ipv6_leak, net.vpn_provider, net.dns_leak]
    verify: >
      am.i.mullvad.net/json fields (mullvad_exit_ip, mullvad_exit_ip_hostname, organization); api.ivpn.net/v4/geo-lookup
      fields (isIvpnServer); RIPEstat holder names for the providers in vpn-providers.yaml. Seen 2026-10-04 with
      Proton VPN: ipify and icanhazip agreed on both families, prefix-overview's holder reads "M247 M247 Europe SRL"
      (handle, then company), and Proton's exit was in M247's network.

  - id: net.upnp_forwards
    title: The router forwards internet ports to this machine (UPnP)
    category: network
    severity: 6
    scope: online
    tier: advice
    why: >
      Apps (games, torrent clients, media servers) can ask the router to open ports to them with
      UPnP, without asking you. Those services are then reachable from the whole internet.
    detect:
      - 'SSDP search for an Internet Gateway Device on the local network'
      - 'Its description, then GetGenericPortMappingEntry for each mapping; keep those whose internal client is this machine'
    fix: Turn off UPnP in the app that opened the port, or in the router. Then check the service with net.exposed_services.
    remedy: >
      Your router has opened ports to this computer because a program asked. Turn off UPnP in that
      program, or in the router: How to… names the program each port leads to and opens the router's page.
    contacts:
      - 'Your router only (local network): an SSDP search and its UPnP control interface. Nothing on the internet.'
    related: [net.exposed_services, net.firewall_off]

  - id: net.tls_interception
    title: Encrypted connections are intercepted
    category: network
    severity: 7
    warn_lower: 3
    scope: online
    tier: advice
    why: >
      A corporate proxy, antivirus "web shield" or network device that decrypts HTTPS sees passwords,
      messages and everything else sent to websites.
    detect:
      - 'TLS connections to a few well-known sites; who issued their certificates'
      - 'An issuer known for interception (antivirus, corporate proxies, debugging proxies) fails; an unknown issuer or an untrusted certificate warns'
      - 'Also note root certificates added locally (/usr/local/share/ca-certificates, /etc/pki/ca-trust/source/anchors, ...)'
    fix: Find the product doing it (the issuer names it) and turn off its HTTPS scanning, or remove its root certificate.
    remedy: >
      Something is decrypting your HTTPS connections. Find the product named as the issuer (often
      antivirus or a workplace proxy) and turn off its HTTPS scanning, or remove its certificate: How to…
      names the issuer seen and gives the commands that find and remove it on this computer.
    contacts:
      - 'www.wikipedia.org, www.mozilla.org, letsencrypt.org, www.debian.org: a TLS connection to each (they see your IP address).'
    verify: The lists of public and intercepting issuers.

  - id: kern.updates_refreshed
    title: Security updates not applied (with fresh package lists)
    category: kernel
    severity: 2
    warn_lower: 2
    modifiers:
      - when: "security_updates_pending"
        severity: 6
      - when: "kernel_update_pending or kernel_restart_pending"
        severity: 7
    scope: online
    tier: advice
    why: >
      The offline check counts only updates the machine already knows about; this one fetches fresh
      package lists first, so it also counts what was published since your last refresh. Graded as
      the offline check is.
    detect:
      - 'apt: apt-get update into a temporary lists directory as you (the system lists are not touched), then apt list --upgradable'
      - 'dnf: dnf check-update --refresh (and updateinfo --security); pacman: checkupdates; flatpak remote-ls --updates; snap refresh --list'
    fix: Install the updates (kern.updates' guide, as commands only).
    remedy: >
      Security updates are waiting. How to… gives the command that installs them on this computer
      (the same as the Guide… of “Updates waiting to be installed”).
    contacts:
      - 'Your distribution''s package mirrors (as in its repository files), Flathub and the Snap Store if used: they see your IP address. apt downloads tens of MB of lists.'
    related: [kern.updates]
    verify: apt-get update as a normal user into its own lists directory.

  - id: net.ipv6_reachable
    title: Services reachable from the internet over IPv6
    category: network
    severity: 6
    warn_lower: 2
    modifiers:
      - when: "not ipv6_global"
        severity: 0
    scope: online
    tier: guided
    why: >
      With a public IPv6 address there is no home-router NAT in the way: a listening service the
      host firewall lets through can be reached from anywhere, unless the router blocks it.
    detect:
      - 'Listening services on all interfaces that the host firewall lets through'
      - 'With a port probe server of your own (online.json port_probe): ask it to connect to each one from outside,
        at this computer''s own global address (not a VPN tunnel''s, as the ipv6_global context counts them; the
        interface IPv6 traffic leaves by first)'
      - 'Otherwise: likely reachable; confirm with daprivacyscanner --probe from a device on another network'
    fix: >
      Stop the service, bind it to a local address, or block it in the host firewall: net.exposed_services' guide,
      built for this check from the services listening now (never by running the test again).
    remedy: >
      Services here can be reached from the internet over IPv6. Guide… turns each one off or keeps it to
      this computer, as for “Services listening on all interfaces”; the firewall check covers the rest.
    contacts:
      - 'Nobody by default. With a port probe server set: that server, which connects to your public IPv6 address on the listed ports.'
    related: [net.exposed_services, net.firewall_off]
