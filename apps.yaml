# apps.yaml
# The apps whose files the checks read or whose settings the fixes change, and the version each was made for.
# Apps change where and how they keep their data, most often in a major release. When an app here is installed in a
# newer major version than `checked`, every check listed under it gets a note saying so (and its fix's dry run a
# line), and a check that found nothing, where the app keeps nothing where it used to (`data`), says it couldn't
# check rather than passing. app.newer_than_checked lists them all. Shipped with each release, copied into the
# package like the catalogue.
#
# packaging/check-app-versions.py compares `checked` with the latest release upstream (Repology), writes a review
# brief for the apps with a new major version (what to read, what the checks rely on), and records a version once
# it is reviewed (--mark). See packaging/README.md.
#
# SCHEMA (list `apps`)
#   id           Stable identifier. Never rename once shipped.
#   name         As its maker calls it.
#   packages     Package names (dpkg, rpm, pacman) the installed version is read from; the newest installed counts.
#   flatpak      Flatpak app ids. snap: snap names. At least one of packages, flatpak, snap.
#   checked      The version the checks and fixes were made for.
#   basis        tested   checked on a real system at that version
#                current  the release current when the checks were written (`checked_on`), not tested at it
#   checked_on   When (YYYY-MM-DD).
#   major_parts  How many of the version's numbers make its major version: 1 (default; Firefox 157), 2 where the
#                first number never moves (VS Code 1.105, mpv 0.40, LibreOffice 25.8).
#   tolerance    Major versions ahead before the note shows, for apps with a new major version every few weeks
#                (Firefox, Chromium): 3 is about three months. Default 0.
#   checks       Catalogue ids of the checks that read it (a test keeps them in step with the catalogue).
#   data         Where it keeps what the checks read, as <config|data|cache|state|home>:<path>; looked for natively,
#                in its Flatpak and in its Snap. Nothing there while a newer major version is installed: "couldn't
#                check". Left out for apps whose settings live in gsettings, /etc or a command's output.
#   relies_on    What the checks and fixes rely on (files, keys, tables, commands): what to compare in a new release.
#   upstream     repology (its project name there; absent: no version source), notes (release notes), source (code).
#   verify       Developer note: something to confirm. Developer mode only.

schema_version: 1

apps:

  - id: firefox
    name: "Firefox"
    packages: [firefox, firefox-esr]
    flatpak: [org.mozilla.firefox]
    snap: [firefox]
    checked: "157"
    basis: tested
    checked_on: 2026-10-07
    tolerance: 3
    checks: [auth.firefox_no_primary_password, br.account_sync, br.ad_features, br.content_blocking, br.crashpad_dumps, br.default_browser, br.disk_cache, br.extensions_broad, br.history_retention, br.https_only, br.site_permissions, br.tracking_protection, br.vpn_extensions, br.webrtc, net.dns_unencrypted, tel.browser_telemetry]
    data: [home:.mozilla/firefox, config:mozilla/firefox]
    relies_on: >-
      profiles.ini (in ~/.mozilla/firefox, and ~/.config/mozilla/firefox for profiles made since 147); in each profile
      prefs.js and user.js (the preference names), logins.json and key4.db, extensions.json and
      extension-preferences.json, permissions.sqlite (moz_perms), the cache in ~/.cache/mozilla; policies.json in
      /etc/firefox/policies and the install's distribution folder
    upstream:
      repology: firefox
      notes: https://www.mozilla.org/en-US/firefox/releases/
      source: https://github.com/mozilla-firefox/firefox

